<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 344" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Paramètres totaux et actifs : Mixtral 47 milliards au total et 13 actifs, DeepSeek-V3 671 milliards au total et 37 actifs</title>
<desc id="fig2-d">Mixtral utilise environ 28 % de ses paramètres par token (13 sur 47 milliards). DeepSeek-V3 en utilise environ 5,5 % (37 sur 671 milliards). Chiffres annoncés par les auteurs.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db;--f-ok:#1a6b2f;--f-warn:#9a4a00}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c;--f-ok:#6fdc8c;--f-warn:#ffa85c}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .bar{fill:var(--raised,var(--f-raised));stroke:var(--text,var(--f-text));stroke-width:1}
.fig2 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig2 .gr{fill:var(--raised,var(--f-raised));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig2 .ln{stroke:var(--muted,var(--f-muted));stroke-width:1.5;fill:none}
.fig2 .c{text-anchor:middle}.fig2 .e{text-anchor:end}
</style>
<g class="fig2">
<text class="h" x="10" y="18">Paramètres totaux et actifs</text>
<text class="m" x="10" y="38">Échelle commune, en milliards</text>
<text class="s" x="10" y="66">Mixtral</text>
<rect class="bar" x="10" y="74" width="26.6" height="26"/><text class="t" x="44.6" y="92">total : 47 milliards</text>
<rect class="sh" x="10" y="106" width="7.4" height="26"/><text class="t" x="25.4" y="132">actifs : 13 milliards</text>
<text class="m" x="10" y="156">≈ 28 % des paramètres par token (13 / 47)</text>
<text class="s" x="10" y="190">DeepSeek-V3</text>
<rect class="bar" x="10" y="198" width="380.0" height="26"/><text class="t" x="18.0" y="216">total : 671 milliards</text>
<rect class="sh" x="10" y="230" width="21.0" height="26"/><text class="t" x="39.0" y="256">actifs : 37 milliards</text>
<text class="m" x="10" y="280">≈ 5,5 % des paramètres par token (37 / 671)</text>
<rect class="bar" x="10" y="298" width="16" height="12"/><text class="t" x="32" y="309">total</text><rect class="sh" x="100" y="298" width="16" height="12"/><text class="t" x="122" y="309">actifs par token</text>
<text class="m" x="10" y="334">Chiffres annoncés par les auteurs des modèles.</text>
</g>
</svg>
