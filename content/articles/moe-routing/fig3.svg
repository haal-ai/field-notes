<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 392" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">Grille de choix du router : 6 couches sur 10 tokens</title>
<desc id="fig3-d">Chaque case est un choix du router, pour un token et une couche, avec 2 experts marqués par 2 couleurs parmi 8. Dans l'exemple, certains experts reviennent souvent, d'autres rarement. Exemple inventé.</desc>
