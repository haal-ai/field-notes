<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">Trajet d'une requête dans la chaîne sur un portable</title>
<desc id="fig3-d">Le prompt part du harness, traverse l'API gateway et l'inference server, puis atteint le modèle sur le GPU. Les tokens reviennent en flux. Figure illustrative, sans mesure.</desc>
<style>
.fig3{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig3{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig3 text{font-family:system-ui,sans-serif;font-size:13px}
.fig3 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig3 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig3 .t{fill:var(--text,var(--f-text))}
.fig3 .m{fill:var(--muted,var(--f-muted))}
.fig3 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig3 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig3 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig3 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .bar{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig3 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig3 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig3 .sep{stroke:var(--line,var(--f-line));stroke-width:1;stroke-dasharray:4 3}
.fig3 .c{text-anchor:middle}
</style>
<g class="fig3">
<text class="h" x="10" y="18">Trajet d'une requête (illustratif)</text>
<text class="a" x="250" y="52">tokens</text>
<text class="a" x="250" y="69">renvoyés en flux</text>
<rect class="box" x="6" y="34" width="200" height="40" rx="5"/>
<text class="s" x="16" y="59">Harness</text>
<path class="ln" d="M106 74 V108 M101 102 L106 108 L111 102"/>
<text class="m" x="118" y="96">prompt</text>
<rect class="box" x="6" y="108" width="200" height="40" rx="5"/>
<text class="s" x="16" y="133">API gateway</text>
<path class="ln" d="M106 148 V182 M101 176 L106 182 L111 176"/>
<text class="m" x="118" y="170">prompt</text>
<rect class="box" x="6" y="182" width="200" height="40" rx="5"/>
<text class="s" x="16" y="207">Inference server</text>
<path class="ln" d="M106 222 V256 M101 250 L106 256 L111 250"/>
<text class="m" x="118" y="244">prompt</text>
<rect class="box" x="6" y="256" width="200" height="40" rx="5"/>
<text class="s" x="16" y="281">Modèle (GPU)</text>
<path class="ln" d="M206 276 H300"/>
<path class="ln" d="M300 276 V80 M295 86 L300 80 L305 86"/>
<text class="m" x="10" y="316">Un seul client, une seule machine, une seule</text>
<text class="m" x="10" y="333">exécution : aucune mesure publiée.</text>
</g>
</svg>
