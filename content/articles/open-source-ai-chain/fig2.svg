<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Remplacer une couche : les autres ne changent pas</title>
<desc id="fig2-d">Deux piles identiques de cinq couches. Dans la seconde, seul l'inference server change (serveur A devient serveur B). Les quatre autres couches sont inchangées. Dans la configuration, seule l'adresse change ; le nom du modèle aussi si le serveur le demande.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig2 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .bar{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig2 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .sep{stroke:var(--line,var(--f-line));stroke-width:1;stroke-dasharray:4 3}
.fig2 .c{text-anchor:middle}
</style>
<g class="fig2">
<text class="h" x="10" y="18">Remplacer une couche</text>
<text class="s" x="10" y="44">Avant</text>
<text class="s" x="206" y="44">Après</text>
<rect class="box" x="6" y="54" width="190" height="44" rx="5"/>
<text class="s" x="16" y="73">Plateforme de bots</text>
<text class="m" x="16" y="90">inchangé</text>
<rect class="box" x="204" y="54" width="190" height="44" rx="5"/>
<text class="s" x="214" y="73">Plateforme de bots</text>
<text class="m" x="214" y="90">inchangé</text>
<rect class="box" x="6" y="106" width="190" height="44" rx="5"/>
<text class="s" x="16" y="125">Harness</text>
<text class="m" x="16" y="142">inchangé</text>
<rect class="box" x="204" y="106" width="190" height="44" rx="5"/>
<text class="s" x="214" y="125">Harness</text>
<text class="m" x="214" y="142">inchangé</text>
<rect class="box" x="6" y="158" width="190" height="44" rx="5"/>
<text class="s" x="16" y="177">API gateway</text>
<text class="m" x="16" y="194">inchangé</text>
<rect class="box" x="204" y="158" width="190" height="44" rx="5"/>
<text class="s" x="214" y="177">API gateway</text>
<text class="m" x="214" y="194">inchangé</text>
<rect class="dif" x="6" y="210" width="190" height="44" rx="5"/>
<text class="s" x="16" y="229">Inference server</text>
<text class="k" x="16" y="246">serveur A</text>
<rect class="dif" x="204" y="210" width="190" height="44" rx="5"/>
<text class="s" x="214" y="229">Inference server</text>
<text class="k" x="214" y="246">serveur B</text>
<rect class="box" x="6" y="262" width="190" height="44" rx="5"/>
<text class="s" x="16" y="281">Modèle</text>
<text class="m" x="16" y="298">inchangé</text>
<rect class="box" x="204" y="262" width="190" height="44" rx="5"/>
<text class="s" x="214" y="281">Modèle</text>
<text class="m" x="214" y="298">inchangé</text>
<rect class="box" x="6" y="318" width="388" height="46" rx="5"/>
<text class="a" x="16" y="338">Ce qui change : l'adresse ;</text>
<text class="a" x="16" y="356">le nom du modèle si le serveur le demande.</text>
</g>
</svg>
