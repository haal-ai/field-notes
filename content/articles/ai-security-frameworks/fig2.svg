<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 332" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">De la liste de contrôles AICM à STAR for AI</title>
<desc id="fig2-d">Séquence : la matrice AICM liste 247 objectifs en 18 domaines. Le questionnaire AI-CAIQ interroge le fournisseur. Puis STAR for AI niveau 1, auto-évaluation publiée dans un registre public. Le niveau 2, évaluation indépendante (certification ISO ou attestation SOC 2, avec l'AICM), suppose d'abord le niveau 1.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig2 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .sh{fill:var(--accent,var(--f-accent))}
.fig2 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .c{text-anchor:middle}
</style>
<g class="fig2">
<text class="h" x="10" y="18">De la liste de contrôles à l'évaluation</text>
<rect class="box" x="6" y="30" width="388" height="48" rx="5"/>
<text class="a" x="18" y="52">1. AICM</text>
<text class="t" x="18" y="70">247 objectifs de contrôle, 18 domaines</text>
<path class="ln" d="M200 78 V94 M195 88 L200 94 L205 88"/>
<rect class="box" x="6" y="94" width="388" height="48" rx="5"/>
<text class="a" x="18" y="116">2. AI-CAIQ</text>
<text class="t" x="18" y="134">Questionnaire posé au fournisseur</text>
<path class="ln" d="M200 142 V158 M195 152 L200 158 L205 152"/>
<rect class="box" x="6" y="158" width="388" height="54" rx="5"/>
<text class="a" x="18" y="180">3. STAR for AI niveau 1</text>
<text class="t" x="18" y="199">Auto-évaluation publiée dans un registre public</text>
<path class="ln" d="M200 212 V228 M195 222 L200 228 L205 222"/>
<rect class="box" x="6" y="228" width="388" height="72" rx="5"/>
<text class="a" x="18" y="250">4. STAR for AI niveau 2</text>
<text class="t" x="18" y="269">Évaluation indépendante : certification ISO</text>
<text class="t" x="18" y="288">ou attestation SOC 2, avec l'AICM</text>
<text class="m" x="10" y="322">Le niveau 2 suppose d'abord le niveau 1.</text>

</g>
</svg>
