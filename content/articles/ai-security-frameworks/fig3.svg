<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">AIUC-1 : du périmètre au rapport d'audit</title>
<desc id="fig3-d">Quatre étapes : périmètre de l'agent ; Statement of Applicability avec contrôles de base par défaut, exclusion d'une exigence justifiée et validée par l'auditeur, contrôles complémentaires au choix ; preuves et tests techniques ; rapport d'audit et certificat. Selon le propriétaire : 4 à 8 semaines, tests chaque trimestre, audit chaque année.</desc>
<style>
.fig3{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig3{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig3 text{font-family:system-ui,sans-serif;font-size:13px}
.fig3 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig3 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig3 .t{fill:var(--text,var(--f-text))}
.fig3 .m{fill:var(--muted,var(--f-muted))}
.fig3 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig3 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig3 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig3 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .sh{fill:var(--accent,var(--f-accent))}
.fig3 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig3 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig3 .c{text-anchor:middle}
</style>
<g class="fig3">
<text class="h" x="10" y="18">AIUC-1 : du périmètre au rapport</text>
<rect class="box" x="6" y="30" width="388" height="32" rx="5"/>
<circle class="sh" cx="26" cy="50" r="11"/><text class="i c" x="26" y="55">1</text>
<text class="s" x="46" y="54">Définir le périmètre de l'agent</text>
<path class="ln" d="M200 62 V76 M195 70 L200 76 L205 70"/>
<rect class="box" x="6" y="76" width="388" height="122" rx="5"/>
<circle class="sh" cx="26" cy="96" r="11"/><text class="i c" x="26" y="101">2</text>
<text class="s" x="46" y="100">Statement of Applicability</text>
<text class="m" x="46" y="118">liste signée par l'auditeur</text>
<text class="t" x="46" y="136">• contrôles de base : inclus par défaut</text>
<text class="t" x="46" y="154">• exclusion d'une exigence : raison écrite +</text>
<text class="t" x="55" y="172">accord de l'auditeur</text>
<text class="t" x="46" y="190">• contrôles complémentaires : au choix</text>
<path class="ln" d="M200 198 V212 M195 206 L200 212 L205 206"/>
<rect class="box" x="6" y="212" width="388" height="68" rx="5"/>
<circle class="sh" cx="26" cy="232" r="11"/><text class="i c" x="26" y="237">3</text>
<text class="s" x="46" y="236">Preuves et tests techniques</text>
<text class="m" x="46" y="254">hallucinations, appels d'outils</text>
<text class="m" x="46" y="272">dangereux, attaques adverses</text>
<path class="ln" d="M200 280 V294 M195 288 L200 294 L205 288"/>
<rect class="box" x="6" y="294" width="388" height="68" rx="5"/>
<circle class="sh" cx="26" cy="314" r="11"/><text class="i c" x="26" y="319">4</text>
<text class="s" x="46" y="318">Rapport d'audit et certificat</text>
<text class="m" x="46" y="336">périmètre et version du standard</text>
<text class="m" x="46" y="354">indiqués</text>
<rect class="dif" x="6" y="374" width="388" height="84" rx="5"/>
<text class="k" x="18" y="396">Selon le propriétaire du standard</text>
<text class="t" x="18" y="414">4 à 8 semaines en général</text>
<text class="t" x="18" y="432">Tests refaits chaque trimestre</text>
<text class="t" x="18" y="450">Nouvel audit chaque année</text>
<text class="m" x="10" y="472">Description du propriétaire, pas une mesure</text>
<text class="m" x="10" y="489">indépendante. Aucune version lue le 2026-11-26.</text>

</g>
</svg>
