<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 420" role="img" aria-labelledby="fig3-title fig3-desc" font-family="Inter,ui-sans-serif,system-ui,sans-serif">
<title id="fig3-title">Cycle de relecture d'un guide</title>
<desc id="fig3-desc">Après une relecture enregistrée, le guide est relu sous six mois (trois si le sujet change vite), ce qui donne une nouvelle relecture, puis le cycle repart. Si la date est dépassée sans relecture, la page affiche À relire : c'est une relecture non faite, pas une erreur.</desc>
<defs><marker id="fig3-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted,#506571)"/></marker><marker id="fig3-arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--due,#865025)"/></marker></defs>
<rect width="390" height="420" fill="var(--bg,#f7f9fa)"/>
<g stroke="var(--line,#b9cbd2)" stroke-width="1.5">
<rect x="44" y="12" width="200" height="52" rx="8" fill="var(--surface,#edf2f4)" stroke="var(--accent,#146b5c)" stroke-width="2.5"/>
<rect x="44" y="104" width="200" height="60" rx="8" fill="var(--surface,#edf2f4)"/>
<rect x="44" y="204" width="200" height="52" rx="8" fill="var(--surface,#edf2f4)" stroke="var(--accent,#146b5c)" stroke-width="2.5"/>
</g>
<g fill="var(--text,#152a34)" font-size="14" font-weight="700" text-anchor="middle"><text x="144" y="44">Relecture enregistrée</text><text x="144" y="130">6 mois — 3 si le sujet</text><text x="144" y="148">change vite</text><text x="144" y="236">Nouvelle relecture</text></g>
<g stroke="var(--muted,#506571)" stroke-width="2" fill="none" marker-end="url(#fig3-arr)"><path d="M144 64V101"/><path d="M144 164V201"/><path d="M44 230H22V38H41"/></g>
<text x="15" y="130" fill="var(--muted,#506571)" font-size="12" transform="rotate(-90 15 130)" text-anchor="middle">le cycle repart</text>
<g stroke="var(--due,#865025)" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#fig3-arrd)"><path d="M244 134H268"/><path d="M322 166V258"/></g>
<rect x="268" y="104" width="108" height="60" rx="8" fill="var(--due-bg,#faeee1)" stroke="var(--due,#865025)" stroke-width="2" stroke-dasharray="6 4"/>
<g fill="var(--text,#152a34)" font-size="13" font-weight="700" text-anchor="middle"><text x="322" y="130">Date</text><text x="322" y="147">dépassée</text></g>
<text x="314" y="192" fill="var(--due,#865025)" font-size="12" text-anchor="end">sans relecture</text>
<rect x="250" y="262" width="130" height="40" rx="20" fill="var(--due,#865025)"/>
<text x="315" y="288" text-anchor="middle" fill="var(--bg,#fff)" font-size="15" font-weight="700">À relire</text>
<text x="315" y="326" text-anchor="middle" fill="var(--text,#152a34)" font-size="13">Pas « faux » :</text>
<text x="315" y="343" text-anchor="middle" fill="var(--text,#152a34)" font-size="13">relecture non faite</text>
<path d="M250 282H144V259" stroke="var(--due,#865025)" stroke-width="2.5" stroke-dasharray="6 4" fill="none" marker-end="url(#fig3-arrd)"/>
<text x="152" y="86" fill="var(--muted,#506571)" font-size="12">dans les temps</text>
<text x="150" y="302" text-anchor="start" fill="var(--due,#865025)" font-size="12">après relecture</text>
<text x="195" y="388" text-anchor="middle" fill="var(--text,#152a34)" font-size="13" font-weight="600">Une relecture manquée donne « À relire »,</text><text x="195" y="405" text-anchor="middle" fill="var(--text,#152a34)" font-size="13" font-weight="600">jamais « faux ».</text>
</svg>
