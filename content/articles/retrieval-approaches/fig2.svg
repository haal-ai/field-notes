<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 486" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Trois méthodes de recherche, un exemple chacune</title>
<desc id="fig2-d">Trois méthodes. Keyword search : trouve les mots exacts ; elle réussit sur « erreur 221 » mais rate « annuler mon abonnement » si le texte dit « stopper la souscription ». Vector search : compare le sens ; elle retrouve « stopper la souscription » pour « annuler mon abonnement », mais « erreur 221 » peut ramener des erreurs voisines. Graph : suit les liens ; seul il traite « quels clients ne sont pas touchés par la panne du fournisseur A ? », car la similarité ne calcule pas un complément.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .big{fill:var(--text,var(--f-text));font-size:17px;font-weight:700}
.fig2 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig2 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .raised{fill:var(--raised,var(--f-raised));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig2 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .c{text-anchor:middle}
</style>
<g class="fig2">
<text class="h" x="10" y="18">Trois méthodes, un exemple chacune</text>
<rect class="box" x="6" y="28" width="388" height="124" rx="5"/>
<text class="a" x="16" y="50">keyword search</text>
<text class="t" x="16" y="70">Comment : Trouve les mots exacts (index).</text>
<text class="t" x="16" y="90">Réussit : « erreur 221 »</text>
<text class="m" x="16" y="110">Échoue : « annuler mon abonnement » si le texte</text>
<text class="m" x="16" y="127">dit « stopper la souscription ».</text>
<rect class="box" x="6" y="162" width="388" height="141" rx="5"/>
<text class="a" x="16" y="184">vector search</text>
<text class="t" x="16" y="204">Comment : Compare le sens (embeddings).</text>
<text class="t" x="16" y="224">Réussit : « annuler mon abonnement » retrouve «</text>
<text class="t" x="16" y="241">stopper la souscription ».</text>
<text class="m" x="16" y="261">Échoue : « erreur 221 » peut ramener des erreurs</text>
<text class="m" x="16" y="278">voisines.</text>
<rect class="box" x="6" y="313" width="388" height="141" rx="5"/>
<text class="a" x="16" y="335">graph</text>
<text class="t" x="16" y="355">Comment : Suit des liens.</text>
<text class="t" x="16" y="375">Réussit : « quels clients ne sont pas touchés par</text>
<text class="t" x="16" y="392">la panne du fournisseur A ? »</text>
<text class="m" x="16" y="412">Limite : La similarité ne calcule pas un</text>
<text class="m" x="16" y="429">complément ; pas le bon outil pour cela.</text>
<text class="m" x="10" y="470">Requêtes inventées, génériques.</text>
</g>
</svg>
