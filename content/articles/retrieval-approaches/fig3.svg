<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 532" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">Fusion RRF : exemple chiffré avec trois documents</title>
<desc id="fig3-d">Une requête donne deux listes classées. En keyword : A rang 1, B rang 2, C rang 4. En vector : A rang 1, C rang 2, B rang 5. Chaque rang donne un score 1/(60 + rang), avec k = 60. A : 1/61 + 1/61 = 0,0328. B : 1/62 + 1/65 = 0,0315. C : 1/64 + 1/62 = 0,0318. La liste fusionnée est A (0,0328), C (0,0318), B (0,0315). B est mieux placé que C en keyword (rang 2 contre 4), mais C gagne grâce à son rang 2 en vector contre 5. Documents inventés.</desc>
<style>
.fig3{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig3{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig3 text{font-family:system-ui,sans-serif;font-size:13px}
.fig3 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig3 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig3 .t{fill:var(--text,var(--f-text))}
.fig3 .m{fill:var(--muted,var(--f-muted))}
.fig3 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig3 .big{fill:var(--text,var(--f-text));font-size:17px;font-weight:700}
.fig3 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig3 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig3 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .raised{fill:var(--raised,var(--f-raised));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig3 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig3 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig3 .c{text-anchor:middle}
</style>
<g class="fig3">
<text class="h" x="10" y="18">Fusion RRF : un exemple chiffré</text>
<rect class="sh" x="100" y="28" width="200" height="30" rx="5"/>
<text class="i c" x="200" y="48">Une requête</text>
<path class="ln" d="M200 58 V68 M100 68 H300 M100 68 V78 M300 68 V78 M95 73 L100 78 L105 73 M295 73 L300 78 L305 73"/>
<rect class="box" x="6" y="78" width="188" height="112" rx="5"/>
<text class="a" x="16" y="100">keyword</text>
<text class="t" x="16" y="124">A : rang 1</text>
<text class="t" x="16" y="146">B : rang 2</text>
<text class="t" x="16" y="168">C : rang 4</text>
<rect class="box" x="206" y="78" width="188" height="112" rx="5"/>
<text class="a" x="216" y="100">vector</text>
<text class="t" x="216" y="124">A : rang 1</text>
<text class="t" x="216" y="146">C : rang 2</text>
<text class="t" x="216" y="168">B : rang 5</text>
<path class="ln" d="M200 190 V204 M195 198 L200 204 L205 198"/>
<rect class="box" x="6" y="204" width="388" height="118" rx="5"/>
<text class="s" x="16" y="224">score = 1/(60 + rang), avec k = 60</text>
<text class="t" x="16" y="250">A : 1/61 + 1/61 = 0,0328</text>
<text class="t" x="16" y="274">B : 1/62 + 1/65 = 0,0315</text>
<text class="t" x="16" y="298">C : 1/64 + 1/62 = 0,0318</text>
<path class="ln" d="M200 322 V336 M195 330 L200 336 L205 330"/>
<rect class="dif" x="6" y="336" width="388" height="96" rx="5"/>
<text class="k" x="16" y="358">Liste fusionnée</text>
<text class="s" x="16" y="380">1. A : 0,0328</text>
<text class="s" x="16" y="398">2. C : 0,0318</text>
<text class="s" x="16" y="416">3. B : 0,0315</text>
<text class="t" x="10" y="458">B est mieux placé que C en keyword (rang 2 contre</text>
<text class="t" x="10" y="475">4), mais C gagne grâce à son rang 2 en vector contre</text>
<text class="t" x="10" y="492">5.</text>
<text class="m" x="10" y="517">Documents inventés.</text>
</g>
</svg>
