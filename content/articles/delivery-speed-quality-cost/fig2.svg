<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 452" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Une fusion propre qui casse</title>
<desc id="fig2-d">Les agents A et B réussissent chacun les tests de leur branche. La fusion se fait sans conflit. Les vérifications sur le résultat combiné échouent, car B appelle la fonction f avec l'ancienne forme que A a changée. Il faut réparer puis vérifier à nouveau.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .j{fill:var(--accent-ink,var(--f-ink))}
.fig2 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig2 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .bar{fill:var(--raised,var(--f-raised));stroke:var(--text,var(--f-text));stroke-width:1}
.fig2 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig2 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig2 .dsh{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2;stroke-dasharray:5 3}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .lk{stroke:var(--news,var(--f-news));stroke-width:1.5;fill:none;stroke-dasharray:5 3}
.fig2 .rg{stroke:var(--accent,var(--f-accent));stroke-width:6;stroke-linecap:round;fill:none}
.fig2 .grid{stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .tick{stroke:var(--text,var(--f-text));stroke-width:1.5}
.fig2 .dot{fill:var(--news,var(--f-news));stroke:var(--text,var(--f-text));stroke-width:1}
.fig2 .ah{fill:var(--accent,var(--f-accent))}
.fig2 .ahk{fill:var(--news,var(--f-news))}
.fig2 .c{text-anchor:middle}.fig2 .e{text-anchor:end}
</style>
<defs><marker id="fig2-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker><marker id="fig2-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahk" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="fig2">
<text class="h" x="10" y="18">Une fusion propre qui casse</text>
<text class="m" x="10" y="40">Exemple illustratif inventé pour la page.</text>
<rect class="bar" x="10" y="54" width="185" height="76" rx="5"/>
<rect class="bar" x="205" y="54" width="185" height="76" rx="5"/>
<text class="s" x="20" y="74">Agent A</text>
<text class="t" x="20" y="94">change la forme du</text>
<text class="t" x="20" y="112">résultat de la fonction f</text>
<text class="s" x="215" y="74">Agent B</text>
<text class="t" x="215" y="94">ajoute un appelant qui</text>
<text class="t" x="215" y="112">attend l'ancienne forme</text>
<rect class="sh" x="10" y="142" width="185" height="30" rx="5"/>
<rect class="sh" x="205" y="142" width="185" height="30" rx="5"/>
<text class="i c" x="102" y="162">✓ tests de A : OK</text>
<text class="i c" x="297" y="162">✓ tests de B : OK</text>
<path class="ln" d="M102 172 V196 H160 V204" marker-end="url(#fig2-ar)"/>
<path class="ln" d="M297 172 V196 H240 V204" marker-end="url(#fig2-ar)"/>
<rect class="box" x="60" y="208" width="280" height="32" rx="5"/>
<text class="s c" x="200" y="229">Fusion Git : sans conflit</text>
<line class="ln" x1="200" y1="240" x2="200" y2="260" marker-end="url(#fig2-ar)"/>
<rect class="dif" x="15" y="264" width="370" height="52" rx="5"/>
<text class="k c" x="200" y="286">✗ Vérifications sur le résultat</text>
<text class="k c" x="200" y="304">combiné : ÉCHEC</text>
<line class="lk" x1="200" y1="316" x2="200" y2="336" marker-end="url(#fig2-ak)"/>
<rect class="box" x="60" y="340" width="280" height="32" rx="5"/>
<text class="s c" x="200" y="361">Réparation</text>
<line class="ln" x1="200" y1="372" x2="200" y2="392" marker-end="url(#fig2-ar)"/>
<rect class="box" x="60" y="396" width="280" height="32" rx="5"/>
<text class="s c" x="200" y="417">Nouvelle vérification</text>
<text class="m" x="10" y="444">Chaque branche seule semble correcte.</text>
</g>
</svg>
