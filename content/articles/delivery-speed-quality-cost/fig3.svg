.fig3 .dot{fill:var(--news,var(--f-news));stroke:var(--text,var(--f-text));stroke-width:1}
.fig3 .ah{fill:var(--accent,var(--f-accent))}
.fig3 .ahk{fill:var(--news,var(--f-news))}
.fig3 .c{text-anchor:middle}.fig3 .e{text-anchor:end}
</style>
<defs><marker id="fig3-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker><marker id="fig3-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahk" d="M0 0L10 5L0 10z"/></marker></defs>
