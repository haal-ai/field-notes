<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 432" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">Un agent informé contre deux agents séparés</title>
<desc id="fig3-d">Taux de réussite conjointe, un seul setup. Demandes contradictoires : 62 % avec un agent qui a les deux demandes, 16 % avec deux agents parallèles. Demandes complémentaires : 86 % contre 57 %. Mesure de réussite seulement, ni vitesse ni coût.</desc>
<style>
