<text class="s" x="330.6" y="275">86 %</text>
<text class="t" x="10" y="304">Deux agents parallèles, séparés</text>
<rect class="dif" x="15" y="310" width="205.2" height="22" rx="3"/>
<text class="s" x="226.2" y="327">57 %</text>
<text class="m " x="15.0" y="354">0 %</text>
<text class="m c" x="195.0" y="354">50 %</text>
<text class="m e" x="375.0" y="354">100 %</text>
<text class="m" x="10" y="380">Un setup : un harness et un modèle.</text>
<text class="m" x="10" y="398">Réussite seulement, ni vitesse ni coût.</text>
<text class="m" x="10" y="416">L'écart mêle information et parallélisme.</text>
