<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" role="img" aria-labelledby="fig4-t fig4-d">
<title id="fig4-t">Parallèle : plus rapide ou plus lent selon l'étude</title>
<desc id="fig4-d">Trois études, trois échelles séparées. CodeCRDT : de 21,1 % plus rapide à 39,4 % plus lent selon la tâche, 13,1 % plus lent en moyenne. Co-Coder : jusqu'à 2,10 fois plus rapide et 35 % moins cher, face aux baselines des auteurs. Teams of Coding Agents : 3 à 7 fois le coût d'un agent seul, pour de meilleurs résultats ; c'est un coût, pas un délai. Les setups diffèrent : ne pas comparer les lignes.</desc>
<style>
.fig4{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig4{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig4 text{font-family:system-ui,sans-serif;font-size:13px}
.fig4 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig4 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig4 .t{fill:var(--text,var(--f-text))}
.fig4 .m{fill:var(--muted,var(--f-muted))}
.fig4 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig4 .j{fill:var(--accent-ink,var(--f-ink))}
.fig4 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig4 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig4 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig4 .bar{fill:var(--raised,var(--f-raised));stroke:var(--text,var(--f-text));stroke-width:1}
.fig4 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig4 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig4 .dsh{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2;stroke-dasharray:5 3}
.fig4 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig4 .lk{stroke:var(--news,var(--f-news));stroke-width:1.5;fill:none;stroke-dasharray:5 3}
.fig4 .rg{stroke:var(--accent,var(--f-accent));stroke-width:6;stroke-linecap:round;fill:none}
.fig4 .grid{stroke:var(--line,var(--f-line));stroke-width:1}
.fig4 .tick{stroke:var(--text,var(--f-text));stroke-width:1.5}
.fig4 .dot{fill:var(--news,var(--f-news));stroke:var(--text,var(--f-text));stroke-width:1}
.fig4 .ah{fill:var(--accent,var(--f-accent))}
.fig4 .ahk{fill:var(--news,var(--f-news))}
.fig4 .c{text-anchor:middle}.fig4 .e{text-anchor:end}
</style>
<defs><marker id="fig4-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker><marker id="fig4-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ahk" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="fig4">
<text class="h" x="10" y="18">Parallèle : ça dépend de l'étude</text>
<text class="m" x="10" y="40">Setups différents : on ne compare pas les cartes.</text>
<rect class="box" x="6" y="54" width="388" height="188" rx="5"/>
<text class="s" x="15" y="76">CodeCRDT</text>
<text class="m" x="15" y="94">6 tâches × 50 runs × 2 modes = 600</text>
<text class="k c" x="216" y="122">moyenne : +13,1 %</text>
<line class="tick" x1="148.6" y1="126" x2="148.6" y2="146"/>
<line class="rg" x1="40.1" y1="136" x2="351.2" y2="136"/>
<circle class="dot" cx="215.9" cy="136" r="6"/>
<text class="t" x="15" y="166">−21,1 % : plus rapide</text>
<text class="t e" x="390" y="166">+39,4 % : plus lent</text>
<text class="m" x="15" y="188">Trait vertical = durée égale. Échelle propre.</text>
<text class="m" x="15" y="210">Code généré 82 à 189 % plus long en parallèle</text>
<text class="m" x="15" y="228">sur les tâches complexes : mesure brouillée.</text>
<rect class="box" x="6" y="252" width="388" height="112" rx="5"/>
<text class="s" x="15" y="274">Co-Coder</text>
<text class="m" x="15" y="292">28 tâches ; face aux baselines des auteurs</text>
<rect class="sh" x="15" y="304" width="178" height="48" rx="5"/>
<rect class="sh" x="205" y="304" width="180" height="48" rx="5"/>
<text class="i c" x="104" y="324">jusqu'à 2,10 ×</text>
<text class="j c" x="104" y="342">plus rapide</text>
<text class="i c" x="295" y="324">jusqu'à 35 %</text>
<text class="j c" x="295" y="342">moins cher</text>
<rect class="box" x="6" y="374" width="388" height="150" rx="5"/>
<text class="s" x="15" y="396">Teams of Coding Agents</text>
<text class="m" x="15" y="414">coût, pas un délai (ProgramBench)</text>
<text class="k c" x="123" y="434">3 ×</text>
<text class="k c" x="329" y="434">7 ×</text>
<line class="tick" x1="20.0" y1="438" x2="20.0" y2="458"/>
<line class="rg" x1="122.9" y1="448" x2="328.6" y2="448"/>
<text class="t" x="15" y="486">1 × = un agent seul ; échelle propre</text>
<text class="m" x="15" y="504">Pour de meilleurs résultats que l'agent seul.</text>
</g>
</svg>
