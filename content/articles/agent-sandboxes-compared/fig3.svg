<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 314" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">Quel outil regarder selon le besoin</title>
<desc id="fig3-d">Je veux borner ce que l'agent peut toucher : je regarde OpenShell. Je veux lancer le code d'un agent dans un environnement jetable, par API : je regarde OpenSandbox. Je veux entraîner ou évaluer des agents sur des tâches reproductibles : je regarde OpenEnv. Un besoin à cheval sur deux cases se traite en combinant.</desc>
<style>
.fig3{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig3{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig3 text{font-family:system-ui,sans-serif;font-size:13px}
.fig3 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig3 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig3 .t{fill:var(--text,var(--f-text))}
.fig3 .m{fill:var(--muted,var(--f-muted))}
.fig3 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig3 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .hi{fill:var(--surface,var(--f-surface));stroke:var(--accent,var(--f-accent));stroke-width:2}
.fig3 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig3 .ah{fill:var(--accent,var(--f-accent))}
.fig3 .dash{stroke:var(--muted,var(--f-muted));stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.fig3 .c{text-anchor:middle}
</style>
<g class="fig3">
<text class="h" x="10" y="18">Je veux… → je regarde…</text>
<rect class="box" x="6" y="30" width="388" height="78" rx="5"/>
<text class="t" x="16" y="52">Je veux borner ce que</text>
<text class="t" x="16" y="70">l'agent peut toucher</text>
<text class="a" x="16" y="94">→ je regarde OpenShell</text>
<rect class="box" x="6" y="118" width="388" height="78" rx="5"/>
<text class="t" x="16" y="140">Je veux lancer le code d'un agent dans</text>
<text class="t" x="16" y="158">un environnement jetable, par API</text>
<text class="a" x="16" y="182">→ je regarde OpenSandbox</text>
<rect class="box" x="6" y="206" width="388" height="78" rx="5"/>
<text class="t" x="16" y="228">Je veux entraîner ou évaluer des agents</text>
<text class="t" x="16" y="246">sur des tâches reproductibles</text>
<text class="a" x="16" y="270">→ je regarde OpenEnv</text>
<text class="m" x="10" y="302">Besoin à cheval sur deux cases : combiner.</text>
</g>
</svg>
