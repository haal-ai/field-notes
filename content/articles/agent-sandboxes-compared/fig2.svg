<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 538" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Comparaison de trois outils : problème, couche, exploitant, licence, maturité</title>
<desc id="fig2-d">OpenShell : borner ce que l'agent peut toucher ; runtime de gouvernance ; exploité par qui déploie des agents ; licence Apache 2.0 ; version 0.1.x. OpenSandbox : exécuter du code non fiable dans un endroit jetable ; API d'exécution ; exploité par qui fournit l'exécution aux agents ; licence Apache 2.0 ; version 1.2.1. OpenEnv : décrire l'environnement d'entraînement ou d'évaluation ; spécification d'environnement ; exploité par qui entraîne ou évalue ; licence BSD-3-Clause ; v0.15.0, développement précoce selon le projet.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .hi{fill:var(--surface,var(--f-surface));stroke:var(--accent,var(--f-accent));stroke-width:2}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .ah{fill:var(--accent,var(--f-accent))}
.fig2 .dash{stroke:var(--muted,var(--f-muted));stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.fig2 .c{text-anchor:middle}
</style>
<g class="fig2">
<text class="h" x="10" y="18">Trois outils, cinq critères</text>
<rect class="box" x="6" y="30" width="388" height="135" rx="5"/>
<text class="a" x="16" y="52">NVIDIA OpenShell</text>
<text class="m" x="16" y="74">Problème</text>
<text class="t" x="110" y="74">borner ce que l'agent peut toucher</text>
<text class="m" x="16" y="93">Couche</text>
<text class="t" x="110" y="93">runtime de gouvernance</text>
<text class="m" x="16" y="112">Exploité par</text>
<text class="t" x="110" y="112">qui déploie des agents</text>
<text class="m" x="16" y="131">Licence</text>
<text class="t" x="110" y="131">Apache 2.0</text>
<text class="m" x="16" y="150">Maturité</text>
<text class="t" x="110" y="150">version 0.1.x</text>
<rect class="box" x="6" y="175" width="388" height="135" rx="5"/>
<text class="a" x="16" y="197">OpenSandbox</text>
<text class="m" x="16" y="219">Problème</text>
<text class="t" x="110" y="219">exécuter du code non fiable, jetable</text>
<text class="m" x="16" y="238">Couche</text>
<text class="t" x="110" y="238">API d'exécution</text>
<text class="m" x="16" y="257">Exploité par</text>
<text class="t" x="110" y="257">qui fournit l'exécution aux agents</text>
<text class="m" x="16" y="276">Licence</text>
<text class="t" x="110" y="276">Apache 2.0</text>
<text class="m" x="16" y="295">Maturité</text>
<text class="t" x="110" y="295">version 1.2.1</text>
<rect class="box" x="6" y="320" width="388" height="154" rx="5"/>
<text class="a" x="16" y="342">OpenEnv</text>
<text class="m" x="16" y="364">Problème</text>
<text class="t" x="110" y="364">décrire l'environnement d'entraînement</text>
<text class="t" x="110" y="383">ou d'évaluation</text>
<text class="m" x="16" y="402">Couche</text>
<text class="t" x="110" y="402">spécification d'environnement</text>
<text class="m" x="16" y="421">Exploité par</text>
<text class="t" x="110" y="421">qui entraîne ou évalue</text>
<text class="m" x="16" y="440">Licence</text>
<text class="t" x="110" y="440">BSD-3-Clause</text>
<text class="m" x="16" y="459">Maturité</text>
<text class="t" x="110" y="459">v0.15.0 ; « développement précoce »</text>
<text class="m" x="10" y="492">Classification de cette page, d'après les dépôts ;</text>
<text class="m" x="10" y="510">licences et versions lues dans les dépôts</text>
<text class="m" x="10" y="528">(novembre 2026). Fonctions non testées ici.</text>
</g>
</svg>
