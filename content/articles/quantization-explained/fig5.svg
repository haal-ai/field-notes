<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" class="fig" role="img" aria-labelledby="fig5-t fig5-d" viewBox="0 0 360 958" width="360"><title id="fig5-t">Coût réel de « 4 bits » : 4 bits plus le scale réparti sur le groupe, de 4,125 à 6 bits par weight</title><desc id="fig5-d">Bits par weight = 4 + coût du scale réparti sur le groupe. Groupe de 8, scale de 16 bits : 8 × 4 + 16 = 48 bits, soit 6 bits par weight. Groupe de 32 : 4,5. Groupe de 64 : 4,25 ; avec un zero-point de 16 bits en plus : 4,5. Groupe de 128 : 4,125. Q4_K : (2 × 16 + 12 × 8 + 128 × 8) ÷ 256 = 4,5.</desc><style>
.fig{--c-bg:var(--bg,#f7f9fa);--c-sf:var(--surface,#edf2f4);--c-rs:var(--raised,#e4ecef);--c-tx:var(--text,#152a34);--c-mu:var(--muted,#506571);--c-ln:var(--line,#b9cbd2);--c-ac:var(--accent,#146b5c);--c-ai:var(--accent-ink,#e6f7f2);--c-du:var(--due,#865025);--c-db:var(--due-bg,#faeee1)}
@media (prefers-color-scheme:dark){.fig{--c-bg:var(--bg,#0e1419);--c-sf:var(--surface,#131d25);--c-rs:var(--raised,#192630);--c-tx:var(--text,#e5ecee);--c-mu:var(--muted,#a0b0ba);--c-ln:var(--line,#30404c);--c-ac:var(--accent,#79d8c4);--c-ai:var(--accent-ink,#0e2421);--c-du:var(--due,#edbd91);--c-db:var(--due-bg,#32271e)}}
.fig .h{fill:var(--c-tx);font:600 16px system-ui,sans-serif}
.fig .l{fill:var(--c-tx);font:600 14px system-ui,sans-serif}
.fig .m{fill:var(--c-mu);font:13px system-ui,sans-serif}
.fig .t{fill:var(--c-tx);font:13px system-ui,sans-serif}
.fig .b{font-weight:700}
.fig .num{fill:var(--c-tx);font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
.fig .mono{fill:var(--c-tx);font:13px ui-monospace,SFMono-Regular,Consolas,monospace}
.fig .e{text-anchor:end}.fig .c{text-anchor:middle}
.fig .hl{fill:var(--c-du);font-weight:700}
.fig .cell{fill:var(--c-bg);stroke:var(--c-ln);stroke-width:1}
.fig .q{fill:var(--c-ai);stroke:var(--c-ac)}
.fig .cell.hi{fill:var(--c-db);stroke:var(--c-du);stroke-width:3}
.fig .box{fill:var(--c-bg);stroke:var(--c-ln);stroke-width:1.5}
.fig .panel{fill:var(--c-rs);stroke:var(--c-ln);stroke-width:1}
.fig .acc{fill:var(--c-ai);stroke:var(--c-ac);stroke-width:2}
.fig .warn{fill:var(--c-db);stroke:var(--c-du);stroke-width:2}
.fig .arrow,.fig .axis{stroke:var(--c-mu);stroke-width:1.5;fill:none}
.fig .dash{stroke:var(--c-du);stroke-width:2;stroke-dasharray:5 4;fill:none}
.fig .errbar{fill:var(--c-mu)}.fig .errbar.hi{fill:var(--c-du)}
.fig .err{fill:var(--c-mu);font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
.fig .err.hi{fill:var(--c-du);font-weight:700}
.fig .bar{fill:var(--c-mu);stroke:var(--c-tx);stroke-width:1.5}
.fig .bar.hi2{fill:var(--c-ac);stroke:var(--c-tx);stroke-width:1.5}
.fig .bit{fill:var(--c-mu);stroke:var(--c-tx);stroke-width:1}
.fig .bit.ac{fill:var(--c-ac)}
.fig .sep{stroke:var(--c-ln);stroke-width:1}
.fig .tick{stroke:var(--c-tx);stroke-width:2}
</style><rect width="360" height="958" fill="var(--c-sf)"/><text x="10" y="22" class="h">Bits réels par weight</text><text x="10" y="50" class="m">Axe : coupé à 4 bits. Un petit tronc « 4 bits</text><text x="10" y="68" class="m">» à gauche, puis la part de scale à</text><text x="10" y="86" class="m">le scale du dessin.</text><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--c-ai)"/><rect width="2.5" height="6" fill="var(--c-ac)"/></pattern></defs><text x="10" y="108" class="l">Groupe de 8, scale 16 bits</text><text x="350" y="108" class="l e">6 bits</text><text x="10" y="132" class="mono">4 + 16 ÷ 8 = 6 bits (8 × 4 + 16 = 48</text><text x="10" y="150" class="mono">bits ÷ 8 weights)</text><rect x="10" y="156" width="50" height="20" rx="2" class="cell" stroke-width="2"/><rect x="60" y="156" width="290" height="20" rx="2" class="" fill="url(#hatch)" stroke="var(--c-ac)" stroke-width="2"/><text x="35" y="170" class="num c">4 bits</text><text x="10" y="192" class="m">Le scale coûte 2 bits par weight à 8 weights</text><text x="10" y="208" class="m">par groupe.</text><text x="10" y="230" class="l">Groupe de 32, scale 16 bits</text><text x="350" y="230" class="l e">4,5 bits</text><text x="10" y="254" class="mono">4 + 16 ÷ 32 = 4,5 bits</text><rect x="10" y="260" width="50" height="20" rx="2" class="cell" stroke-width="2"/><rect x="60" y="260" width="72.5" height="20" rx="2" class="" fill="url(#hatch)" stroke="var(--c-ac)" stroke-width="2"/><text x="35" y="274" class="num c">4 bits</text><text x="10" y="302" class="l">Groupe de 64, scale 16 bits</text><text x="350" y="302" class="l e">4,25 bits</text><text x="10" y="326" class="mono">4 + 16 ÷ 64 = 4,25 bits</text><rect x="10" y="332" width="50" height="20" rx="2" class="cell" stroke-width="2"/><rect x="60" y="332" width="36.2" height="20" rx="2" class="" fill="url(#hatch)" stroke="var(--c-ac)" stroke-width="2"/><text x="35" y="346" class="num c">4 bits</text><text x="10" y="368" class="m">Le scale coûte 0,25 bit par weight à 64 weights</text><text x="10" y="384" class="m">par groupe.</text><text x="10" y="406" class="l">Groupe de 64, scale + zero-point</text><text x="350" y="406" class="l e">4,5 bits</text><text x="10" y="430" class="mono">4 + 32 ÷ 64 = 4,5 bits</text><rect x="10" y="436" width="50" height="20" rx="2" class="cell" stroke-width="2"/><rect x="60" y="436" width="72.5" height="20" rx="2" class="" fill="url(#hatch)" stroke="var(--c-ac)" stroke-width="2"/><text x="35" y="450" class="num c">4 bits</text><text x="10" y="472" class="m">Scale et zero-point : 2 × 16 bits = 32 bits</text><text x="10" y="488" class="m">par groupe.</text><text x="10" y="510" class="l">Groupe de 128, scale 16 bits</text><text x="350" y="510" class="l e">4,125 bits</text><text x="10" y="534" class="mono">4 + 16 ÷ 128 = 4,125 bits</text><rect x="10" y="540" width="50" height="20" rx="2" class="cell" stroke-width="2"/><rect x="60" y="540" width="18.1" height="20" rx="2" class="" fill="url(#hatch)" stroke="var(--c-ac)" stroke-width="2"/><text x="35" y="554" class="num c">4 bits</text><text x="10" y="582" class="l">Q4_K (llama.cpp)</text><text x="350" y="582" class="l e">4,5 bits</text><text x="10" y="606" class="mono">(2 × 16 + 12 × 8 + 128 × 8) ÷ 256 = 4,5</text><text x="10" y="624" class="mono">bits</text><rect x="10" y="630" width="50" height="20" rx="2" class="cell" stroke-width="2"/><rect x="60" y="630" width="72.5" height="20" rx="2" class="" fill="url(#hatch)" stroke="var(--c-ac)" stroke-width="2"/><text x="35" y="644" class="num c">4 bits</text><text x="10" y="666" class="m">Super-bloc de 256 weights = 8 blocs de 32 ;</text><text x="10" y="682" class="m">scale et décalage de 6 bits par bloc (8</text><text x="10" y="698" class="m">blocs × 12 bits = 96 bits = 12 × 8) ; le</text><text x="10" y="714" class="m">super-bloc ajoute deux valeurs de 16 bits (2</text><text x="10" y="730" class="m">× 16 = 32 bits) ; 128 × 8 = 1 024 bits</text><text x="10" y="746" class="m">d’entiers (256 × 4). Total 1 152 bits ÷ 256 =</text><text x="10" y="762" class="m">4,5.</text><path d="M60 776L350 776" class="axis"/><path d="M60 776L60 782" class="axis"/><text x="60" y="796" class="m c">4</text><path d="M132.5 776L132.5 782" class="axis"/><text x="132.5" y="796" class="m c">4,5</text><path d="M205 776L205 782" class="axis"/><text x="205" y="796" class="m c">5</text><path d="M277.5 776L277.5 782" class="axis"/><text x="277.5" y="796" class="m c">5,5</text><path d="M350 776L350 782" class="axis"/><text x="350" y="796" class="m c">6</text><text x="10" y="796" class="m">bits</text><text x="10" y="820" class="m">Légende : tronc plein = 4 bits d’entier ;</text><text x="10" y="838" class="m">zone hachurée = coût du scale (et du</text><text x="10" y="856" class="m">zero-point).</text><path d="M10 868L350 868" class="axis"/><text x="10" y="890" class="t">Petits groupes : plus de scales à stocker,</text><text x="10" y="908" class="t">mais elles suivent mieux les weights. La</text><text x="10" y="926" class="t">disposition exacte varie selon l’outil :</text><text x="10" y="944" class="t">vérifier le format utilisé.</text></svg>