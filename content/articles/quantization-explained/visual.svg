<svg xmlns="http://www.w3.org/2000/svg" class="fig" role="img" aria-labelledby="qt qd" viewBox="0 0 360 918" width="360" aria-label="How quantization shrinks a model: 8 weights stored as 4-bit integers with one shared scale, restored with small errors, and a 7-billion-weight model at 16, 8 and 4.25 bits per weight"><title id="qt">How quantization shrinks a model: 8 weights stored as 4-bit integers with one shared scale, restored with small errors, and a 7-billion-weight model at 16, 8 and 4.25 bits per weight</title><desc id="qd">Panel A: eight invented weights 0.12, −0.80, 0.33, 0.05, −0.41, 0.64, −0.22, 0.27 take 128 bits at 16 bits each. With one shared scale 0.1143 they become the integers 1, −7, 3, 0, −4, 6, −2, 2 and take 48 bits. Multiplying back gives 0.11, −0.80, 0.34, 0.00, −0.46, 0.69, −0.23, 0.23. Errors (restored − original) range up to −0.050. Panel B: a model with 7 billion weights, weights only, need 14.00 GB at 16 bits, 7.00 GB at 8 bits and 3.72 GB at 4.25 bits.</desc><style>
.fig{--c-bg:var(--bg,#f7f9fa);--c-sf:var(--surface,#edf2f4);--c-rs:var(--raised,#e4ecef);--c-tx:var(--text,#152a34);--c-mu:var(--muted,#506571);--c-ln:var(--line,#b9cbd2);--c-ac:var(--accent,#146b5c);--c-ai:var(--accent-ink,#e6f7f2);--c-du:var(--due,#865025);--c-db:var(--due-bg,#faeee1)}
@media (prefers-color-scheme:dark){.fig{--c-bg:var(--bg,#0e1419);--c-sf:var(--surface,#131d25);--c-rs:var(--raised,#192630);--c-tx:var(--text,#e5ecee);--c-mu:var(--muted,#a0b0ba);--c-ln:var(--line,#30404c);--c-ac:var(--accent,#79d8c4);--c-ai:var(--accent-ink,#0e2421);--c-du:var(--due,#edbd91);--c-db:var(--due-bg,#32271e)}}
.fig .h{fill:var(--c-tx);font:600 16px system-ui,sans-serif}
.fig .l{fill:var(--c-tx);font:600 14px system-ui,sans-serif}
.fig .m{fill:var(--c-mu);font:14px system-ui,sans-serif}
.fig .num{fill:var(--c-tx);font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
.fig .cell{fill:var(--c-bg);stroke:var(--c-ln);stroke-width:1}
.fig .q{fill:var(--c-ai);stroke:var(--c-ac)}
.fig .cell.hi{fill:var(--c-db);stroke:var(--c-du);stroke-width:3}
.fig .arrow,.fig .axis{stroke:var(--c-mu);stroke-width:1.5;fill:none}
.fig .errbar{fill:var(--c-mu)}
.fig .errbar.hi{fill:var(--c-du)}
.fig .err{fill:var(--c-mu);font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
.fig .err.hi{fill:var(--c-du);font-weight:700}
.fig .bar{fill:var(--c-mu);stroke:var(--c-tx);stroke-width:1.5}
.fig .bar.hi2{fill:var(--c-ac);stroke:var(--c-tx);stroke-width:1.5}
</style><rect width="360" height="918" fill="var(--c-sf)"/><text x="10" y="22" class="h">A · One group of 8 invented weights</text><text x="10" y="46" class="l">1 Original · 16 bits each</text><rect x="11.0" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="31.2" y="74" text-anchor="middle" class="num">0.12</text><rect x="53.5" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="73.8" y="74" text-anchor="middle" class="num">−0.80</text><rect x="96.0" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="116.2" y="74" text-anchor="middle" class="num">0.33</text><rect x="138.5" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="158.8" y="74" text-anchor="middle" class="num">0.05</text><rect x="181.0" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="201.2" y="74" text-anchor="middle" class="num">−0.41</text><rect x="223.5" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="243.8" y="74" text-anchor="middle" class="num">0.64</text><rect x="266.0" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="286.2" y="74" text-anchor="middle" class="num">−0.22</text><rect x="308.5" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="328.8" y="74" text-anchor="middle" class="num">0.27</text><text x="10" y="104" class="m">8 × 16 = 128 bits</text><path d="M180 112v20" class="arrow"/><path d="M174 127l6 7 6-7" class="arrow"/><text x="196" y="127" class="m">scale from max |w|</text><text x="10" y="156" class="l">2 Quantized · integer = round(w ÷ scale)</text><text x="10" y="176" class="m">scale = 0.80 ÷ 7 = 0.1143 (16 bits)</text><rect x="11.0" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="31.2" y="204" text-anchor="middle" class="num">1</text><rect x="53.5" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="73.8" y="204" text-anchor="middle" class="num">−7</text><rect x="96.0" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="116.2" y="204" text-anchor="middle" class="num">3</text><rect x="138.5" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="158.8" y="204" text-anchor="middle" class="num">0</text><rect x="181.0" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="201.2" y="204" text-anchor="middle" class="num">−4</text><rect x="223.5" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="243.8" y="204" text-anchor="middle" class="num">6</text><rect x="266.0" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="286.2" y="204" text-anchor="middle" class="num">−2</text><rect x="308.5" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="328.8" y="204" text-anchor="middle" class="num">2</text><text x="10" y="234" class="m">8 × 4 bits + 16-bit scale = 48 bits</text><path d="M180 242v20" class="arrow"/><path d="M174 257l6 7 6-7" class="arrow"/><text x="196" y="257" class="m">integer × 0.1143</text><text x="10" y="286" class="l">3 Dequantized · restored values</text><rect x="11.0" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="31.2" y="314" text-anchor="middle" class="num">0.11</text><rect x="53.5" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="73.8" y="314" text-anchor="middle" class="num">−0.80</text><rect x="96.0" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="116.2" y="314" text-anchor="middle" class="num">0.34</text><rect x="138.5" y="294" width="40.5" height="30" rx="3" class="cell hi"/><text x="158.8" y="314" text-anchor="middle" class="num">0.00</text><rect x="181.0" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="201.2" y="314" text-anchor="middle" class="num">−0.46</text><rect x="223.5" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="243.8" y="314" text-anchor="middle" class="num">0.69</text><rect x="266.0" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="286.2" y="314" text-anchor="middle" class="num">−0.23</text><rect x="308.5" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="328.8" y="314" text-anchor="middle" class="num">0.23</text><text x="10" y="346" class="l">Error = restored − original (× 0.001)</text><rect x="22.2" y="440.0" width="18" height="7.2" class="errbar"/><text x="31.2" y="368" text-anchor="middle" class="err">−6</text><rect x="64.8" y="438.5" width="18" height="1.5" class="errbar"/><text x="73.8" y="368" text-anchor="middle" class="err">±0</text><rect x="107.2" y="424.4" width="18" height="15.6" class="errbar"/><text x="116.2" y="368" text-anchor="middle" class="err">+13</text><rect x="149.8" y="440.0" width="18" height="60.0" class="errbar hi"/><text x="158.8" y="368" text-anchor="middle" class="err hi">−50</text><rect x="192.2" y="440.0" width="18" height="56.4" class="errbar"/><text x="201.2" y="368" text-anchor="middle" class="err">−47</text><rect x="234.8" y="384.8" width="18" height="55.2" class="errbar"/><text x="243.8" y="368" text-anchor="middle" class="err">+46</text><rect x="277.2" y="440.0" width="18" height="10.8" class="errbar"/><text x="286.2" y="368" text-anchor="middle" class="err">−9</text><rect x="319.8" y="440.0" width="18" height="49.2" class="errbar"/><text x="328.8" y="368" text-anchor="middle" class="err">−41</text><path d="M10 440h340" class="axis"/><text x="10" y="520" class="m">Largest error: −0.050 (weight 0.05 restored as 0.00).</text><text x="10" y="540" class="m">Lossy: restored values only approximate the originals.</text><path d="M10 562h340" class="axis"/><text x="10" y="586" class="h">B · 7-billion-weight model, weights only</text><text x="10" y="610" class="l">16 bits per weight</text><rect x="10" y="618" width="340.0" height="22" rx="3" class="bar"/><text x="10" y="660" class="m">7×10⁹ × 16 ÷ 8 = 14.00 GB</text><text x="10" y="682" class="l">8 bits per weight</text><rect x="10" y="690" width="170.0" height="22" rx="3" class="bar"/><text x="10" y="732" class="m">7×10⁹ × 8 ÷ 8 = 7.00 GB</text><text x="10" y="754" class="l">4.25 bits per weight</text><rect x="10" y="762" width="90.3" height="22" rx="3" class="bar hi2"/><text x="10" y="804" class="m">7×10⁹ × 4.25 ÷ 8 = 3.72 GB</text><text x="10" y="824" class="m">4.25 = 4 + 16 ÷ 64: 4-bit integers plus one</text><text x="10" y="844" class="m">16-bit scale per group of 64 (assumed layout).</text><text x="10" y="864" class="m">Excludes the extra memory a running model needs.</text><text x="10" y="884" class="m">1 GB = 10⁹ bytes. In A, 8 weights share one</text><text x="10" y="904" class="m">scale: 6 bits per weight, not 4.25.</text></svg>