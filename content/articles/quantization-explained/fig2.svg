<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" class="fig" role="img" aria-labelledby="fig2-t fig2-d" viewBox="0 0 360 1416" width="360"><title id="fig2-t">Un groupe de 8 weights inventés, convertis par quantization en entiers de 4 bits avec un scale de 0,1143, puis le même groupe coupé en deux groupes de 4</title><desc id="fig2-d">Exemple inventé. Huit weights de 16 bits (128 bits) deviennent huit entiers de 4 bits plus un scale de 16 bits (48 bits), puis sont restitués avec des erreurs jusqu’à −0,050. Le même groupe coupé en deux groupes de 4 réduit l’erreur totale du groupe 2 de 0,143 à 0,086, mais pas weights par weight.</desc><style>
.fig{--c-bg:var(--bg,#f7f9fa);--c-sf:var(--surface,#edf2f4);--c-rs:var(--raised,#e4ecef);--c-tx:var(--text,#152a34);--c-mu:var(--muted,#506571);--c-ln:var(--line,#b9cbd2);--c-ac:var(--accent,#146b5c);--c-ai:var(--accent-ink,#e6f7f2);--c-du:var(--due,#865025);--c-db:var(--due-bg,#faeee1)}
@media (prefers-color-scheme:dark){.fig{--c-bg:var(--bg,#0e1419);--c-sf:var(--surface,#131d25);--c-rs:var(--raised,#192630);--c-tx:var(--text,#e5ecee);--c-mu:var(--muted,#a0b0ba);--c-ln:var(--line,#30404c);--c-ac:var(--accent,#79d8c4);--c-ai:var(--accent-ink,#0e2421);--c-du:var(--due,#edbd91);--c-db:var(--due-bg,#32271e)}}
