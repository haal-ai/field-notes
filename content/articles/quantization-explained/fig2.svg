</style><rect width="360" height="1416" fill="var(--c-sf)"/><text x="10" y="22" class="h">Un groupe de 8 weights</text><text x="350" y="22" class="m e">exemple inventé</text><text x="10" y="46" class="l">1 Original · 16 bits chacun</text><rect x="11.0" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="31.2" y="74" class="num c">0,12</text><rect x="53.5" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="73.8" y="74" class="num c">−0,80</text><rect x="96.0" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="116.2" y="74" class="num c">0,33</text><rect x="138.5" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="158.8" y="74" class="num c">0,05</text><rect x="181.0" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="201.2" y="74" class="num c">−0,41</text><rect x="223.5" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="243.8" y="74" class="num c">0,64</text><rect x="266.0" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="286.2" y="74" class="num c">−0,22</text><rect x="308.5" y="54" width="40.5" height="30" rx="3" class="cell"/><text x="328.8" y="74" class="num c">0,27</text><text x="10" y="104" class="m">8 × 16 = 128 bits</text><path d="M180 112V132" class="arrow"/><path d="M174 125l6 7 6-7" class="arrow"/><text x="196" y="127" class="m">scale d’après max |p|</text><text x="10" y="156" class="l">2 Quantization · entier = arrondi(p ÷ scale)</text><text x="10" y="176" class="m">scale = 0,80 ÷ 7 = 0,1143 (16 bits)</text><rect x="11.0" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="31.2" y="204" class="num c">1</text><rect x="53.5" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="73.8" y="204" class="num c">−7</text><rect x="96.0" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="116.2" y="204" class="num c">3</text><rect x="138.5" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="158.8" y="204" class="num c">0</text><rect x="181.0" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="201.2" y="204" class="num c">−4</text><rect x="223.5" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="243.8" y="204" class="num c">6</text><rect x="266.0" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="286.2" y="204" class="num c">−2</text><rect x="308.5" y="184" width="40.5" height="30" rx="3" class="cell q"/><text x="328.8" y="204" class="num c">2</text><text x="10" y="234" class="m">8 × 4 bits + scale de 16 bits = 48 bits</text><path d="M180 242V262" class="arrow"/><path d="M174 255l6 7 6-7" class="arrow"/><text x="196" y="257" class="m">entier × 0,1143</text><text x="10" y="286" class="l">3 Dequantization · valeurs restituées</text><rect x="11.0" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="31.2" y="314" class="num c">0,11</text><rect x="53.5" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="73.8" y="314" class="num c">−0,80</text><rect x="96.0" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="116.2" y="314" class="num c">0,34</text><rect x="138.5" y="294" width="40.5" height="30" rx="3" class="cell hi"/><text x="158.8" y="314" class="num c">0,00</text><rect x="181.0" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="201.2" y="314" class="num c">−0,46</text><rect x="223.5" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="243.8" y="314" class="num c">0,69</text><rect x="266.0" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="286.2" y="314" class="num c">−0,23</text><rect x="308.5" y="294" width="40.5" height="30" rx="3" class="cell"/><text x="328.8" y="314" class="num c">0,23</text><text x="10" y="346" class="l">Erreur = restitué − original (× 0,001)</text><text x="31.2" y="368" class="err c">−6</text><rect x="22.2" y="440" width="18" height="7.2" rx="0" class="errbar"/><text x="73.7" y="368" class="err c">±0</text><rect x="64.7" y="440.0" width="18" height="1.5" rx="0" class="errbar"/><text x="116.2" y="368" class="err c">+13</text><rect x="107.2" y="424.4" width="18" height="15.6" rx="0" class="errbar"/><text x="158.7" y="368" class="err c hi">−50</text><rect x="149.7" y="440" width="18" height="60.0" rx="0" class="errbar hi"/><text x="201.2" y="368" class="err c">−47</text><rect x="192.2" y="440" width="18" height="56.4" rx="0" class="errbar"/><text x="243.7" y="368" class="err c">+46</text><rect x="234.7" y="384.8" width="18" height="55.2" rx="0" class="errbar"/><text x="286.2" y="368" class="err c">−9</text><rect x="277.2" y="440" width="18" height="10.8" rx="0" class="errbar"/><text x="328.7" y="368" class="err c">−41</text><rect x="319.7" y="440" width="18" height="49.2" rx="0" class="errbar"/><path d="M10 440L350 440" class="axis"/><text x="8" y="436" class="m">+</text><text x="8" y="456" class="m">−</text><text x="10" y="520" class="l">Plus grande erreur : −0,050 (le weight</text><text x="10" y="540" class="l">0,05 est restitué à 0,00).</text><text x="10" y="560" class="t">0,05 ÷ 0,1143 = 0,44, arrondi à 0 → restitué</text><text x="10" y="578" class="t">à 0,00, erreur 0,05 (la plus grande du</text><text x="10" y="596" class="t">groupe).</text><text x="10" y="616" class="m">Avec perte : les valeurs restituées sont</text><text x="10" y="634" class="m">approchées.</text><path d="M10 644L350 644" class="axis"/><text x="10" y="670" class="h">B · Le même groupe coupé</text><text x="10" y="690" class="h">en deux groupes de 4</text><text x="10" y="714" class="m">Hypothèses d’exemple : weights inventés ;</text><text x="10" y="732" class="m">scale = plus grande valeur absolue ÷ 7 ;</text><text x="10" y="750" class="m">entiers de −8 à 7 (entier signé de 4 bits) ;</text><text x="10" y="768" class="m">les vrais schémas diffèrent dans le détail.</text><text x="10" y="794" class="l">Groupe 1 (inchangé)</text><rect x="11" y="800" width="80" height="26" rx="3" class="cell"/><text x="51" y="818" class="num c">0,12</text><rect x="96" y="800" width="80" height="26" rx="3" class="cell"/><text x="136" y="818" class="num c">−0,80</text><rect x="181" y="800" width="80" height="26" rx="3" class="cell"/><text x="221" y="818" class="num c">0,33</text><rect x="266" y="800" width="80" height="26" rx="3" class="cell"/><text x="306" y="818" class="num c">0,05</text><text x="10" y="844" class="t">Plus grande valeur absolue 0,80 → scale</text><text x="10" y="862" class="t">0,1143, inchangée.</text><text x="10" y="888" class="l">Groupe 2</text><text x="10" y="912" class="t">Plus grande valeur absolue 0,64 → scale</text><text x="10" y="930" class="t">0,64 ÷ 7 ≈ 0,0914 ; 0,64 restitué à 0,64 (à</text><text x="10" y="948" class="t">l’arrondi près).</text><text x="10" y="964" class="m">Original</text><rect x="11" y="968" width="80" height="26" rx="3" class="cell"/><text x="51" y="986" class="num c">−0,41</text><rect x="96" y="968" width="80" height="26" rx="3" class="cell"/><text x="136" y="986" class="num c">0,64</text><rect x="181" y="968" width="80" height="26" rx="3" class="cell"/><text x="221" y="986" class="num c">−0,22</text><rect x="266" y="968" width="80" height="26" rx="3" class="cell"/><text x="306" y="986" class="num c">0,27</text><text x="10" y="1010" class="m">Entier</text><rect x="11" y="1014" width="80" height="26" rx="3" class="cell q"/><text x="51" y="1032" class="num c">−4</text><rect x="96" y="1014" width="80" height="26" rx="3" class="cell q"/><text x="136" y="1032" class="num c">7</text><rect x="181" y="1014" width="80" height="26" rx="3" class="cell q"/><text x="221" y="1032" class="num c">−2</text><rect x="266" y="1014" width="80" height="26" rx="3" class="cell q"/><text x="306" y="1032" class="num c">3</text><text x="10" y="1056" class="m">Restitué</text><rect x="11" y="1060" width="80" height="26" rx="3" class="cell"/><text x="51" y="1078" class="num c">−0,366</text><rect x="96" y="1060" width="80" height="26" rx="3" class="cell"/><text x="136" y="1078" class="num c">0,640</text><rect x="181" y="1060" width="80" height="26" rx="3" class="cell"/><text x="221" y="1078" class="num c">−0,183</text><rect x="266" y="1060" width="80" height="26" rx="3" class="cell"/><text x="306" y="1078" class="num c">0,274</text><text x="10" y="1110" class="m">Erreur absolue du groupe 2 : avant (groupe de</text><text x="10" y="1128" class="m">8) → après (groupe de 4)</text><text x="14" y="1154" class="mono">−0,41</text><text x="250" y="1154" class="mono e">0,047 → 0,044</text><text x="346" y="1154" class="m e">mieux</text><text x="14" y="1178" class="mono">0,64</text><text x="250" y="1178" class="mono e">0,046 → 0,000</text><text x="346" y="1178" class="m e">mieux</text><rect x="8" y="1185" width="344" height="24" rx="3" class="cell hi"/><text x="14" y="1202" class="mono">−0,22</text><text x="250" y="1202" class="mono e">0,009 → 0,037</text><text x="346" y="1202" class="hl e">empire</text><text x="14" y="1226" class="mono">0,27</text><text x="250" y="1226" class="mono e">0,041 → 0,004</text><text x="346" y="1226" class="m e">mieux</text><path d="M10 1240L350 1240" class="sep"/><text x="14" y="1256" class="l">Total</text><text x="250" y="1256" class="mono e">0,143 → 0,086</text><text x="346" y="1256" class="m e">mieux</text><text x="10" y="1278" class="m">Détail : 0,27 restitué ≈ 0,274 ; −0,22</text><text x="10" y="1296" class="m">restitué ≈ −0,183 ; −0,41 restitué ≈ −0,366.</text><path d="M10 1308L350 1308" class="axis"/><text x="10" y="1330" class="t">Un gros weight étire le scale et dégrade les</text><text x="10" y="1348" class="t">petits. Exemple choisi à la main : seul le</text><text x="10" y="1366" class="t">groupe 2 s’améliore, et pas chaque weight</text><text x="10" y="1384" class="t">(−0,22 empire). Arithmétique sur nombres</text><text x="10" y="1402" class="t">inventés, pas une mesure.</text></svg>