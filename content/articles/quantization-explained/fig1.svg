<svg xmlns="http://www.w3.org/2000/svg" xml:lang="fr" class="fig" role="img" aria-labelledby="fig1-t fig1-d" viewBox="0 0 360 948" width="360"><title id="fig1-t">Mémoire des weights d’un modèle de 7 milliards de weights : 14 Go à 16 bits, 7 Go à 8 bits, 3,5 Go à 4 bits purs, 3,72 Go à 4,25 bits</title><desc id="fig1-d">Un modèle de 7 milliards de weights, weights seuls. 16 bits par weight : 7×10⁹ × 16 ÷ 8 = 14,00 Go. 8 bits : 7,00 Go. 4 bits purs : 3,50 Go. 4,25 bits (groupe de 64, un scale de 16 bits) : 3,72 Go. 1 Go = 10⁹ octets.</desc><style>
.fig{--c-bg:var(--bg,#f7f9fa);--c-sf:var(--surface,#edf2f4);--c-rs:var(--raised,#e4ecef);--c-tx:var(--text,#152a34);--c-mu:var(--muted,#506571);--c-ln:var(--line,#b9cbd2);--c-ac:var(--accent,#146b5c);--c-ai:var(--accent-ink,#e6f7f2);--c-du:var(--due,#865025);--c-db:var(--due-bg,#faeee1)}
@media (prefers-color-scheme:dark){.fig{--c-bg:var(--bg,#0e1419);--c-sf:var(--surface,#131d25);--c-rs:var(--raised,#192630);--c-tx:var(--text,#e5ecee);--c-mu:var(--muted,#a0b0ba);--c-ln:var(--line,#30404c);--c-ac:var(--accent,#79d8c4);--c-ai:var(--accent-ink,#0e2421);--c-du:var(--due,#edbd91);--c-db:var(--due-bg,#32271e)}}
.fig .h{fill:var(--c-tx);font:600 16px system-ui,sans-serif}
.fig .l{fill:var(--c-tx);font:600 14px system-ui,sans-serif}
.fig .m{fill:var(--c-mu);font:13px system-ui,sans-serif}
.fig .t{fill:var(--c-tx);font:13px system-ui,sans-serif}
.fig .b{font-weight:700}
.fig .num{fill:var(--c-tx);font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
.fig .mono{fill:var(--c-tx);font:13px ui-monospace,SFMono-Regular,Consolas,monospace}
.fig .e{text-anchor:end}.fig .c{text-anchor:middle}
.fig .hl{fill:var(--c-du);font-weight:700}
.fig .cell{fill:var(--c-bg);stroke:var(--c-ln);stroke-width:1}
.fig .q{fill:var(--c-ai);stroke:var(--c-ac)}
.fig .cell.hi{fill:var(--c-db);stroke:var(--c-du);stroke-width:3}
.fig .box{fill:var(--c-bg);stroke:var(--c-ln);stroke-width:1.5}
.fig .panel{fill:var(--c-rs);stroke:var(--c-ln);stroke-width:1}
.fig .acc{fill:var(--c-ai);stroke:var(--c-ac);stroke-width:2}
.fig .warn{fill:var(--c-db);stroke:var(--c-du);stroke-width:2}
.fig .arrow,.fig .axis{stroke:var(--c-mu);stroke-width:1.5;fill:none}
.fig .dash{stroke:var(--c-du);stroke-width:2;stroke-dasharray:5 4;fill:none}
.fig .errbar{fill:var(--c-mu)}.fig .errbar.hi{fill:var(--c-du)}
.fig .err{fill:var(--c-mu);font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
.fig .err.hi{fill:var(--c-du);font-weight:700}
.fig .bar{fill:var(--c-mu);stroke:var(--c-tx);stroke-width:1.5}
.fig .bar.hi2{fill:var(--c-ac);stroke:var(--c-tx);stroke-width:1.5}
.fig .bit{fill:var(--c-mu);stroke:var(--c-tx);stroke-width:1}
.fig .bit.ac{fill:var(--c-ac)}
.fig .sep{stroke:var(--c-ln);stroke-width:1}
.fig .tick{stroke:var(--c-tx);stroke-width:2}
</style><rect width="360" height="948" fill="var(--c-sf)"/><text x="10" y="24" class="h">Modèle de 7 milliards de weights,</text><text x="10" y="44" class="h">weights seuls</text><text x="10" y="62" class="t">16 bits = 2 octets ; 7 × 10⁹ weights × 16 bits</text><text x="10" y="80" class="t">÷ 8 bits par octet = 14 × 10⁹ octets ≈ 14 Go</text><text x="10" y="98" class="t">(1 Go = 10⁹ octets).</text><text x="10" y="116" class="m">Un bit = un chiffre binaire. Chaque carré</text><text x="10" y="134" class="m">ci-dessous est un bit.</text><text x="10" y="166" class="l">16 bits par weight</text><rect x="10.0" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="31.25" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="52.5" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="73.75" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="95.0" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="116.25" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="137.5" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="158.75" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="180.0" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="201.25" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="222.5" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="243.75" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="265.0" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="286.25" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="307.5" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="328.75" y="172" width="18.25" height="14" rx="2" class="bit"/><rect x="10" y="192" width="340.0" height="20" rx="3" class="bar"/><text x="10" y="229" class="mono">7×10⁹ × 16 ÷ 8 = 14,00 Go</text><text x="10" y="255" class="l">8 bits par weight</text><rect x="10.0" y="261" width="18.25" height="14" rx="2" class="bit"/><rect x="31.25" y="261" width="18.25" height="14" rx="2" class="bit"/><rect x="52.5" y="261" width="18.25" height="14" rx="2" class="bit"/><rect x="73.75" y="261" width="18.25" height="14" rx="2" class="bit"/><rect x="95.0" y="261" width="18.25" height="14" rx="2" class="bit"/><rect x="116.25" y="261" width="18.25" height="14" rx="2" class="bit"/><rect x="137.5" y="261" width="18.25" height="14" rx="2" class="bit"/><rect x="158.75" y="261" width="18.25" height="14" rx="2" class="bit"/><rect x="10" y="281" width="170.0" height="20" rx="3" class="bar"/><text x="10" y="318" class="mono">7×10⁹ × 8 ÷ 8 = 7,00 Go</text><text x="10" y="344" class="l">4,25 bits par weight</text><rect x="10.0" y="350" width="18.25" height="14" rx="2" class="bit ac"/><rect x="31.25" y="350" width="18.25" height="14" rx="2" class="bit ac"/><rect x="52.5" y="350" width="18.25" height="14" rx="2" class="bit ac"/><rect x="73.75" y="350" width="18.25" height="14" rx="2" class="bit ac"/><rect x="95.0" y="350" width="4.3125" height="14" rx="1" class="bit"/><rect x="10" y="370" width="90.3" height="20" rx="3" class="bar hi2"/><path d="M95 367v26" class="tick"/><text x="10" y="407" class="mono">7×10⁹ × 4,25 ÷ 8 = 3,72 Go (3,71875)</text><text x="10" y="424" class="m">Trait vertical : 4 bits purs = 7×10⁹ × 4 ÷ 8 = 3,50 Go</text><text x="10" y="441" class="m">Part restante : le scale (0,25 bit par weight).</text><path d="M10 449L350 449" class="axis"/><text x="10" y="471" class="l">Tableau : stockage par weight</text><path d="M10 477L350 477" class="sep"/><text x="10" y="496" class="l">16 bits</text><text x="350" y="496" class="l e">14 Go</text><text x="10" y="513" class="mono">7 × 10⁹ × 16 ÷ 8</text><path d="M10 520L350 520" class="sep"/><text x="10" y="539" class="l">8 bits</text><text x="350" y="539" class="l e">7 Go</text><text x="10" y="556" class="mono">7 × 10⁹ × 8 ÷ 8</text><path d="M10 563L350 563" class="sep"/><text x="10" y="582" class="l">4 bits purs</text><text x="350" y="582" class="l e">3,5 Go</text><text x="10" y="599" class="mono">7 × 10⁹ × 4 ÷ 8</text><path d="M10 606L350 606" class="sep"/><text x="10" y="625" class="l">4,25 bits</text><text x="350" y="625" class="l e">environ 3,7 Go</text><text x="10" y="642" class="m">groupe de 64, un scale de 16 bits</text><text x="10" y="659" class="mono">7 × 10⁹ × 4,25 ÷ 8</text><path d="M10 666L350 666" class="sep"/><text x="10" y="688" class="m">4,25 = 4 + 16 ÷ 64 : entiers de 4 bits plus</text><text x="10" y="706" class="m">un scale de 16 bits par groupe de 64</text><text x="10" y="724" class="m">(disposition supposée).</text><text x="10" y="746" class="m">Un modèle en cours d’exécution a besoin de</text><text x="10" y="764" class="m">plus de mémoire que ses weights ; non chiffré</text><text x="10" y="782" class="m">ici.</text><path d="M10 794L350 794" class="axis"/><text x="10" y="814" class="l">Deux résultats publiés</text><text x="10" y="836" class="m">LLM.int8() : mémoire d’inférence divisée par</text><text x="10" y="854" class="m">2 (couches feed-forward et projections</text><text x="10" y="872" class="m">d’attention) — Dettmers et al., 2022.</text><text x="10" y="894" class="m">GPTQ : 3 ou 4 bits, perte négligeable —</text><text x="10" y="912" class="m">Frantar et al., 2022.</text><text x="10" y="934" class="m">Valable pour leurs modèles et mesures.</text></svg>