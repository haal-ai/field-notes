<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig3-title fig3-desc" viewBox="0 0 480 1244" width="480" height="1244"><title id="fig3-title">Deux petites tâches : crédits et secondes par exécution</title><desc id="fig3-desc">Essai pilote : 1 exécution par configuration et par tâche, 9 au total. Tâches 1 et 2 ; plus petit = mieux. Crédits par exécution, tâche 1 puis tâche 2 : agent seul 0,288 et 0,512 (somme 0,800) ; entire-graph 0,653 et 0,602 (somme 1,255) ; graphify 0,274 et 0,673 (somme 0,947). Secondes par exécution : agent seul 25 et 39 ; entire-graph 57 et 50 ; graphify 40 et 61. Les 4 exécutions avec graphe sont plus lentes. Seule exception en crédits : graphify, tâche 1 (−0,014).</desc><style>svg{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--_text:var(--text,#152a34);--_muted:var(--muted,#506571);--_line:var(--line,#b9cbd2);--_bg:var(--bg,#f7f9fa);--_surface:var(--surface,#edf2f4);--_raised:var(--raised,#e4ecef);--_accent:var(--accent,#146b5c);--_exp:var(--experiment,#555084);--_warn:var(--due,#865025);}
