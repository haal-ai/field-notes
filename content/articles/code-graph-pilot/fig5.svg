<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig5-title fig5-desc" viewBox="0 0 480 636" width="480" height="636"><title id="fig5-title">Limites de l'essai : une piste, pas un résultat</title><desc id="fig5-desc">Une piste, pas un résultat. Limites : 1 exécution par cas, pas de dispersion ; 3 tâches sur 9 jouées ; 1 dépôt privé : 58 fichiers, environ 6 700 lignes, surtout Python ; modèle automatique, juge non noté ; dates déduites : entre le 13 et le 17 nov. 2026 ; tokens non mesurés (enregistrés à zéro) ; crédits propres à la plateforme ; versions plus récentes possibles.</desc><style>svg{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--_text:var(--text,#152a34);--_muted:var(--muted,#506571);--_line:var(--line,#b9cbd2);--_bg:var(--bg,#f7f9fa);--_surface:var(--surface,#edf2f4);--_raised:var(--raised,#e4ecef);--_accent:var(--accent,#146b5c);--_exp:var(--experiment,#555084);--_warn:var(--due,#865025);}
@media(prefers-color-scheme:dark){svg{--_text:var(--text,#e5ecee);--_muted:var(--muted,#a0b0ba);--_line:var(--line,#30404c);--_bg:var(--bg,#0e1419);--_surface:var(--surface,#131d25);--_raised:var(--raised,#192630);--_accent:var(--accent,#79d8c4);--_exp:var(--experiment,#b7b5ed);--_warn:var(--due,#edbd91);}}
.fig5-bg{fill:var(--_surface)}
.fig5-t{font-size:22px;font-weight:700;fill:var(--_text)}
.fig5-h{font-size:18px;font-weight:700;fill:var(--_text)}
.fig5-b{font-size:18px;fill:var(--_text)}
.fig5-m{font-size:18px;fill:var(--_muted)}
.fig5-s{font-size:18px;font-weight:700;fill:var(--_text)}
.fig5-v{font-size:18px;font-weight:700;font-family:ui-monospace,monospace;fill:var(--_text)}
.fig5-box{fill:var(--_bg);stroke:var(--_line);stroke-width:1.5}
.fig5-hd{fill:var(--_raised);stroke:var(--_line);stroke-width:1.5}
.fig5-key{fill:var(--_bg);stroke:var(--_accent);stroke-width:2.5}
.fig5-dash{fill:var(--_bg);stroke:var(--_muted);stroke-width:2;stroke-dasharray:6 4}
.fig5-warn{fill:var(--_bg);stroke:var(--_warn);stroke-width:2}
.fig5-mk{fill:var(--_text)}
.fig5-mka{fill:var(--_accent)}
.fig5-ln{stroke:var(--_muted);stroke-width:2;fill:none}
.fig5-ax{stroke:var(--_line);stroke-width:2}
.fig5-b1{fill:var(--_accent)}
.fig5-b2{fill:url(#fig5-hatch);stroke:var(--_exp);stroke-width:2}
.fig5-hl{fill:none;stroke:var(--_warn);stroke-width:3}</style><defs><pattern id="fig5-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="var(--_surface)"/><rect width="4" height="8" fill="var(--_exp)"/></pattern></defs><rect width="480" height="636" rx="4" class="fig5-bg"/><text x="20" y="40" class="fig5-t" text-anchor="start">Une piste, pas un résultat</text><text x="20" y="70" class="fig5-m" text-anchor="start">Essai pilote : 1 exécution par configuration</text><text x="20" y="94" class="fig5-m" text-anchor="start">et par tâche, 9 au total</text><rect x="16" y="124" width="448" height="46" rx="18" class="fig5-warn" /><path d="M40 139.0 L49 156.0 L31 156.0Z" class="fig5-mka"/><text x="66" y="153.0" class="fig5-s" text-anchor="start">1 exécution par cas, pas de dispersion</text><rect x="16" y="182" width="448" height="46" rx="18" class="fig5-warn" /><path d="M40 197.0 L49 214.0 L31 214.0Z" class="fig5-mka"/><text x="66" y="211.0" class="fig5-s" text-anchor="start">3 tâches sur 9 jouées</text><rect x="16" y="240" width="448" height="70" rx="10" class="fig5-box" /><path d="M40 267.0 L49 284.0 L31 284.0Z" class="fig5-mka"/><text x="66" y="269.0" class="fig5-b" text-anchor="start">1 dépôt privé : 58 fichiers,</text><text x="66" y="293.0" class="fig5-b" text-anchor="start">~6 700 lignes, surtout Python</text><rect x="16" y="322" width="448" height="46" rx="18" class="fig5-box" /><path d="M40 337.0 L49 354.0 L31 354.0Z" class="fig5-mka"/><text x="66" y="351.0" class="fig5-b" text-anchor="start">Modèle automatique, juge non noté</text><rect x="16" y="380" width="448" height="70" rx="10" class="fig5-box" /><path d="M40 407.0 L49 424.0 L31 424.0Z" class="fig5-mka"/><text x="66" y="409.0" class="fig5-b" text-anchor="start">Dates déduites : entre le 13 et le 17</text><text x="66" y="433.0" class="fig5-b" text-anchor="start">nov. 2026</text><rect x="16" y="462" width="448" height="46" rx="18" class="fig5-box" /><path d="M40 477.0 L49 494.0 L31 494.0Z" class="fig5-mka"/><text x="66" y="491.0" class="fig5-b" text-anchor="start">Tokens non mesurés (enregistrés à zéro)</text><rect x="16" y="520" width="448" height="46" rx="18" class="fig5-box" /><path d="M40 535.0 L49 552.0 L31 552.0Z" class="fig5-mka"/><text x="66" y="549.0" class="fig5-b" text-anchor="start">Crédits propres à la plateforme</text><rect x="16" y="578" width="448" height="46" rx="18" class="fig5-box" /><path d="M40 593.0 L49 610.0 L31 610.0Z" class="fig5-mka"/><text x="66" y="607.0" class="fig5-b" text-anchor="start">Versions plus récentes possibles</text></svg>