.fig4-hl{fill:none;stroke:var(--_warn);stroke-width:3}</style><defs><pattern id="fig4-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="var(--_surface)"/><rect width="4" height="8" fill="var(--_exp)"/></pattern></defs><rect width="480" height="1268" rx="4" class="fig4-bg"/><text x="20" y="34" class="fig4-t" text-anchor="start">Essai pilote : 1 exécution par</text><text x="20" y="62" class="fig4-t" text-anchor="start">configuration et par tâche, 9 au</text><text x="20" y="90" class="fig4-t" text-anchor="start">total</text><text x="20" y="120" class="fig4-m" text-anchor="start">Plus petit = mieux. Échelles à partir de 0.</text><text x="20" y="164" class="fig4-t" text-anchor="start">Crédits</text><circle cx="28" cy="196" r="7" class="fig4-mk"/><text x="44" y="202" class="fig4-b" text-anchor="start">Agent seul</text><rect x="20" y="210" width="289.6875" height="24" rx="2" class="fig4-b1" /><text x="319.6875" y="229" class="fig4-v" text-anchor="start">1,545</text><rect x="21" y="255" width="14" height="14" class="fig4-mk"/><text x="44" y="268" class="fig4-b" text-anchor="start">Agent + entire-graph</text><rect x="20" y="276" width="271.5" height="24" rx="2" class="fig4-b1" /><text x="301.5" y="295" class="fig4-v" text-anchor="start">1,448</text><path d="M28 320 L36 335 L20 335Z" class="fig4-mk"/><text x="44" y="334" class="fig4-b" text-anchor="start">Agent + graphify</text><rect x="20" y="342" width="218.8125" height="24" rx="2" class="fig4-b1" /><text x="248.8125" y="361" class="fig4-v" text-anchor="start">1,167</text><rect x="16" y="374" width="448" height="40" rx="6" class="fig4-key" /><text x="28" y="400" class="fig4-s" text-anchor="start">Graphify −24 %, entire-graph −6 %</text><text x="20" y="452" class="fig4-t" text-anchor="start">Secondes</text><circle cx="28" cy="484" r="7" class="fig4-mk"/><text x="44" y="490" class="fig4-b" text-anchor="start">Agent seul</text><rect x="20" y="498" width="242.5" height="24" rx="2" class="fig4-b1" /><text x="272.5" y="517" class="fig4-v" text-anchor="start">97</text><rect x="21" y="543" width="14" height="14" class="fig4-mk"/><text x="44" y="556" class="fig4-b" text-anchor="start">Agent + entire-graph</text><rect x="20" y="564" width="277.5" height="24" rx="2" class="fig4-b1" /><text x="307.5" y="583" class="fig4-v" text-anchor="start">111</text><path d="M28 608 L36 623 L20 623Z" class="fig4-mk"/><text x="44" y="622" class="fig4-b" text-anchor="start">Agent + graphify</text><rect x="20" y="630" width="245.0" height="24" rx="2" class="fig4-b1" /><text x="275.0" y="649" class="fig4-v" text-anchor="start">98</text><text x="20" y="700" class="fig4-t" text-anchor="start">Tours</text><circle cx="28" cy="732" r="7" class="fig4-mk"/><text x="44" y="738" class="fig4-b" text-anchor="start">Agent seul</text><rect x="20" y="746" width="228.0" height="24" rx="2" class="fig4-b1" /><text x="258.0" y="765" class="fig4-v" text-anchor="start">19</text><rect x="21" y="791" width="14" height="14" class="fig4-mk"/><text x="44" y="804" class="fig4-b" text-anchor="start">Agent + entire-graph</text><rect x="20" y="812" width="288.0" height="24" rx="2" class="fig4-b1" /><text x="318.0" y="831" class="fig4-v" text-anchor="start">24</text><path d="M28 856 L36 871 L20 871Z" class="fig4-mk"/><text x="44" y="870" class="fig4-b" text-anchor="start">Agent + graphify</text><rect x="20" y="878" width="180.0" height="24" rx="2" class="fig4-b1" /><text x="210.0" y="897" class="fig4-v" text-anchor="start">15</text><rect x="16" y="922" width="448" height="232" rx="6" class="fig4-hd" /><text x="28" y="948" class="fig4-h" text-anchor="start">Contexte maximal</text><text x="28" y="976" class="fig4-v" text-anchor="start">De 26 411 à 44 499</text><text x="28" y="1004" class="fig4-v" text-anchor="start">sur les 9 exécutions.</text><text x="28" y="1032" class="fig4-b" text-anchor="start">Avec le graphe : plus élevé dans 4</text><text x="28" y="1056" class="fig4-b" text-anchor="start">comparaisons sur 6, plus bas dans 2.</text><text x="28" y="1108" class="fig4-m" text-anchor="start">Définition : plus grande quantité de texte</text><text x="28" y="1132" class="fig4-m" text-anchor="start">tenue par le modèle à un instant donné.</text><rect x="16" y="1158" width="448" height="70" rx="6" class="fig4-warn" /><text x="28" y="1182" class="fig4-s" text-anchor="start">Une exécution par cas : écarts dans le</text><text x="28" y="1206" class="fig4-s" text-anchor="start">bruit</text></svg>