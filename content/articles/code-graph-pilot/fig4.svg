<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig4-title fig4-desc" viewBox="0 0 480 1268" width="480" height="1268"><title id="fig4-title">Tâche longue : crédits, secondes, tours et contexte maximal</title><desc id="fig4-desc">Essai pilote : 1 exécution par configuration et par tâche. Tâche longue (effet d'une modification), agent seul, entire-graph, graphify. Crédits : 1,545 ; 1,448 ; 1,167. Secondes : 97 ; 111 ; 98. Tours : 19 ; 24 ; 15. Graphify : −24 % de crédits ; entire-graph : −6 %. Contexte maximal : de 26 411 à 44 499 sur les 9 exécutions ; avec le graphe, plus élevé dans 4 comparaisons sur 6, plus bas dans 2. Une exécution par cas : écarts dans le bruit.</desc><style>svg{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--_text:var(--text,#152a34);--_muted:var(--muted,#506571);--_line:var(--line,#b9cbd2);--_bg:var(--bg,#f7f9fa);--_surface:var(--surface,#edf2f4);--_raised:var(--raised,#e4ecef);--_accent:var(--accent,#146b5c);--_exp:var(--experiment,#555084);--_warn:var(--due,#865025);}
@media(prefers-color-scheme:dark){svg{--_text:var(--text,#e5ecee);--_muted:var(--muted,#a0b0ba);--_line:var(--line,#30404c);--_bg:var(--bg,#0e1419);--_surface:var(--surface,#131d25);--_raised:var(--raised,#192630);--_accent:var(--accent,#79d8c4);--_exp:var(--experiment,#b7b5ed);--_warn:var(--due,#edbd91);}}
