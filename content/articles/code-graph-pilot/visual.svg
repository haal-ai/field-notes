<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" viewBox="0 0 560 1214" width="560" height="1214"><title id="t">Small pilot: three code-graph setups on answer quality, time and cost (1 run each, 9 runs)</title><desc id="d">Small pilot, one run per setup per task, nine runs. All nine answers were correct. Two small lookup tasks, credits per run, task 1 then task 2: agent alone 0.288 and 0.512, sum 0.800; Entire graph 0.653 and 0.602, sum 1.255; Graphify 0.274 and 0.673, sum 0.947. Elapsed seconds, task 1 then task 2: agent alone 25 and 39; Entire graph 57 and 50; Graphify 40 and 61. One long task: credits 1.545, 1.448, 1.167; elapsed 97, 111, 98 seconds; turns 19, 24, 15, for agent alone, Entire graph, Graphify. Differences may be noise.</desc><style>
svg{font-family:system-ui,sans-serif;--_text:var(--text,#152a34);--_muted:var(--muted,#506571);--_line:var(--line,#b9cbd2);--_surface:var(--surface,#edf2f4);--_accent:var(--accent,#146b5c);--_experiment:var(--experiment,#555084);}
.h1{font:700 21px system-ui,sans-serif;fill:var(--_text)}
.h2{font:700 19px system-ui,sans-serif;fill:var(--_text)}
.h3{font:600 17px system-ui,sans-serif;fill:var(--_text)}
.arm{font:600 18px system-ui,sans-serif;fill:var(--_text)}
.note{font:16px system-ui,sans-serif;fill:var(--_muted)}
.val{font:600 16px ui-monospace,monospace;fill:var(--_text)}
.axis{stroke:var(--_line);stroke-width:2}
.frame{fill:var(--_surface);stroke:var(--_line)}
.a0{fill:var(--_muted)}
.a1{fill:var(--_accent)}
.a2{fill:var(--_experiment)}
@media(prefers-color-scheme:dark){svg{--_text:var(--text,#e6eef1);--_muted:var(--muted,#a9bcc4);--_line:var(--line,#4a6470);--_surface:var(--surface,#14232a);--_accent:var(--accent,#4fd1b5);--_experiment:var(--experiment,#a9a3f0);}}
</style><rect x="1" y="1" width="558" height="1212" rx="4" class="frame"/><text x="20" y="32" class="h1" text-anchor="start">Small pilot: 1 run per setup per task, 9 runs in total</text><text x="20" y="58" class="note" text-anchor="start">Not a benchmark. Differences may be noise.</text><text x="20" y="84" class="note" text-anchor="start">Answer quality: all 9 answers correct,</text><text x="20" y="106" class="note" text-anchor="start">so quality does not separate the setups.</text><text x="20" y="146" class="h2" text-anchor="start">A. Two small lookup tasks (1 run each)</text><text x="20" y="172" class="note" text-anchor="start">● task 1   ◆ task 2   Smaller is better.</text><text x="20" y="202" class="h3" text-anchor="start">Credits per run (0 to 0.8)</text><text x="20" y="246" class="arm" text-anchor="start">Agent alone</text><text x="20" y="268" class="note" text-anchor="start">sum 0.800</text><line x1="160" x2="520" y1="254" y2="254" class="axis"/><line x1="160" x2="160" y1="246" y2="262" class="axis"/><circle cx="289.6" cy="254" r="7" class="a0"/><path d="M390.4 246l8 8l-8 8l-8 -8z" class="a0"/><text x="289.6" y="236" class="val" text-anchor="middle">0.288</text><text x="390.4" y="282" class="val" text-anchor="middle">0.512</text><text x="20" y="304" class="arm" text-anchor="start">Entire graph</text><text x="20" y="326" class="note" text-anchor="start">sum 1.255</text><line x1="160" x2="520" y1="312" y2="312" class="axis"/><line x1="160" x2="160" y1="304" y2="320" class="axis"/><circle cx="453.9" cy="312" r="7" class="a1"/><path d="M430.9 304l8 8l-8 8l-8 -8z" class="a1"/><text x="453.85" y="294" class="val" text-anchor="middle">0.653</text><text x="430.9" y="340" class="val" text-anchor="middle">0.602</text><text x="20" y="362" class="arm" text-anchor="start">Graphify</text><text x="20" y="384" class="note" text-anchor="start">sum 0.947</text><line x1="160" x2="520" y1="370" y2="370" class="axis"/><line x1="160" x2="160" y1="362" y2="378" class="axis"/><circle cx="283.3" cy="370" r="7" class="a2"/><path d="M462.9 362l8 8l-8 8l-8 -8z" class="a2"/><text x="283.3" y="352" class="val" text-anchor="middle">0.274</text><text x="462.85" y="398" class="val" text-anchor="middle">0.673</text><text x="20" y="412" class="h3" text-anchor="start">Elapsed seconds per run (0 to 70)</text><text x="20" y="456" class="arm" text-anchor="start">Agent alone</text><line x1="160" x2="520" y1="464" y2="464" class="axis"/><line x1="160" x2="160" y1="456" y2="472" class="axis"/><circle cx="288.6" cy="464" r="7" class="a0"/><path d="M360.6 456l8 8l-8 8l-8 -8z" class="a0"/><text x="288.57142857142856" y="446" class="val" text-anchor="middle">25 s</text><text x="360.57142857142856" y="492" class="val" text-anchor="middle">39 s</text><text x="20" y="514" class="arm" text-anchor="start">Entire graph</text><line x1="160" x2="520" y1="522" y2="522" class="axis"/><line x1="160" x2="160" y1="514" y2="530" class="axis"/><circle cx="453.1" cy="522" r="7" class="a1"/><path d="M417.1 514l8 8l-8 8l-8 -8z" class="a1"/><text x="453.14285714285717" y="504" class="val" text-anchor="middle">57 s</text><text x="417.14285714285717" y="550" class="val" text-anchor="middle">50 s</text><text x="20" y="572" class="arm" text-anchor="start">Graphify</text><line x1="160" x2="520" y1="580" y2="580" class="axis"/><line x1="160" x2="160" y1="572" y2="588" class="axis"/><circle cx="365.7" cy="580" r="7" class="a2"/><path d="M473.7 572l8 8l-8 8l-8 -8z" class="a2"/><text x="365.7142857142857" y="562" class="val" text-anchor="middle">40 s</text><text x="473.7142857142857" y="608" class="val" text-anchor="middle">61 s</text><text x="20" y="642" class="h2" text-anchor="start">B. One long task (1 run each)</text><text x="20" y="668" class="note" text-anchor="start">Smaller is better. Each scale starts at 0.</text><text x="20" y="700" class="h3" text-anchor="start">Credits</text><text x="20" y="736" class="arm" text-anchor="start">Agent alone</text><rect x="160" y="720" width="289.7" height="22" class="a0"/><text x="457.6875" y="737" class="val" text-anchor="start">1.545</text><text x="20" y="772" class="arm" text-anchor="start">Entire graph</text><rect x="160" y="756" width="271.5" height="22" class="a1"/><text x="439.49999999999994" y="773" class="val" text-anchor="start">1.448</text><text x="20" y="808" class="arm" text-anchor="start">Graphify</text><rect x="160" y="792" width="218.8" height="22" class="a2"/><text x="386.8125" y="809" class="val" text-anchor="start">1.167</text><text x="20" y="840" class="h3" text-anchor="start">Elapsed seconds</text><text x="20" y="876" class="arm" text-anchor="start">Agent alone</text><rect x="160" y="860" width="242.5" height="22" class="a0"/><text x="410.5" y="877" class="val" text-anchor="start">97 s</text><text x="20" y="912" class="arm" text-anchor="start">Entire graph</text><rect x="160" y="896" width="277.5" height="22" class="a1"/><text x="445.5" y="913" class="val" text-anchor="start">111 s</text><text x="20" y="948" class="arm" text-anchor="start">Graphify</text><rect x="160" y="932" width="245.0" height="22" class="a2"/><text x="413.0" y="949" class="val" text-anchor="start">98 s</text><text x="20" y="980" class="h3" text-anchor="start">Turns (agent steps)</text><text x="20" y="1016" class="arm" text-anchor="start">Agent alone</text><rect x="160" y="1000" width="228.0" height="22" class="a0"/><text x="396.0" y="1017" class="val" text-anchor="start">19</text><text x="20" y="1052" class="arm" text-anchor="start">Entire graph</text><rect x="160" y="1036" width="288.0" height="22" class="a1"/><text x="456.0" y="1053" class="val" text-anchor="start">24</text><text x="20" y="1088" class="arm" text-anchor="start">Graphify</text><rect x="160" y="1072" width="180.0" height="22" class="a2"/><text x="348.0" y="1089" class="val" text-anchor="start">15</text><text x="20" y="1138" class="note" text-anchor="start">Single run per setup. The source calls the long-task gap within noise.</text><text x="20" y="1164" class="note" text-anchor="start">Credits are a billing unit of the platform.</text><text x="20" y="1190" class="note" text-anchor="start">No tokens or money shown. Peak context is not drawn.</text></svg>