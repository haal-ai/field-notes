<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig2-title fig2-desc" viewBox="0 0 480 846" width="480" height="846"><title id="fig2-title">Ce que fait un code graph : deux chemins vers une réponse</title><desc id="fig2-desc">Sans graphe, l'agent cherche puis lit fichier par fichier : question, recherche, lecture d'un fichier, lecture d'un fichier, et ainsi de suite, réponse. Avec un graphe, l'agent interroge d'abord l'index (définitions, appelants, types, routes, impact d'une modification), lit parfois le fichier quand même, puis répond. Le graphe peut ajouter une étape (non testé).</desc><style>svg{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--_text:var(--text,#152a34);--_muted:var(--muted,#506571);--_line:var(--line,#b9cbd2);--_bg:var(--bg,#f7f9fa);--_surface:var(--surface,#edf2f4);--_raised:var(--raised,#e4ecef);--_accent:var(--accent,#146b5c);--_exp:var(--experiment,#555084);--_warn:var(--due,#865025);}
@media(prefers-color-scheme:dark){svg{--_text:var(--text,#e5ecee);--_muted:var(--muted,#a0b0ba);--_line:var(--line,#30404c);--_bg:var(--bg,#0e1419);--_surface:var(--surface,#131d25);--_raised:var(--raised,#192630);--_accent:var(--accent,#79d8c4);--_exp:var(--experiment,#b7b5ed);--_warn:var(--due,#edbd91);}}
.fig2-bg{fill:var(--_surface)}
.fig2-t{font-size:22px;font-weight:700;fill:var(--_text)}
.fig2-h{font-size:18px;font-weight:700;fill:var(--_text)}
.fig2-b{font-size:18px;fill:var(--_text)}
.fig2-m{font-size:18px;fill:var(--_muted)}
.fig2-s{font-size:18px;font-weight:700;fill:var(--_text)}
.fig2-v{font-size:18px;font-weight:700;font-family:ui-monospace,monospace;fill:var(--_text)}
.fig2-box{fill:var(--_bg);stroke:var(--_line);stroke-width:1.5}
.fig2-hd{fill:var(--_raised);stroke:var(--_line);stroke-width:1.5}
.fig2-key{fill:var(--_bg);stroke:var(--_accent);stroke-width:2.5}
.fig2-dash{fill:var(--_bg);stroke:var(--_muted);stroke-width:2;stroke-dasharray:6 4}
.fig2-warn{fill:var(--_bg);stroke:var(--_warn);stroke-width:2}
.fig2-mk{fill:var(--_text)}
.fig2-mka{fill:var(--_accent)}
.fig2-ln{stroke:var(--_muted);stroke-width:2;fill:none}
.fig2-ax{stroke:var(--_line);stroke-width:2}
.fig2-b1{fill:var(--_accent)}
.fig2-b2{fill:url(#fig2-hatch);stroke:var(--_exp);stroke-width:2}
.fig2-hl{fill:none;stroke:var(--_warn);stroke-width:3}</style><defs><pattern id="fig2-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="var(--_surface)"/><rect width="4" height="8" fill="var(--_exp)"/></pattern></defs><rect width="480" height="846" rx="4" class="fig2-bg"/><text x="20" y="34" class="fig2-t" text-anchor="start">Agent seul</text><rect x="60" y="56" width="360" height="38" rx="6" class="fig2-box" /><text x="240" y="81" class="fig2-b" text-anchor="middle">Question</text><path d="M240 94 L240 108" class="fig2-ln"/><path d="M234 104 L240 112 L246 104" class="fig2-ln"/><rect x="60" y="114" width="360" height="38" rx="6" class="fig2-box" /><text x="240" y="139" class="fig2-b" text-anchor="middle">Recherche</text><path d="M240 152 L240 166" class="fig2-ln"/><path d="M234 162 L240 170 L246 162" class="fig2-ln"/><rect x="60" y="172" width="360" height="38" rx="6" class="fig2-box" /><text x="240" y="197" class="fig2-b" text-anchor="middle">Lecture d'un fichier</text><path d="M240 210 L240 224" class="fig2-ln"/><path d="M234 220 L240 228 L246 220" class="fig2-ln"/><rect x="60" y="230" width="360" height="38" rx="6" class="fig2-box" /><text x="240" y="255" class="fig2-b" text-anchor="middle">Lecture d'un fichier</text><path d="M240 268 L240 282" class="fig2-ln"/><path d="M234 278 L240 286 L246 278" class="fig2-ln"/><rect x="60" y="288" width="360" height="38" rx="6" class="fig2-box" /><text x="240" y="313" class="fig2-b" text-anchor="middle">… et ainsi de suite</text><path d="M240 326 L240 340" class="fig2-ln"/><path d="M234 336 L240 344 L246 336" class="fig2-ln"/><rect x="60" y="346" width="360" height="38" rx="6" class="fig2-key" /><text x="240" y="371" class="fig2-b" text-anchor="middle">Réponse</text><path d="M20 406 H460" class="fig2-ax"/><text x="20" y="450" class="fig2-t" text-anchor="start">Agent + graphe</text><rect x="60" y="472" width="360" height="38" rx="6" class="fig2-box" /><text x="240" y="497" class="fig2-b" text-anchor="middle">Question</text><path d="M240 510 L240 524" class="fig2-ln"/><path d="M234 520 L240 528 L246 520" class="fig2-ln"/><rect x="60" y="530" width="360" height="150" rx="6" class="fig2-key" /><text x="240" y="557" class="fig2-s" text-anchor="middle">Interrogation de l'index</text><text x="240" y="586" class="fig2-b" text-anchor="middle">définitions, appelants, types,</text><text x="240" y="610" class="fig2-b" text-anchor="middle">routes, impact d'une modification</text><rect x="76" y="630" width="328" height="38" rx="6" class="fig2-warn"/><text x="240" y="655" class="fig2-b" text-anchor="middle">Étape ajoutée (non testé)</text><path d="M240 680 L240 694" class="fig2-ln"/><path d="M234 690 L240 698 L246 690" class="fig2-ln"/><rect x="60" y="700" width="360" height="38" rx="6" class="fig2-dash" /><text x="240" y="725" class="fig2-b" text-anchor="middle">Lecture éventuelle du fichier</text><path d="M240 738 L240 752" class="fig2-ln"/><path d="M234 748 L240 756 L246 748" class="fig2-ln"/><rect x="60" y="758" width="360" height="38" rx="6" class="fig2-key" /><text x="240" y="783" class="fig2-b" text-anchor="middle">Réponse</text><text x="20" y="826" class="fig2-m" text-anchor="start">Le graphe peut ajouter une étape (non testé).</text></svg>