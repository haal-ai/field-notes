<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig1-title fig1-desc" viewBox="0 0 480 894" width="480" height="894"><title id="fig1-title">Le dispositif : 3 configurations, 3 tâches, 9 exécutions</title><desc id="fig1-desc">Essai pilote : 1 exécution par configuration et par tâche, 9 au total. Trois configurations (agent seul, agent avec entire-graph, agent avec graphify) passent trois tâches (deux questions simples, une tâche longue : effet d'une modification), une fois chacune. Trois tâches sur neuf prévues ont été jouées ; neuf réponses justes sur neuf.</desc><style>svg{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--_text:var(--text,#152a34);--_muted:var(--muted,#506571);--_line:var(--line,#b9cbd2);--_bg:var(--bg,#f7f9fa);--_surface:var(--surface,#edf2f4);--_raised:var(--raised,#e4ecef);--_accent:var(--accent,#146b5c);--_exp:var(--experiment,#555084);--_warn:var(--due,#865025);}
@media(prefers-color-scheme:dark){svg{--_text:var(--text,#e5ecee);--_muted:var(--muted,#a0b0ba);--_line:var(--line,#30404c);--_bg:var(--bg,#0e1419);--_surface:var(--surface,#131d25);--_raised:var(--raised,#192630);--_accent:var(--accent,#79d8c4);--_exp:var(--experiment,#b7b5ed);--_warn:var(--due,#edbd91);}}
