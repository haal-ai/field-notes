/text><text x="20" y="608" class="fig1-b" text-anchor="start">Avec graphe : consigne de préférer le graphe.</text><rect x="16" y="622" width="448" height="66" rx="6" class="fig1-key" /><text x="28" y="644" class="fig1-s" text-anchor="start">3 tâches jouées sur 9 prévues ; 9 réponses</text><text x="28" y="668" class="fig1-s" text-anchor="start">justes sur 9</text><text x="20" y="716" class="fig1-m" text-anchor="start">Entire CLI 0.12.2 · entire-graph 0.6.0 (sans</text><text x="20" y="740" class="fig1-m" text-anchor="start">sortie réseau) · graphify 0.9.108 (tree-</text><text x="20" y="764" class="fig1-m" text-anchor="start">sitter seul)</text><text x="20" y="800" class="fig1-m" text-anchor="start">Agent : programme qui lance des outils pour</text><text x="20" y="824" class="fig1-m" text-anchor="start">un modèle.</text><text x="20" y="848" class="fig1-m" text-anchor="start">Code graph : index des</text><text x="20" y="872" class="fig1-m" text-anchor="start">définitions, appelants, types, routes.</text></svg>