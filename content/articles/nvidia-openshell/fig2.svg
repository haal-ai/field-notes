<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Architecture d'OpenShell : gateway, sandbox, superviseur, agent</title>
<desc id="fig2-d">Le CLI ou un SDK parle au gateway. Le gateway crée la sandbox. Dans la sandbox, un superviseur entoure l'agent. Toute connexion sortante passe par la policy avant le réseau.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig2 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .zone{fill:var(--raised,var(--f-raised));stroke:var(--muted,var(--f-muted));stroke-width:1;stroke-dasharray:5 3}
.fig2 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig2 .pol{fill:var(--accent,var(--f-accent))}
.fig2 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .bad{stroke:var(--muted,var(--f-muted));stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.fig2 .c{text-anchor:middle}
</style>
<g class="fig2">
<text class="h" x="10" y="18">Qui parle à qui</text>
<rect class="box" x="100" y="30" width="200" height="34" rx="5"/><text class="s c" x="200" y="52">CLI ou SDK</text>
<path class="ln" d="M200 64 V84 M195 78 L200 84 L205 78"/>
<rect class="box" x="100" y="84" width="200" height="50" rx="5"/><text class="s c" x="200" y="105">gateway</text><text class="m c" x="200" y="123">crée et surveille</text>
<path class="ln" d="M200 134 V154 M195 148 L200 154 L205 148"/>
<rect class="zone" x="30" y="154" width="340" height="150" rx="8"/><text class="m" x="42" y="174">sandbox</text>
<rect class="box" x="100" y="184" width="200" height="34" rx="5"/><text class="s c" x="200" y="206">superviseur</text>
<path class="ln" d="M200 218 V236 M195 230 L200 236 L205 230"/>
<rect class="sh" x="100" y="236" width="200" height="34" rx="5"/><text class="i c" x="200" y="258">agent</text>
<text class="m c" x="200" y="292">fichiers et appels système limités</text>
<path class="ln" d="M200 304 V330 M195 324 L200 330 L205 324"/>
<rect class="dif" x="100" y="330" width="200" height="34" rx="5"/><text class="k c" x="200" y="352">policy de chaque connexion</text>
<path class="ln" d="M200 364 V384 M195 378 L200 384 L205 378"/>
<rect class="box" x="100" y="384" width="200" height="34" rx="5"/><text class="s c" x="200" y="406">Réseau</text>
</g>
</svg>
