<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">Credential injection : l'agent ne voit pas le secret</title>
<desc id="fig3-d">L'agent envoie une requête sans secret. Le runtime ajoute le credential hors de la sandbox et l'envoie à l'endpoint approuvé. La réponse revient par le runtime à l'agent. Affirmation de NVIDIA.</desc>
<style>
.fig3{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig3{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig3 text{font-family:system-ui,sans-serif;font-size:13px}
.fig3 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig3 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig3 .t{fill:var(--text,var(--f-text))}
.fig3 .m{fill:var(--muted,var(--f-muted))}
.fig3 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig3 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig3 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig3 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .zone{fill:var(--raised,var(--f-raised));stroke:var(--muted,var(--f-muted));stroke-width:1;stroke-dasharray:5 3}
.fig3 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig3 .pol{fill:var(--accent,var(--f-accent))}
.fig3 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig3 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig3 .bad{stroke:var(--muted,var(--f-muted));stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.fig3 .c{text-anchor:middle}
</style>
<g class="fig3">
<text class="h" x="10" y="18">Le secret reste hors de la sandbox</text>
<rect class="zone" x="6" y="30" width="120" height="96" rx="8"/><text class="m" x="16" y="48">sandbox</text>
<rect class="sh" x="22" y="68" width="88" height="40" rx="5"/><text class="i c" x="66" y="93">Agent</text>
<rect class="box" x="154" y="68" width="92" height="40" rx="5"/><text class="s c" x="200" y="93">Runtime</text>
<rect class="box" x="276" y="68" width="118" height="40" rx="5"/><text class="s c" x="335" y="86">Endpoint</text><text class="m c" x="335" y="101">approuvé</text>
<circle class="sh" cx="140" cy="62" r="10"/><text class="i c" x="140" y="66">1</text><path class="ln" d="M110 82 H154 M148 77 L154 82 L148 87"/><path class="ln" d="M154 102 H110 M116 97 L110 102 L116 107"/>
<circle class="sh" cx="261" cy="62" r="10"/><text class="i c" x="261" y="66">3</text><path class="ln" d="M246 82 H276 M270 77 L276 82 L270 87"/><path class="ln" d="M276 102 H246 M252 97 L246 102 L252 107"/><circle class="sh" cx="261" cy="118" r="10"/><text class="i c" x="261" y="122">4</text>
<text class="k c" x="170" y="144">secret ajouté ici (2)</text>
<text class="s" x="10" y="164">1  L'agent appelle l'API, sans secret.</text>
<text class="s" x="10" y="186">2  Le runtime ajoute le secret.</text>
<text class="s" x="10" y="208">3  L'endpoint approuvé répond.</text>
<text class="s" x="10" y="230">4  La réponse revient à l'agent.</text>
<rect class="dif" x="6" y="248" width="388" height="40" rx="5"/><text class="k" x="16" y="272">Affirmation de NVIDIA : l'agent ne voit jamais le secret.</text>
</g>
</svg>
