<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="fig5-t fig5-d">
<title id="fig5-t">Les couches autour d'un agent</title>
<desc id="fig5-d">De haut en bas : modèle, harness, runtime de policy (OpenShell), calcul fourni par un driver : Docker, Podman, MicroVM ou Kubernetes.</desc>
<style>
.fig5{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig5{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig5 text{font-family:system-ui,sans-serif;font-size:13px}
.fig5 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig5 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig5 .t{fill:var(--text,var(--f-text))}
.fig5 .m{fill:var(--muted,var(--f-muted))}
.fig5 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig5 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig5 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig5 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig5 .zone{fill:var(--raised,var(--f-raised));stroke:var(--muted,var(--f-muted));stroke-width:1;stroke-dasharray:5 3}
.fig5 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig5 .pol{fill:var(--accent,var(--f-accent))}
.fig5 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig5 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig5 .bad{stroke:var(--muted,var(--f-muted));stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.fig5 .c{text-anchor:middle}
</style>
<g class="fig5">
<text class="h" x="10" y="18">Où se place OpenShell</text>
<rect class="box" x="30" y="30" width="340" height="40" rx="5"/><text class="s c" x="200" y="55">Modèle</text>
<rect class="box" x="30" y="76" width="340" height="40" rx="5"/><text class="s c" x="200" y="96">Harness</text><text class="m c" x="200" y="111">l'agent et ses outils</text>
<rect class="dif" x="30" y="122" width="340" height="40" rx="5"/><text class="k c" x="200" y="147">Runtime de policy : OpenShell</text>
<rect class="box" x="30" y="168" width="340" height="104" rx="5"/><text class="s c" x="200" y="188">Calcul : un driver par gateway</text>
<rect class="sh" x="44" y="200" width="150" height="28" rx="4"/><text class="i c" x="119" y="219">Docker</text>
<rect class="sh" x="206" y="200" width="150" height="28" rx="4"/><text class="i c" x="281" y="219">Podman</text>
<rect class="sh" x="44" y="236" width="150" height="28" rx="4"/><text class="i c" x="119" y="255">MicroVM</text>
<rect class="sh" x="206" y="236" width="150" height="28" rx="4"/><text class="i c" x="281" y="255">Kubernetes</text>
<text class="m c" x="200" y="292">Liste non exhaustive : il en existe d'autres.</text>
</g>
</svg>
