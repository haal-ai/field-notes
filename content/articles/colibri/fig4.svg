<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" role="img" aria-labelledby="fig4-t fig4-d">
<title id="fig4-t">Vitesse de decoding de GLM-5.2 selon le matériel, mesures de l'auteur</title>
<desc id="fig4-d">Trois barres en tok/s : 0,05 à 0,1 sur un portable de 25 Go, 1,83 sur une machine de 128 Go à chaud, CPU seul, 9,0 à 9,2 sur six GPU RTX 5090 avec réglage NUMA et experts résidents (5,8 à 6,8 sans). Auto-déclaré, matériel différent.</desc>
<style>
.fig4{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig4{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig4 text{font-family:system-ui,sans-serif;font-size:13px}
.fig4 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig4 .t{fill:var(--text,var(--f-text))}
.fig4 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig4 .m{fill:var(--muted,var(--f-muted))}
.fig4 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig4 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig4 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig4 .hi{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:2}
.fig4 .bar{fill:var(--accent,var(--f-accent))}
.fig4 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig4 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig4 .dl{stroke:var(--muted,var(--f-muted));stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.fig4 .ah{fill:var(--accent,var(--f-accent))}
.fig4 .ahm{fill:var(--muted,var(--f-muted))}
.fig4 .c{text-anchor:middle}.fig4 .e{text-anchor:end}
</style>
<g class="fig4">
<text class="h" x="10" y="20">Vitesse de decoding, GLM-5.2</text><text class="m" x="10" y="38">tok/s, mesures de l'auteur du projet</text>
<text class="s" x="10" y="58">Portable, 25 Go de RAM, cache froid</text><rect class="bar" x="10" y="66" width="3.0" height="24"/><text class="a" x="21.0" y="84">0,05 à 0,1</text>
<text class="s" x="10" y="116">Machine de 128 Go (Ryzen AI Max+), à chaud, CPU seul</text><rect class="bar" x="10" y="124" width="51.2" height="24"/><text class="a" x="69.2" y="142">1,83</text>
<text class="s" x="10" y="174">6 GPU RTX 5090, réglage NUMA, experts résidents</text><rect class="bar" x="10" y="182" width="257.6" height="24"/><text class="a" x="275.6" y="200">9,0 à 9,2</text>
<path d="M10 226H290" stroke="var(--muted,var(--f-muted))" fill="none"/><text class="m" x="10" y="242">0</text><text class="m c" x="150" y="242">5</text><text class="m c" x="290" y="242">10 tok/s</text>
<text class="m" x="10" y="266">Sans ce réglage NUMA : 5,8 à 6,8 tok/s.</text><text class="m" x="10" y="288">Auto-déclaré, matériel différent :</text><text class="m" x="10" y="306">les barres ne sont pas comparables entre elles.</text>
</g>
