<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 466" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Une session ACP en version 1</title>
<desc id="fig2-d">Le client envoie initialize, l'agent répond, puis session/new, session/prompt, un flux de session/update, une demande de permission si besoin et la fin du tour. L'agent parle aussi à des serveurs MCP et à un fournisseur LLM, hors ACP.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig2 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig2 .sm{font-size:12px}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig2 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .dl{stroke:var(--muted,var(--f-muted));stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.fig2 .sep{stroke:var(--line,var(--f-line));stroke-width:1;stroke-dasharray:4 3}
.fig2 .c{text-anchor:middle}
</style>
<g class="fig2">
<text class="h" x="10" y="18">Une session ACP (v1)</text>
<rect class="box" x="30" y="28" width="100" height="28" rx="5"/>
<text class="s c" x="80" y="47">Client</text>
<rect class="box" x="270" y="28" width="100" height="28" rx="5"/>
<text class="s c" x="320" y="47">Agent</text>
<line class="sep" x1="80" y1="56" x2="80" y2="372"/><line class="sep" x1="320" y1="56" x2="320" y2="372"/>
<path class="ln" d="M80 84 H320 M314 80 L320 84 L314 88"/>
<text class="t sm c" x="200" y="78">1 initialize (version 1, capabilities)</text>
<path class="ln" d="M320 124 H80 M86 120 L80 124 L86 128"/>
<text class="t sm c" x="200" y="118">2 réponse (version retenue)</text>
<path class="ln" d="M80 164 H320 M314 160 L320 164 L314 168"/>
<text class="t sm c" x="200" y="158">3 session/new</text>
<path class="ln" d="M80 204 H320 M314 200 L320 204 L314 208"/>
<text class="t sm c" x="200" y="198">4 session/prompt</text>
<path class="ln" d="M320 244 H80 M86 240 L80 244 L86 248"/>
<text class="t sm c" x="200" y="238">5 session/update (flux)</text>
<path class="ln" d="M320 284 H80 M86 280 L80 284 L86 288"/>
<text class="t sm c" x="200" y="278">6 demande de permission, si besoin</text>
<path class="ln" d="M320 324 H80 M86 320 L80 324 L86 328"/>
<text class="t sm c" x="200" y="318">7 fin de tour</text>
<text class="m sm" x="10" y="400">Dehors, l'agent parle à des serveurs MCP</text>
<text class="m sm" x="10" y="416">et à un fournisseur LLM : hors ACP.</text>
<text class="m sm" x="10" y="438">Version = entier (1). D'après la spécification ;</text>
<text class="m sm" x="10" y="454">aucune session exécutée ici.</text>
</g>
</svg>
