<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 392" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">Ce qu'ACP standardise, et ce qui reste de côté</title>
<desc id="fig3-d">Deux colonnes. Standardisé : messages client-agent, version et capabilities, flux de mises à jour, demandes de permission, serveurs MCP. Non standardisé : fournisseur LLM, connexion et facturation, outils de l'agent, extensions, sandbox et skills.</desc>
<style>
.fig3{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig3{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig3 text{font-family:system-ui,sans-serif;font-size:13px}
.fig3 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig3 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig3 .t{fill:var(--text,var(--f-text))}
.fig3 .m{fill:var(--muted,var(--f-muted))}
.fig3 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig3 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig3 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig3 .sm{font-size:12px}
.fig3 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig3 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig3 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig3 .dl{stroke:var(--muted,var(--f-muted));stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.fig3 .sep{stroke:var(--line,var(--f-line));stroke-width:1;stroke-dasharray:4 3}
.fig3 .c{text-anchor:middle}
</style>
<g class="fig3">
<text class="h" x="10" y="18">ACP : le standard et le reste</text>
<rect class="sh" x="6" y="28" width="190" height="36" rx="5"/>
<text class="i c" x="101" y="51">Standardisé</text>
<rect class="dif" x="204" y="28" width="190" height="36" rx="5"/>
<text class="k c" x="299" y="51">Non standardisé</text>
<rect class="box" x="6" y="76" width="190" height="52" rx="5"/>
<rect class="dif" x="204" y="76" width="190" height="52" rx="5"/>
<text class="t sm" x="14" y="106">messages client-agent</text>
<text class="t sm" x="212" y="98">fournisseur LLM</text>
<text class="m sm" x="212" y="113">(proposition en brouillon)</text>
<rect class="box" x="6" y="134" width="190" height="52" rx="5"/>
<rect class="dif" x="204" y="134" width="190" height="52" rx="5"/>
<text class="t sm" x="14" y="164">version et capabilities</text>
<text class="t sm" x="212" y="164">connexion, facturation</text>
<rect class="box" x="6" y="192" width="190" height="52" rx="5"/>
<rect class="dif" x="204" y="192" width="190" height="52" rx="5"/>
<text class="t sm" x="14" y="222">flux de mises à jour</text>
<text class="t sm" x="212" y="222">outils de l'agent</text>
<rect class="box" x="6" y="250" width="190" height="52" rx="5"/>
<rect class="dif" x="204" y="250" width="190" height="52" rx="5"/>
<text class="t sm" x="14" y="280">demandes de permission</text>
<text class="t sm" x="212" y="280">extensions (_meta)</text>
<rect class="box" x="6" y="308" width="190" height="52" rx="5"/>
<rect class="dif" x="204" y="308" width="190" height="52" rx="5"/>
<text class="t sm" x="14" y="338">serveurs MCP transmis</text>
<text class="t sm" x="212" y="330">sandbox, skills</text>
<text class="m sm" x="212" y="345">(hors ACP, lecture de l'auteur)</text>
<text class="m sm" x="10" y="380">D'après la documentation ACP lue le 2026-11-26.</text>
</g>
</svg>
