<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 413" role="img" aria-labelledby="fig5-t fig5-d">
<title id="fig5-t">Séparer le harness du service d'IA</title>
<desc id="fig5-d">Quatre produits : Copilot CLI, OpenCode, Claude Code et Cursor, avec ce que leur documentation dit des fournisseurs et des limites.</desc>
<style>
.fig5{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig5{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig5 text{font-family:system-ui,sans-serif;font-size:13px}
.fig5 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig5 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig5 .t{fill:var(--text,var(--f-text))}
.fig5 .m{fill:var(--muted,var(--f-muted))}
.fig5 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig5 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig5 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig5 .sm{font-size:12px}
.fig5 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig5 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig5 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig5 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig5 .dl{stroke:var(--muted,var(--f-muted));stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.fig5 .sep{stroke:var(--line,var(--f-line));stroke-width:1;stroke-dasharray:4 3}
.fig5 .c{text-anchor:middle}
</style>
<g class="fig5">
<text class="h" x="10" y="18">Séparer le harness du service d'IA</text>
<rect class="box" x="6" y="30" width="388" height="85" rx="5"/>
<text class="s" x="14" y="52">Copilot CLI</text>
<text class="t sm" x="14" y="72">fournisseurs openai (compatible OpenAI),</text>
<text class="t sm" x="14" y="89">azure, anthropic</text>
<text class="t sm" x="14" y="106">limite : tool calling et streaming requis</text>
<rect class="box" x="6" y="123" width="388" height="68" rx="5"/>
<text class="s" x="14" y="145">OpenCode</text>
<text class="t sm" x="14" y="165">catalogue de fournisseurs, fournisseur</text>
<text class="t sm" x="14" y="182">compatible OpenAI, baseURL modifiable</text>
<rect class="box" x="6" y="199" width="388" height="85" rx="5"/>
<text class="s" x="14" y="221">Claude Code</text>
<text class="t sm" x="14" y="241">via Anthropic, Amazon Bedrock, Google Cloud</text>
<text class="t sm" x="14" y="258">ou Microsoft Foundry</text>
<text class="t sm" x="14" y="275">la page compare où l'inférence s'exécute</text>
<rect class="box" x="6" y="292" width="388" height="85" rx="5"/>
<text class="s" x="14" y="314">Cursor</text>
<text class="t sm" x="14" y="334">clés pour les modèles de chat seulement</text>
<text class="t sm" x="14" y="351">passe par les serveurs de Cursor</text>
<text class="t sm" x="14" y="368">Tab garde les modèles de Cursor</text>
<text class="k sm" x="10" y="399">D'après la documentation du 2026-11-26, non testé.</text>
</g>
</svg>
