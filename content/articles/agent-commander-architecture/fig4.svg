<text class="m sm c" x="366" y="199">non</text>
<text class="m sm" x="10" y="238">« non » = non vérifié dans les pages lues,</text>
<text class="m sm" x="10" y="254">pas « impossible ». JetBrains : OpenCode vu</text>
<text class="m sm" x="10" y="270">dans un exemple de configuration.</text>
<text class="k sm" x="10" y="290">Listé ne veut pas dire testé ici.</text>
