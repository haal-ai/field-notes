<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 564" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">Lock par repository ou lock par branche</title>
<desc id="fig3-d">Avec un lock par repository, deux agents qui poussent vers des branches différentes passent l'un après l'autre. Avec un lock par ref, ils avancent ensemble. Exemple pédagogique et repères GitHub.</desc>
<style>
.fig3{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig3{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig3 text{font-family:system-ui,sans-serif;font-size:12px}
.fig3 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig3 .s{fill:var(--text,var(--f-text));font-weight:700}
.fig3 .t{fill:var(--text,var(--f-text))}
.fig3 .m{fill:var(--muted,var(--f-muted))}
.fig3 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig3 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig3 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig3 .kt{fill:var(--news,var(--f-news))}
.fig3 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .hd{fill:var(--accent,var(--f-accent))}
.fig3 .bar{fill:var(--raised,var(--f-raised));stroke:var(--text,var(--f-text));stroke-width:1}
.fig3 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig3 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:1.5}
.fig3 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig3 .arr{fill:var(--accent,var(--f-accent))}
.fig3 .c{text-anchor:middle}.fig3 .e{text-anchor:end}
</style>
<g class="fig3">
<text class="h" x="10" y="18">Un lock pour tout le repository, ou par branche</text>
<text class="s" x="10" y="44">A. Lock par repository : B attend A</text><text class="t" x="10" y="78">Agent A</text><text class="t" x="10" y="110">Agent B</text><text class="m" x="10" y="92">(branche x)</text><text class="m" x="10" y="124">(branche y)</text><rect class="sh" x="90" y="60" width="130" height="26" rx="3"/><text class="i" x="98" y="77">écrit</text><rect class="dif" x="90" y="96" width="130" height="26" rx="3"/><text class="kt" x="98" y="113">attend A</text><rect class="sh" x="220" y="96" width="130" height="26" rx="3"/><text class="i" x="228" y="113">écrit</text><text class="m e" x="350" y="142">temps →</text>
<text class="s" x="10" y="166">B. Lock par ref : A et B avancent ensemble</text><text class="t" x="10" y="200">Agent A</text><text class="t" x="10" y="232">Agent B</text><text class="m" x="10" y="214">(branche x)</text><text class="m" x="10" y="246">(branche y)</text><rect class="sh" x="90" y="182" width="130" height="26" rx="3"/><text class="i" x="98" y="199">écrit</text><rect class="sh" x="90" y="218" width="130" height="26" rx="3"/><text class="i" x="98" y="235">écrit</text><text class="m e" x="350" y="264">temps →</text>
<text class="m" x="10" y="284">Seuls deux agents sur la même branche</text><text class="m" x="10" y="300">s'attendent.</text>
<rect class="box" x="10" y="326" width="380" height="102" rx="4"/>
<text class="s" x="18" y="346">Repères GitHub (rapportés par GitHub)</text>
<text class="t" x="18" y="366">5 replicas par défaut ; environ 25 ms d'aller-</text><text class="t" x="18" y="381">retour vers Azure ; plusieurs allers-retours</text><text class="t" x="18" y="396">par écriture. Lock par ref : 3 à 4 fois plus</text><text class="t" x="18" y="411">de débit (tests internes, montage non publié).</text>
<rect class="dif" x="10" y="440" width="380" height="112" rx="4"/>
<text class="k" x="18" y="460">Exemple pédagogique, pas un chiffre de GitHub</text>
<text class="kt" x="18" y="480">40 ms de travail + 3 allers-retours × 25 ms</text><text class="kt" x="18" y="495">= 40 + 75 = 115 ms sous lock</text><text class="kt" x="18" y="510">→ 1000 / 115 ≈ 9 écritures par seconde</text><text class="kt" x="18" y="525">Sans attente réseau : 1000 / 40 = 25 par seconde</text>
</g>
</svg>
