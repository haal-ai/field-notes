<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 298" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Un push : des objets, puis une branche</title>
<desc id="fig2-d">Un push envoie d'abord des objets immuables, stockés en parallèle. Il déplace ensuite une branche, pointeur partagé, une écriture à la fois.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig2 text{font-family:system-ui,sans-serif;font-size:12px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:700}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig2 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig2 .kt{fill:var(--news,var(--f-news))}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .hd{fill:var(--accent,var(--f-accent))}
.fig2 .bar{fill:var(--raised,var(--f-raised));stroke:var(--text,var(--f-text));stroke-width:1}
.fig2 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig2 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:1.5}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .arr{fill:var(--accent,var(--f-accent))}
.fig2 .c{text-anchor:middle}.fig2 .e{text-anchor:end}
</style>
<g class="fig2">
<text class="h" x="10" y="18">Un push, deux gestes</text>
<rect class="box" x="10" y="34" width="170" height="206" rx="4"/><rect class="hd" x="10" y="34" width="170" height="26" rx="4"/>
<text class="i c" x="95" y="52">1. Objets</text>
<text class="t" x="20" y="84">Commits, arbres,</text><text class="t" x="20" y="100">fichiers</text><text class="t" x="20" y="116"></text><text class="t" x="20" y="132">Immuables : nommés</text><text class="t" x="20" y="148">par leur contenu</text><text class="t" x="20" y="164">(content-addressed)</text><text class="t" x="20" y="180"></text><text class="t" x="20" y="196">Stockés en parallèle</text><text class="t" x="20" y="212">sur plusieurs machines</text>
<rect class="box" x="220" y="34" width="170" height="206" rx="4"/><rect class="hd" x="220" y="34" width="170" height="26" rx="4"/>
<text class="i c" x="305" y="52">2. Branche (ref)</text>
<text class="t" x="230" y="84">Pointeur partagé,</text><text class="t" x="230" y="100">par exemple main</text><text class="t" x="230" y="116"></text><text class="t" x="230" y="132">Une écriture à la fois</text><text class="t" x="230" y="148"></text><text class="t" x="230" y="164">Souvent déplacée par</text><text class="t" x="230" y="180">compare-and-swap</text>
<line class="ln" x1="182" y1="137" x2="212" y2="137"/><path class="arr" d="M218 137 l-8 -5 v10 z"/>
<text class="t c" x="200" y="266">Les objets passent à l'échelle.</text><text class="a c" x="200" y="284">L'ordre se joue sur la branche.</text>
</g>
</svg>
