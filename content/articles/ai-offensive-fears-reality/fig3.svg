<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">La boucle d'agent décrite par le FBI</title>
<desc id="fig3-d">Cinq étapes en boucle : objectif écrit en langage naturel, agents, outils existants, résultats, retour. Le périmètre autorisé reste une décision humaine, hors de la boucle.</desc>
<style>
.fig3{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db;--f-bad:#8a2d2d;--f-badbg:#f8e6e6}
@media (prefers-color-scheme:dark){.fig3{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c;--f-bad:#f0a9a9;--f-badbg:#33211f}}
.fig3 text{font-family:system-ui,sans-serif;font-size:13px}
.fig3 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig3 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig3 .t{fill:var(--text,var(--f-text))}
.fig3 .m{fill:var(--muted,var(--f-muted))}
.fig3 .sm{font-size:12px}
.fig3 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig3 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig3 .x{fill:var(--f-bad);font-weight:700}
.fig3 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig3 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig3 .bad{fill:var(--f-badbg);stroke:var(--f-bad);stroke-width:1}
.fig3 .sh{fill:var(--accent,var(--f-accent))}
.fig3 .bar{fill:var(--accent,var(--f-accent))}
.fig3 .barm{fill:var(--f-line)}
.fig3 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig3 .sep{stroke:var(--line,var(--f-line));stroke-width:1;stroke-dasharray:4 3;fill:none}
.fig3 .c{text-anchor:middle}
</style>
<g class="fig3">
<text class="h" x="10" y="18">La boucle décrite par le FBI</text><rect class="box" x="6" y="28" width="330" height="46" rx="5"/><circle class="sh" cx="28" cy="51" r="11"/><text class="i c" x="28" y="56">1</text><text class="s" x="48" y="48">Objectif</text><text class="m sm" x="48" y="65">écrit en langage naturel</text><path class="ln" d="M171 74 V88 M166 82 L171 88 L176 82"/><rect class="box" x="6" y="88" width="330" height="46" rx="5"/><circle class="sh" cx="28" cy="111" r="11"/><text class="i c" x="28" y="116">2</text><text class="s" x="48" y="108">Agents</text><text class="m sm" x="48" y="125">interprètent l'objectif</text><path class="ln" d="M171 134 V148 M166 142 L171 148 L176 142"/><rect class="box" x="6" y="148" width="330" height="46" rx="5"/><circle class="sh" cx="28" cy="171" r="11"/><text class="i c" x="28" y="176">3</text><text class="s" x="48" y="168">Outils existants</text><text class="m sm" x="48" y="185">les agents les actionnent</text><path class="ln" d="M171 194 V208 M166 202 L171 208 L176 202"/><rect class="box" x="6" y="208" width="330" height="46" rx="5"/><circle class="sh" cx="28" cy="231" r="11"/><text class="i c" x="28" y="236">4</text><text class="s" x="48" y="228">Résultats</text><text class="m sm" x="48" y="245">remontent aux agents</text><path class="ln" d="M171 254 V268 M166 262 L171 268 L176 262"/><rect class="box" x="6" y="268" width="330" height="46" rx="5"/><circle class="sh" cx="28" cy="291" r="11"/><text class="i c" x="28" y="296">5</text><text class="s" x="48" y="288">Retour</text><text class="m sm" x="48" y="305">nouvelle action, jusqu'à l'objectif</text><path class="ln" d="M336 291 H372 V51 H342 M348 46 L338 51 L348 56"/><text class="m sm" transform="translate(388 159) rotate(90)" text-anchor="middle">on recommence</text><rect class="dif" x="6" y="332" width="388" height="52" rx="5"/><text class="k" x="16" y="354">Le périmètre autorisé reste</text><text class="k" x="16" y="372">une décision humaine.</text><text class="m sm" x="10" y="406">Source : FBI, FLASH-20261113-001 ; GTIG.</text>
</g>
</svg>
