<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Échelle de compétence en quatre niveaux</title>
<desc id="fig2-d">Quatre niveaux avec statut. Niveau 4, reconstruire un produit complet : non démontré, coûteux. Niveau 3, reconstruire des parties choisies : possible avec des tests (cas ciblés montrés par InfoQ). Niveau 2, comprendre la structure : faisable maintenant. Niveau 1, identifier un logiciel et en extraire le contenu : faisable maintenant. Niveaux 1 à 3 : observations personnelles. Avant : spécialiste ; avec un agent : débutant, niveaux 1 et 2 (avis personnel).</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db;--f-bad:#8a2d2d;--f-badbg:#f8e6e6}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c;--f-bad:#f0a9a9;--f-badbg:#33211f}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .sm{font-size:12px}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig2 .x{fill:var(--f-bad);font-weight:700}
.fig2 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig2 .bad{fill:var(--f-badbg);stroke:var(--f-bad);stroke-width:1}
.fig2 .sh{fill:var(--accent,var(--f-accent))}
.fig2 .bar{fill:var(--accent,var(--f-accent))}
.fig2 .barm{fill:var(--f-line)}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .sep{stroke:var(--line,var(--f-line));stroke-width:1;stroke-dasharray:4 3;fill:none}
.fig2 .c{text-anchor:middle}
</style>
<g class="fig2">
<text class="h" x="10" y="18">Échelle de compétence</text><rect class="bad" x="6" y="28" width="388" height="46" rx="5"/><circle class="sh" cx="28" cy="51" r="11"/><text class="i c" x="28" y="56">4</text><text class="s" x="48" y="48">Reconstruire un produit complet</text><text class="x sm" x="48" y="65">non démontré, coûteux</text><rect class="box" x="6" y="82" width="388" height="46" rx="5"/><circle class="sh" cx="28" cy="105" r="11"/><text class="i c" x="28" y="110">3</text><text class="s" x="48" y="102">Reconstruire des parties choisies</text><text class="a sm" x="48" y="119">possible, avec des tests (cas ciblés : InfoQ)</text><rect class="box" x="6" y="136" width="388" height="46" rx="5"/><circle class="sh" cx="28" cy="159" r="11"/><text class="i c" x="28" y="164">2</text><text class="s" x="48" y="156">Comprendre sa structure</text><text class="a sm" x="48" y="173">faisable maintenant</text><rect class="box" x="6" y="190" width="388" height="46" rx="5"/><circle class="sh" cx="28" cy="213" r="11"/><text class="i c" x="28" y="218">1</text><text class="s" x="48" y="210">Identifier un logiciel et en extraire le contenu</text><text class="a sm" x="48" y="227">faisable maintenant</text><text class="m sm" x="10" y="252">Niveaux 1 à 3 : observations personnelles, pas des mesures.</text><text class="s" x="10" y="270">Qui y arrive ?</text><text class="t sm" x="10" y="294">Avant : spécialiste formé</text><rect class="barm" x="10" y="300" width="380" height="12" rx="3"/><text class="t sm" x="10" y="338">Avec un agent : débutant, niveaux 1 et 2 (avis personnel)</text><rect class="barm" x="10" y="344" width="380" height="12" rx="3"/><rect class="bar" x="10" y="344" width="190" height="12" rx="3"/><text class="m sm" x="10" y="376">Barre pleine = niveaux 1 à 4 ; barre verte = niveaux 1 et 2.</text>
</g>
</svg>
