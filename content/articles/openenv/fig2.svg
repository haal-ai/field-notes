<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">La boucle d'un episode : reset, action, step, observation et reward</title>
<desc id="fig2-d">L'environnement démarre un episode avec reset() et renvoie une première observation. La policy choisit une action. step(action) renvoie une observation, une reward et un indicateur de fin. La boucle se répète jusqu'à la fin. state() lit l'état à tout moment.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .key{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .thin{stroke:var(--muted,var(--f-muted));stroke-width:1;fill:none}
.fig2 .sep{stroke:var(--line,var(--f-line));stroke-width:1.5;stroke-dasharray:4 3;fill:none}
.fig2 .c{text-anchor:middle}
</style>
<g class="fig2">
<rect class="box" x="10" y="10" width="90" height="30" rx="5"/><text class="s c" x="55" y="30">Policy</text>
<rect class="box" x="282" y="10" width="112" height="30" rx="5"/><text class="s c" x="340" y="30">Environnement</text>
<path class="sep" d="M55 40 V300"/><path class="sep" d="M340 40 V300"/>
<text class="m c" x="200" y="64">Début de l'episode</text>
<text class="t c" x="200" y="88">reset() : première observation</text><path class="ln" d="M340 96 H55 M61 91 L55 96 L61 101"/>
<text class="t c" x="200" y="136">action</text><path class="ln" d="M55 144 H340 M334 139 L340 144 L334 149"/>
<text class="t c" x="200" y="172">step(action) renvoie :</text><text class="t c" x="200" y="190">observation, reward, terminé ?</text><path class="ln" d="M340 198 H55 M61 193 L55 198 L61 203"/>
<rect class="key" x="10" y="218" width="380" height="36" rx="5"/><text class="k c" x="200" y="241">Répéter action et step jusqu'à la fin = 1 episode</text>
<text class="m c" x="200" y="284">state() : lire l'état à tout moment</text><path class="sep" d="M55 292 H340 M334 287 L340 292 L334 297"/>
</g>
</svg>
