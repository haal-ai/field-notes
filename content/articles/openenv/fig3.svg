<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 248" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">Une image d'environnement, trois lieux d'exécution</title>
<desc id="fig3-d">Une même image Docker d'environnement s'exécute en local, dans une sandbox cloud ou comme Hugging Face Space. Dans les trois cas, l'interface est la même.</desc>
<style>
.fig3{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig3{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig3 text{font-family:system-ui,sans-serif;font-size:13px}
.fig3 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig3 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig3 .t{fill:var(--text,var(--f-text))}
.fig3 .m{fill:var(--muted,var(--f-muted))}
.fig3 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig3 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig3 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .key{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig3 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig3 .thin{stroke:var(--muted,var(--f-muted));stroke-width:1;fill:none}
.fig3 .sep{stroke:var(--line,var(--f-line));stroke-width:1.5;stroke-dasharray:4 3;fill:none}
.fig3 .c{text-anchor:middle}
</style>
<g class="fig3">
<rect class="key" x="50" y="10" width="300" height="44" rx="5"/><text class="s c" x="200" y="29">Image Docker</text><text class="t c" x="200" y="46">de l'environnement</text>

<path class="ln" d="M200 54 L65 106"/>
<path class="ln" d="M60 98 L65 106 L70 98"/>
<rect class="box" x="6" y="106" width="118" height="46" rx="5"/>
<text class="s c" x="65" y="134">Machine locale</text>

<path class="ln" d="M200 54 L200 106"/>
<path class="ln" d="M195 98 L200 106 L205 98"/>
<rect class="box" x="141" y="106" width="118" height="46" rx="5"/>
<text class="s c" x="200" y="134">Sandbox cloud</text>

<path class="ln" d="M200 54 L335 106"/>
<path class="ln" d="M330 98 L335 106 L340 98"/>
<rect class="box" x="276" y="106" width="118" height="46" rx="5"/>
<text class="s c" x="335" y="126">Hugging Face</text><text class="s c" x="335" y="143">Space</text>
<rect class="box" x="6" y="170" width="388" height="40" rx="5"/><text class="a c" x="200" y="195">Même interface : reset, step, state</text>
<text class="m c" x="200" y="236">Trois lieux d'exécution, une seule image.</text>
</g>
</svg>
