<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 362" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Quatre rôles et une personne qui juge : testing agent, driver, produit testé, observer, relecteur humain</title>
<desc id="fig2-d">Le testing agent prépare, le driver envoie, le produit agit, l'observer enregistre l'effet réel, une personne juge. L'observer ne se fie pas à la réponse du modèle.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig2 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig2 .big{fill:var(--accent,var(--f-accent));font-size:28px;font-weight:700}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig2 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .c{text-anchor:middle}
</style>
<g class="fig2">
<text class="h" x="10" y="18">Qui fait quoi</text>
<rect class="box" x="6" y="28" width="388" height="46" rx="5"/>
<text class="s" x="16" y="48">Testing agent</text>
<text class="m" x="16" y="66">prépare les cas</text>
<path class="ln" d="M200 74 V86 M195 80 L200 86 L205 80"/>
<rect class="box" x="6" y="88" width="388" height="46" rx="5"/>
<text class="s" x="16" y="108">Driver</text>
<text class="m" x="16" y="126">envoie les requêtes</text>
<path class="ln" d="M200 134 V146 M195 140 L200 146 L205 140"/>
<rect class="box" x="6" y="148" width="388" height="46" rx="5"/>
<text class="s" x="16" y="168">Produit testé</text>
<text class="m" x="16" y="186">agit</text>
<path class="ln" d="M200 194 V206 M195 200 L200 206 L205 200"/>
<rect class="dif" x="6" y="208" width="388" height="46" rx="5"/>
<text class="s" x="16" y="228">Observer</text>
<text class="m" x="16" y="246">enregistre l'effet réel</text>
<path class="ln" d="M200 254 V266 M195 260 L200 266 L205 260"/>
<rect class="box" x="6" y="268" width="388" height="46" rx="5"/>
<text class="s" x="16" y="288">Relecteur humain</text>
<text class="m" x="16" y="306">juge</text>
<text class="k" x="10" y="334">L'observer ne croit pas</text>
<text class="k" x="10" y="352">la réponse du modèle.</text>
</g>
</svg>
