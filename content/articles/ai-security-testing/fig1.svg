<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 428" role="img" aria-labelledby="fig1-t fig1-d">
<title id="fig1-t">De la frontière à la décision : sept étapes</title>
<desc id="fig1-d">Sept étapes se suivent : frontière, zone de test, inventaire, cas avec oracle, exécution, classement des preuves, conservation et nettoyage. Une personne décide du périmètre et du déploiement.</desc>
<style>
.fig1{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig1{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig1 text{font-family:system-ui,sans-serif;font-size:13px}
.fig1 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig1 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig1 .t{fill:var(--text,var(--f-text))}
.fig1 .m{fill:var(--muted,var(--f-muted))}
.fig1 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig1 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig1 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig1 .big{fill:var(--accent,var(--f-accent));font-size:28px;font-weight:700}
.fig1 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig1 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig1 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig1 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig1 .c{text-anchor:middle}
</style>
<g class="fig1">
<text class="h" x="10" y="18">De la frontière à la décision</text>
<rect class="box" x="6" y="28" width="388" height="32" rx="5"/>
<circle class="sh" cx="26" cy="44" r="11"/>
<text class="i c" x="26" y="49">1</text>
<text class="s" x="46" y="49">Frontière : capacités réelles</text>
<path class="ln" d="M200 60 V72 M195 66 L200 72 L205 66"/>
<rect class="box" x="6" y="74" width="388" height="32" rx="5"/>
<circle class="sh" cx="26" cy="90" r="11"/>
<text class="i c" x="26" y="95">2</text>
<text class="s" x="46" y="95">Zone de test : données synthétiques</text>
<path class="ln" d="M200 106 V118 M195 112 L200 118 L205 112"/>
<rect class="box" x="6" y="120" width="388" height="32" rx="5"/>
<circle class="sh" cx="26" cy="136" r="11"/>
<text class="i c" x="26" y="141">3</text>
<text class="s" x="46" y="141">Inventaire et advisories connus</text>
<path class="ln" d="M200 152 V164 M195 158 L200 164 L205 158"/>
<rect class="box" x="6" y="166" width="388" height="32" rx="5"/>
<circle class="sh" cx="26" cy="182" r="11"/>
<text class="i c" x="26" y="187">4</text>
<text class="s" x="46" y="187">Cas avec oracle</text>
<path class="ln" d="M200 198 V210 M195 204 L200 210 L205 204"/>
<rect class="box" x="6" y="212" width="388" height="32" rx="5"/>
<circle class="sh" cx="26" cy="228" r="11"/>
<text class="i c" x="26" y="233">5</text>
<text class="s" x="46" y="233">Petits essais, puis vrai serveur</text>
<path class="ln" d="M200 244 V256 M195 250 L200 256 L205 250"/>
<rect class="box" x="6" y="258" width="388" height="32" rx="5"/>
<circle class="sh" cx="26" cy="274" r="11"/>
<text class="i c" x="26" y="279">6</text>
<text class="s" x="46" y="279">Classement des preuves</text>
<path class="ln" d="M200 290 V302 M195 296 L200 302 L205 296"/>
<rect class="box" x="6" y="304" width="388" height="32" rx="5"/>
<circle class="sh" cx="26" cy="320" r="11"/>
<text class="i c" x="26" y="325">7</text>
<text class="s" x="46" y="325">Conservation, relecture, nettoyage</text>
<rect class="dif" x="6" y="344" width="388" height="52" rx="5"/>
<text class="k" x="16" y="365">HUMAIN</text>
<text class="t" x="16" y="384">décide du périmètre et du déploiement</text>
<text class="m" x="10" y="418">Méthode de travail proposée, pas un standard.</text>
</g>
</svg>
