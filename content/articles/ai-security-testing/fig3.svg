<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 272" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">Cas apparié : refusé (compteur 0), autorisé (compteur 1)</title>
<desc id="fig3-d">Le cas A doit laisser le compteur à 0. Le cas B doit le faire passer à 1 et sert de contrôle positif. Si B échoue, le montage est suspect et le 0 de A ne prouve rien. Exemple illustratif.</desc>
<style>
.fig3{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig3{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig3 text{font-family:system-ui,sans-serif;font-size:13px}
.fig3 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig3 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig3 .t{fill:var(--text,var(--f-text))}
.fig3 .m{fill:var(--muted,var(--f-muted))}
.fig3 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig3 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig3 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig3 .big{fill:var(--accent,var(--f-accent));font-size:28px;font-weight:700}
.fig3 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig3 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig3 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig3 .c{text-anchor:middle}
</style>
<g class="fig3">
<text class="h" x="10" y="18">Un cas refusé, un cas autorisé</text>
<rect class="box" x="6" y="30" width="190" height="136" rx="5"/>
<text class="s" x="16" y="52">Cas A : refusé</text>
<text class="t" x="16" y="74">Décision : refuser</text>
<text class="m" x="16" y="96">Compteur attendu :</text>
<text class="big" x="16" y="134">0</text>
<rect class="dif" x="204" y="30" width="190" height="136" rx="5"/>
<text class="s" x="214" y="52">Cas B : autorisé</text>
<text class="t" x="214" y="74">Décision : autoriser</text>
<text class="m" x="214" y="96">Compteur attendu :</text>
<text class="big" x="214" y="134">1</text>
<text class="k" x="214" y="158">Contrôle positif</text>
<rect class="box" x="6" y="178" width="388" height="62" rx="5"/>
<text class="t" x="16" y="200">Si B échoue, le montage est suspect :</text>
<text class="t" x="16" y="220">le 0 de A ne prouve rien.</text>
<text class="m" x="10" y="262">Exemple illustratif, compteur fictif.</text>
</g>
</svg>
