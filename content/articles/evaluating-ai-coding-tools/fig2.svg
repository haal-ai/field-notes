<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 446" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Un test équitable en sept étapes</title>
<desc id="fig2-d">Même code et même consigne, grille cachée, une exécution par outil, collecte des sorties, notation en aveugle, réconciliation, rapport.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .big{fill:var(--accent,var(--f-accent));font-weight:700;font-size:18px}
.fig2 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig2 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .hi{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig2 .bar{fill:var(--raised,var(--f-raised));stroke:var(--text,var(--f-text));stroke-width:1}
.fig2 .sh{fill:var(--accent,var(--f-accent))}
.fig2 .nw{fill:var(--news,var(--f-news))}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .lk{stroke:var(--news,var(--f-news));stroke-width:1.5;fill:none;stroke-dasharray:5 3}
.fig2 .ax{stroke:var(--muted,var(--f-muted));stroke-width:1.5;fill:none}
.fig2 .c{text-anchor:middle}.fig2 .e{text-anchor:end}
</style>
<g class="fig2">
<text class="h" x="10" y="20">Un test équitable, étape par étape</text>
<rect class="box" x="10" y="34" width="380" height="44" rx="6"/>
<circle class="sh" cx="34" cy="56" r="13"/><text class="i c" x="34" y="61">1</text>
<text class="s" x="58" y="53">Même code réel,</text>
<text class="t" x="58" y="70">même consigne pour tous</text>
<path class="ln" d="M200 78V85"/><polygon class="sh" points="195,83 205,83 200,90"/>
<rect class="box" x="10" y="90" width="380" height="44" rx="6"/>
<circle class="sh" cx="34" cy="112" r="13"/><text class="i c" x="34" y="117">2</text>
<text class="s" x="58" y="109">Grille de notation</text>
<text class="t" x="58" y="126">cachée aux outils</text>
<path class="ln" d="M200 134V141"/><polygon class="sh" points="195,139 205,139 200,146"/>
<rect class="box" x="10" y="146" width="380" height="44" rx="6"/>
<circle class="sh" cx="34" cy="168" r="13"/><text class="i c" x="34" y="173">3</text>
<text class="s" x="58" y="173">Une exécution par outil</text>
<path class="ln" d="M200 190V197"/><polygon class="sh" points="195,195 205,195 200,202"/>
<rect class="box" x="10" y="202" width="380" height="44" rx="6"/>
<circle class="sh" cx="34" cy="224" r="13"/><text class="i c" x="34" y="229">4</text>
<text class="s" x="58" y="221">Collecte : diff, journaux de tests,</text>
<text class="t" x="58" y="238">coût, journal de plantages</text>
<path class="ln" d="M200 246V253"/><polygon class="sh" points="195,251 205,251 200,258"/>
<rect class="box" x="10" y="258" width="380" height="44" rx="6"/>
<circle class="sh" cx="34" cy="280" r="13"/><text class="i c" x="34" y="285">5</text>
<text class="s" x="58" y="277">Notation en aveugle</text>
<text class="t" x="58" y="294">(blind judging)</text>
<path class="ln" d="M200 302V309"/><polygon class="sh" points="195,307 205,307 200,314"/>
<rect class="box" x="10" y="314" width="380" height="44" rx="6"/>
<circle class="sh" cx="34" cy="336" r="13"/><text class="i c" x="34" y="341">6</text>
<text class="s" x="58" y="341">Réconciliation des notes</text>
<path class="ln" d="M200 358V365"/><polygon class="sh" points="195,363 205,363 200,370"/>
<rect class="box" x="10" y="370" width="380" height="44" rx="6"/>
<circle class="sh" cx="34" cy="392" r="13"/><text class="i c" x="34" y="397">7</text>
<text class="s" x="58" y="397">Rapport</text>
<text class="m" x="10" y="434">Méthode générique, sans mesure.</text>

</g>
</svg>
