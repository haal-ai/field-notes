<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 328" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">Le diff isole le travail de l'agent</title>
<desc id="fig3-d">Un diff représente par exemple 5 % du code. Un juge qui lit tout dilue le signal. Un juge du diff l'isole mais perd la vue d'ensemble.</desc>
<style>
.fig3{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig3{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig3 text{font-family:system-ui,sans-serif;font-size:13px}
.fig3 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig3 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig3 .t{fill:var(--text,var(--f-text))}
.fig3 .m{fill:var(--muted,var(--f-muted))}
.fig3 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig3 .big{fill:var(--accent,var(--f-accent));font-weight:700;font-size:18px}
.fig3 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig3 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig3 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .hi{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig3 .bar{fill:var(--raised,var(--f-raised));stroke:var(--text,var(--f-text));stroke-width:1}
.fig3 .sh{fill:var(--accent,var(--f-accent))}
.fig3 .nw{fill:var(--news,var(--f-news))}
.fig3 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig3 .lk{stroke:var(--news,var(--f-news));stroke-width:1.5;fill:none;stroke-dasharray:5 3}
.fig3 .ax{stroke:var(--muted,var(--f-muted));stroke-width:1.5;fill:none}
.fig3 .c{text-anchor:middle}.fig3 .e{text-anchor:end}
</style>
<g class="fig3">
<text class="h" x="10" y="20">Toute l'application ou le diff</text>
<text class="m" x="10" y="46">Le code de l'application (100 %)</text>
<rect class="bar" x="10" y="56" width="380" height="30" rx="3"/>
<rect class="hi" x="10" y="56" width="19" height="30" rx="0"/>
<path class="lk" d="M20 56V44"/><text class="k" x="28" y="42"></text>
<text class="k" x="34" y="106">≈ 5 % : le diff de l'agent (exemple)</text>
<path class="lk" d="M20 86V96"/><rect class="box" x="10" y="126" width="380" height="70" rx="6"/>
<text class="s" x="20" y="148">Juge qui lit tout</text>
<text class="t" x="20" y="168">Le signal de l'agent est dilué</text>
<text class="t" x="20" y="185">dans le code déjà présent.</text>
<rect class="box" x="10" y="208" width="380" height="88" rx="6"/>
<text class="s" x="20" y="230">Juge du diff</text>
<text class="t" x="20" y="250">Il isole le travail de l'agent,</text>
<text class="t" x="20" y="267">mais voit moins bien comment le changement</text>
<text class="t" x="20" y="284">s'insère dans l'ensemble.</text>
<text class="m" x="10" y="318">5 % : exemple illustratif, pas une mesure.</text>

</g>
</svg>
