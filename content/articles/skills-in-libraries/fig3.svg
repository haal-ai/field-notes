<text class="t" x="222" y="211" >sur la version installée</text>
<rect class="dif" x="6" y="258" width="388" height="52" rx="5"/>
<text class="k" x="16" y="279" >Exemple mesuré le 26 novembre 2026 :</text>
<text class="t" x="16" y="298" >@trpc/server 11.31.3 contient 16 skills (npm pack)</text>
<text class="m" x="10" y="332" >Argument des défenseurs de la convention :</text>
