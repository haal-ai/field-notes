<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 378" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">Sans et avec une skill livrée dans le paquet</title>
<desc id="fig3-d">Sans skill, l'agent s'appuie sur des exemples anciens et peut écrire des appels dépassés. Avec une skill livrée dans le paquet, les instructions correspondent à la version installée et changent avec elle. Exemple mesuré : @trpc/server 11.31.3 contient 16 skills.</desc>
<style>
.fig3{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db;--f-bad:#9b2c2c;--f-badbg:#fbe9e7}
@media (prefers-color-scheme:dark){.fig3{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c;--f-bad:#f2a49a;--f-badbg:#3a1f1d}}
.fig3 text{font-family:system-ui,sans-serif;font-size:13px}
.fig3 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig3 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig3 .t{fill:var(--text,var(--f-text))}
.fig3 .m{fill:var(--muted,var(--f-muted));font-size:12px}
.fig3 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig3 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig3 .r{fill:var(--f-bad);font-weight:700}
.fig3 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig3 .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:var(--text,var(--f-text))}
.fig3 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .rb{fill:var(--raised,var(--f-raised));stroke:var(--line,var(--f-line));stroke-width:1}
.fig3 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig3 .bad{fill:var(--f-badbg);stroke:var(--f-bad);stroke-width:2}
.fig3 .sh{fill:var(--accent,var(--f-accent));stroke:none}
.fig3 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig3 .c{text-anchor:middle}
</style>
<g class="fig3">
<text class="h" x="10" y="20" >Sans et avec une skill de bibliothèque</text>
<rect class="bad" x="6" y="32" width="190" height="214" rx="5"/>
<text class="r" x="16" y="54" >Sans skill</text>
<rect class="rb" x="16" y="66" width="170" height="34" rx="5"/>
<text class="s" x="24" y="87" >agent</text>
<path class="ln" d="M101 100 V116 M96 110 L101 116 L106 110"/>
<rect class="rb" x="16" y="116" width="170" height="44" rx="5"/>
<text class="t" x="24" y="143" >exemples anciens</text>
<path class="ln" d="M101 160 V176 M96 170 L101 176 L106 170"/>
<rect class="rb" x="16" y="176" width="170" height="60" rx="5"/>
<text class="t" x="24" y="194" >appels possiblement</text>
<text class="t" x="24" y="211" >dépassés</text>
<rect class="box" x="204" y="32" width="190" height="214" rx="5"/>
<text class="a" x="214" y="54" textLength="172" lengthAdjust="spacingAndGlyphs">Avec une skill dans le paquet</text>
<rect class="rb" x="214" y="66" width="170" height="34" rx="5"/>
<text class="s" x="222" y="87" >paquet version X</text>
<path class="ln" d="M299 100 V116 M294 110 L299 116 L304 110"/>
<rect class="rb" x="214" y="116" width="170" height="44" rx="5"/>
<text class="t" x="222" y="134" >skill version X</text>
<text class="m" x="222" y="151" >elle change avec lui</text>
<path class="ln" d="M299 160 V176 M294 170 L299 176 L304 170"/>
<rect class="rb" x="214" y="176" width="170" height="60" rx="5"/>
