<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" role="img" aria-labelledby="fig5-t fig5-d">
<title id="fig5-t">Ce que l'approval protège</title>
<desc id="fig5-d">Un paquet apporte du texte de skill et parfois des scripts que l'agent suit à chaque session. Avant d'approuver : lire le texte, chercher des scripts et allowed-tools, n'approuver que certaines skills.</desc>
<style>
.fig5{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db;--f-bad:#9b2c2c;--f-badbg:#fbe9e7}
@media (prefers-color-scheme:dark){.fig5{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c;--f-bad:#f2a49a;--f-badbg:#3a1f1d}}
.fig5 text{font-family:system-ui,sans-serif;font-size:13px}
.fig5 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig5 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig5 .t{fill:var(--text,var(--f-text))}
.fig5 .m{fill:var(--muted,var(--f-muted));font-size:12px}
.fig5 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig5 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig5 .r{fill:var(--f-bad);font-weight:700}
.fig5 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig5 .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:var(--text,var(--f-text))}
.fig5 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig5 .rb{fill:var(--raised,var(--f-raised));stroke:var(--line,var(--f-line));stroke-width:1}
.fig5 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig5 .bad{fill:var(--f-badbg);stroke:var(--f-bad);stroke-width:2}
.fig5 .sh{fill:var(--accent,var(--f-accent));stroke:none}
.fig5 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig5 .c{text-anchor:middle}
</style>
<g class="fig5">
<text class="h" x="10" y="20" >Ce que l'approval protège</text>
<rect class="rb" x="6" y="32" width="112" height="60" rx="5"/>
<text class="s" x="16" y="54" >Paquet</text>
<text class="m" x="16" y="72" >dépendance</text>
<path class="ln" d="M118 62 H134 M128 57 L134 62 L128 67"/>
<rect class="dif" x="134" y="32" width="126" height="60" rx="5"/>
<text class="t" x="144" y="54" >Texte de skill</text>
<text class="t" x="144" y="72" >+ scripts éventuels</text>
<path class="ln" d="M260 62 H276 M270 57 L276 62 L270 67"/>
<rect class="rb" x="276" y="32" width="118" height="60" rx="5"/>
<text class="s" x="286" y="54" >Agent</text>
<text class="m" x="286" y="72" textLength="100" lengthAdjust="spacingAndGlyphs">suit à chaque session</text>
<text class="h" x="10" y="122" >Avant d'approuver</text>
<rect class="box" x="6" y="132" width="388" height="40" rx="5"/>
<circle class="sh" cx="26" cy="152" r="11"/><text class="i c" x="26" y="157" >1</text>
<text class="s" x="46" y="157" >Lire le texte de la skill.</text>
<rect class="box" x="6" y="180" width="388" height="56" rx="5"/>
<circle class="sh" cx="26" cy="200" r="11"/><text class="i c" x="26" y="205" >2</text>
<text class="s" x="46" y="205" >Chercher des scripts et le champ</text>
<text class="mono" x="46" y="224" >allowed-tools (expérimental).</text>
<rect class="box" x="6" y="244" width="388" height="56" rx="5"/>
<circle class="sh" cx="26" cy="264" r="11"/><text class="i c" x="26" y="269" >3</text>
<text class="s" x="46" y="269" >N'approuver que certaines skills :</text>
<text class="mono" x="46" y="288" >skills: [guide, migrate]</text>
<text class="m" x="10" y="320" >Sources : pnpm, Agent skills ; spécification Agent Skills.</text>
</g>
</svg>
