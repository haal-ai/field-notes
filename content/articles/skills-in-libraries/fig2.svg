<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 358" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Chargement d'une skill par étapes</title>
<desc id="fig2-d">L'agent charge une skill en trois étapes : au démarrage name et description (environ 100 tokens, valeur indicative de la spécification), puis le SKILL.md complet si la tâche correspond (moins de 5 000 tokens recommandés), puis references, scripts et assets au besoin.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db;--f-bad:#9b2c2c;--f-badbg:#fbe9e7}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c;--f-bad:#f2a49a;--f-badbg:#3a1f1d}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted));font-size:12px}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig2 .r{fill:var(--f-bad);font-weight:700}
.fig2 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig2 .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;fill:var(--text,var(--f-text))}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .rb{fill:var(--raised,var(--f-raised));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig2 .bad{fill:var(--f-badbg);stroke:var(--f-bad);stroke-width:2}
.fig2 .sh{fill:var(--accent,var(--f-accent));stroke:none}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .c{text-anchor:middle}
</style>
<g class="fig2">
<text class="h" x="10" y="20" >Trois étapes, de plus en plus de texte</text>



<rect class="rb" x="6" y="160" width="128" height="130" rx="5"/>
<circle class="sh" cx="22" cy="178" r="11"/><text class="i c" x="22" y="183" >1</text>
<text class="s" x="38" y="183" >Départ</text>
<text class="m" x="14" y="206" >Au démarrage</text>
<text class="t" x="14" y="228" >name +</text>
<text class="t" x="14" y="245" >description</text>
<text class="a" x="14" y="268" >≈ 100 tokens</text>
<text class="m" x="14" y="285" >valeur indicative</text>
<rect class="dif" x="136" y="110" width="128" height="180" rx="5"/>
<circle class="sh" cx="152" cy="128" r="11"/><text class="i c" x="152" y="133" >2</text>
<text class="s" x="168" y="133" >Tâche</text>
<text class="m" x="144" y="156" >La tâche correspond</text>
<text class="t" x="144" y="178" >SKILL.md</text>
<text class="t" x="144" y="195" >complet</text>
<text class="a" x="144" y="218" >< 5 000 tokens</text>
<text class="m" x="144" y="235" >(< 500 lignes)</text>
<rect class="rb" x="266" y="60" width="128" height="230" rx="5"/>
<circle class="sh" cx="282" cy="78" r="11"/><text class="i c" x="282" y="83" >3</text>
<text class="s" x="298" y="83" >Besoin</text>
<text class="m" x="274" y="106" >Au besoin</text>
<text class="t" x="274" y="128" >references,</text>
<text class="t" x="274" y="145" >scripts,</text>
<text class="t" x="274" y="162" >assets</text>
<text class="a" x="274" y="185" >à la demande</text>
<text class="m" x="10" y="312" >Valeurs recommandées par la spécification,</text>
<text class="m" x="10" y="328" >pas des mesures.</text>
<text class="m" x="10" y="348" >Sources : spécification Agent Skills ; Anthropic.</text>
</g>
</svg>
