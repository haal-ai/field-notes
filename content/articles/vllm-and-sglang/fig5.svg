<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 708" role="img" aria-labelledby="fig5-t fig5-d">
<title id="fig5-t">Deux bancs d'essai qui ne s'accordent pas : Winder.ai et ZenML</title>
<desc id="fig5-d">Deux tests indépendants qui ne s'accordent pas sur Qwen3.8-27B. Winder.ai : sur Llama 3.1 8B les deux serveurs sont proches (50 requêtes : vLLM 3 688, SGLang 3 617 tokens par seconde) ; sur Qwen3.8-27B SGLang 1 725 contre vLLM 1 610. ZenML : SGLang atteint 0,53 fois le throughput de vLLM par défaut et 0,84 fois avec le cache radix désactivé.</desc>
<style>
.fig5{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
