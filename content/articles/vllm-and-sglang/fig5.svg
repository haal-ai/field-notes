<text class="m" x="10" y="664">réglé</text>
<rect class="sh" x="84" y="636" width="186.5" height="22"/><text class="t" x="276.5" y="652">0,84 ×</text>
<text class="m" x="10" y="684">Réglé : cache radix désactivé.</text>
