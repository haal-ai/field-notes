<text class="m" x="10" y="404">SGLang</text><rect class="sh" x="84" y="390" width="217.7" height="18"/><text class="t" x="307.7" y="404">3 617</text>
<text class="s" x="10" y="426">Qwen3.8-27B, FP8, 50 requêtes</text>

<text class="m" x="10" y="452">vLLM</text><rect class="bar" x="84" y="438" width="207.2" height="18"/><text class="t" x="297.2" y="452">1 610</text>
<text class="m" x="10" y="474">SGLang</text><rect class="sh" x="84" y="460" width="222.0" height="18"/><text class="t" x="312.0" y="474">1 725</text>
<line class="sep" x1="0" x2="400" y1="492" y2="492"/>
<text class="h" x="10" y="518">ZenML [11]</text><text class="m" x="10" y="536">H100 · vLLM 0.31.0 · SGLang 0.5.20 · Qwen3.8-27B</text><text class="m" x="10" y="553">Throughput par rapport à vLLM (vLLM = 1)</text>
<text class="m" x="10" y="580">vLLM</text>
<rect class="bar" x="84" y="566" width="222" height="22"/><text class="t" x="312" y="582">1</text>
