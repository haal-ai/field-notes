<text class="m" x="10" y="260">SGLang</text><rect class="sh" x="84" y="246" width="9.3" height="18"/><text class="t" x="99.3" y="260">154</text>
<text class="s" x="10" y="288">10 requêtes</text>
<text class="m" x="10" y="310">vLLM</text><rect class="bar" x="84" y="296" width="74.3" height="18"/><text class="t" x="164.3" y="310">1 235</text>
<text class="m" x="10" y="332">SGLang</text><rect class="sh" x="84" y="318" width="74.2" height="18"/><text class="t" x="164.2" y="332">1 233</text>
<text class="s" x="10" y="360">50 requêtes</text>
