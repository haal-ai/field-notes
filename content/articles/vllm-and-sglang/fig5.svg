<defs><pattern id="fig5-hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatl" x1="0" y1="0" x2="0" y2="6"/></pattern></defs>
<g class="fig5">
<text class="h" x="10" y="18">Deux bancs d'essai, deux conclusions</text>
<rect class="dif" x="6" y="28" width="388" height="50" rx="5"/><text class="k" x="15" y="49">Pas un classement : réglages différents.</text><text class="t" x="15" y="68">Échelle propre à chaque groupe.</text>
<rect class="bar" x="10" y="90" width="18" height="12"/><text class="t" x="34" y="101">vLLM (bordure)</text><rect class="sh" x="150" y="90" width="18" height="12"/><text class="t" x="174" y="101">SGLang (plein)</text>
<text class="h" x="10" y="132">Winder.ai [10]</text><text class="m" x="10" y="150">H100 80 Go · vLLM 0.30.0 · SGLang 0.5.20</text><text class="m" x="10" y="167">Tokens de sortie par seconde</text>
