<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Le KV cache : seulement 20,4 % à 38,2 % de la mémoire utile dans d'anciens serveurs</title>
<desc id="fig2-d">Dans d'anciens serveurs, 20,4 % à 38,2 % seulement de la mémoire du KV cache contenaient de vraies données. Le reste était réservé sans usage ou en trous.</desc>
<style>
.fig2{--f-text:#152a34;--f-muted:#506571;--f-accent:#146b5c;--f-ink:#e6f7f2;--f-surface:#edf2f4;--f-raised:#e4ecef;--f-line:#b9cbd2;--f-news:#785413;--f-newsbg:#faf0db}
@media (prefers-color-scheme:dark){.fig2{--f-text:#e5ecee;--f-muted:#a0b0ba;--f-accent:#79d8c4;--f-ink:#0e2421;--f-surface:#131d25;--f-raised:#192630;--f-line:#30404c;--f-news:#edc77c;--f-newsbg:#30291c}}
.fig2 text{font-family:system-ui,sans-serif;font-size:13px}
.fig2 .h{fill:var(--text,var(--f-text));font-size:15px;font-weight:700}
.fig2 .s{fill:var(--text,var(--f-text));font-weight:600}
.fig2 .t{fill:var(--text,var(--f-text))}
.fig2 .m{fill:var(--muted,var(--f-muted))}
.fig2 .a{fill:var(--accent,var(--f-accent));font-weight:700}
.fig2 .j{fill:var(--accent-ink,var(--f-ink))}
.fig2 .k{fill:var(--news,var(--f-news));font-weight:700}
.fig2 .i{fill:var(--accent-ink,var(--f-ink));font-weight:700}
.fig2 .box{fill:var(--surface,var(--f-surface));stroke:var(--line,var(--f-line));stroke-width:1}
.fig2 .bar{fill:var(--raised,var(--f-raised));stroke:var(--text,var(--f-text));stroke-width:1}
.fig2 .sh{fill:var(--accent,var(--f-accent));stroke:var(--accent,var(--f-accent));stroke-width:1}
.fig2 .dif{fill:var(--news-bg,var(--f-newsbg));stroke:var(--news,var(--f-news));stroke-width:2}
.fig2 .ln{stroke:var(--accent,var(--f-accent));stroke-width:1.5;fill:none}
.fig2 .hat{stroke:var(--muted,var(--f-muted));stroke-width:1}
.fig2 .hatl{stroke:var(--muted,var(--f-muted));stroke-width:1}
.fig2 .sep{stroke:var(--line,var(--f-line));stroke-width:1;stroke-dasharray:4 3}
.fig2 .c{text-anchor:middle}.fig2 .e{text-anchor:end}
</style>
<defs><pattern id="fig2-hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatl" x1="0" y1="0" x2="0" y2="6"/></pattern></defs>
<g class="fig2">
<text class="h" x="10" y="18">Le KV cache remplit la mémoire GPU</text>
<text class="m" x="10" y="40">Part de la mémoire du cache qui contient</text><text class="m" x="10" y="57">de vraies données, dans d'anciens serveurs</text>
<text class="m" x="10" y="86">Moins bon cas observé</text><rect class="sh" x="10" y="93" width="77.5" height="28"/><rect class="hat" fill="url(#fig2-hat)" x="87.5" y="93" width="302.5" height="28"/><text class="i" x="18" y="112">20,4 %</text><text class="t e" x="382" y="112">non utilisé</text>
<text class="m" x="10" y="146">Meilleur cas observé</text><rect class="sh" x="10" y="153" width="145.2" height="28"/><rect class="hat" fill="url(#fig2-hat)" x="155.2" y="153" width="234.8" height="28"/><text class="i" x="18" y="172">38,2 %</text><text class="t e" x="382" y="172">non utilisé</text>
<rect class="sh" x="10" y="198" width="16" height="12"/><text class="t" x="32" y="209">Données utiles</text><rect class="hat" fill="url(#fig2-hat)" x="170" y="198" width="16" height="12"/><text class="t" x="192" y="209">Réservé, vide ou en trous</text>
<text class="m" x="10" y="236">Mesure des auteurs de l'article vLLM [3].</text>
</g>
</svg>
