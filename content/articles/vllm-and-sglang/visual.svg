<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1100" role="img" aria-labelledby="vs-t vs-d" aria-label="How an inference server batches requests and reuses cached prompt prefixes: vLLM blocks compared with SGLang radix tree">
<title id="vs-t">Inference server: batching and prefix reuse, vLLM compared with SGLang</title>
<desc id="vs-d">Panel 1: one request goes through five steps; only step 3, finding reusable KV cache, differs between the two servers. Panel 2: after each forward step finished requests leave the batch and waiting ones join. Panel 3: three requests share one prompt start. vLLM stores the cache in hashed fixed-size blocks and reuses matching full blocks. SGLang keeps the shared start once in a radix tree and each request adds a branch.</desc>
<style>
.h{fill:var(--text);font:700 15px system-ui,sans-serif}
.s{fill:var(--text);font:600 14px system-ui,sans-serif}
.t{fill:var(--text);font:13px system-ui,sans-serif}
.m{fill:var(--muted);font:13px system-ui,sans-serif}
.a{fill:var(--accent);font:700 14px system-ui,sans-serif}
.box{fill:var(--surface);stroke:var(--line);stroke-width:1}
.bar{fill:var(--raised);stroke:var(--line);stroke-width:1}
.sh{fill:var(--accent);stroke:var(--accent);stroke-width:1}
.shl{fill:var(--accent-ink);font:700 12px ui-monospace,monospace;text-anchor:middle}
.dif{fill:var(--news-bg);stroke:var(--news);stroke-width:2}
.dift{fill:var(--news);font:700 12px system-ui,sans-serif}
.ln{stroke:var(--accent);stroke-width:1.5;fill:none}
.sep{stroke:var(--line);stroke-width:1;stroke-dasharray:4 3}
.c{text-anchor:middle}
</style>

<!-- Panel 1: request path -->
<text class="h" x="10" y="24">1  One request, five steps</text>
<rect class="box" x="6" y="36" width="388" height="28" rx="4"/><text class="t" x="16" y="55">1  Request arrives over HTTP</text>
<rect class="box" x="6" y="70" width="388" height="28" rx="4"/><text class="t" x="16" y="89">2  Text becomes tokens</text>
<rect class="dif" x="6" y="104" width="388" height="82" rx="4"/>
<text class="t" x="16" y="123">3  Find KV cache that can be reused</text>
<text class="dift" x="384" y="123" text-anchor="end">DIFFERS</text>
<text class="s" x="16" y="147">vLLM</text><text class="t" x="88" y="147">match hashed full blocks</text>
<text class="s" x="16" y="171">SGLang</text><text class="t" x="88" y="171">match prefix in a radix tree</text>
<rect class="box" x="6" y="192" width="388" height="28" rx="4"/><text class="t" x="16" y="211">4  Compute only the part not cached</text>
<rect class="box" x="6" y="226" width="388" height="44" rx="4"/><text class="t" x="16" y="245">5  Send one token at a time; the batch is</text><text class="t" x="16" y="262">    refilled after every step (panel 2)</text>

<!-- Panel 2: batching -->
<g transform="translate(0,290)">
<line class="sep" x1="0" x2="400" y1="0" y2="0"/>
<text class="h" x="10" y="28">2  Batching: refill after every step</text>
<text class="m" x="10" y="48">After each forward step, finished requests leave</text>
<text class="m" x="10" y="64">and waiting requests join (continuous batching).</text>
<text class="m c" x="110" y="92">step 1</text><text class="m c" x="190" y="92">step 2</text><text class="m c" x="270" y="92">step 3</text><text class="m c" x="350" y="92">step 4</text>
<text class="m" x="10" y="121">slot 1</text><text class="m" x="10" y="161">slot 2</text><text class="m" x="10" y="201">slot 3</text>
<rect class="bar" x="72" y="100" width="156" height="32" rx="4"/><text class="t" x="82" y="121">request A</text>
<rect class="sh" x="232" y="100" width="156" height="32" rx="4"/><text class="shl" x="310" y="121" style="font-size:13px">D joins</text>
<rect class="bar" x="72" y="140" width="316" height="32" rx="4"/><text class="t" x="82" y="161">request B</text>
<rect class="bar" x="72" y="180" width="236" height="32" rx="4"/><text class="t" x="82" y="201">request C</text>
<rect class="sh" x="312" y="180" width="76" height="32" rx="4"/><text class="shl" x="350" y="201" style="font-size:13px">E joins</text>
<text class="m" x="10" y="238">A leaves after step 2, C after step 3. The GPU</text>
<text class="m" x="10" y="254">does not wait for the slowest request.</text>
</g>

<!-- Panel 3: caching -->
<g transform="translate(0,570)">
<line class="sep" x1="0" x2="400" y1="0" y2="0"/>
<text class="h" x="10" y="28">3  Same prompt start, three requests</text>
<text class="m" x="10" y="48">Illustrative example, not measured. Requests 1 to 3</text>
<text class="m" x="10" y="64">begin with the same long system prompt.</text>

<text class="a" x="10" y="94">vLLM: fixed-size blocks</text>
<text class="m" x="10" y="112">The cache sits in blocks, like OS memory pages.</text>
<text class="m" x="10" y="128">Each full block is hashed from its tokens and</text>
<text class="m" x="10" y="144">its parent block's hash. Same hash: reuse.</text>
<text class="s" x="10" y="172">req 1</text><text class="s" x="10" y="204">req 2</text><text class="s" x="10" y="236">req 3</text>
<g>
<rect class="sh" x="62" y="154" width="52" height="26" rx="3"/><text class="shl" x="88" y="171">B1</text>
<rect class="sh" x="118" y="154" width="52" height="26" rx="3"/><text class="shl" x="144" y="171">B2</text>
<rect class="sh" x="174" y="154" width="52" height="26" rx="3"/><text class="shl" x="200" y="171">B3</text>
<rect class="bar" x="230" y="154" width="60" height="26" rx="3"/><text class="t c" x="260" y="171">own</text>
<text class="t" x="298" y="171">computes</text>
<rect class="sh" x="62" y="186" width="52" height="26" rx="3"/><text class="shl" x="88" y="203">B1</text>
<rect class="sh" x="118" y="186" width="52" height="26" rx="3"/><text class="shl" x="144" y="203">B2</text>
<rect class="sh" x="174" y="186" width="52" height="26" rx="3"/><text class="shl" x="200" y="203">B3</text>
<rect class="bar" x="230" y="186" width="60" height="26" rx="3"/><text class="t c" x="260" y="203">own</text>
<text class="t" x="298" y="203">reuses</text>
<rect class="sh" x="62" y="218" width="52" height="26" rx="3"/><text class="shl" x="88" y="235">B1</text>
<rect class="sh" x="118" y="218" width="52" height="26" rx="3"/><text class="shl" x="144" y="235">B2</text>
<rect class="sh" x="174" y="218" width="52" height="26" rx="3"/><text class="shl" x="200" y="235">B3</text>
<rect class="bar" x="230" y="218" width="60" height="26" rx="3"/><text class="t c" x="260" y="235">own</text>
<text class="t" x="298" y="235">reuses</text>
</g>
<text class="m" x="10" y="266">A per-request cache_salt keeps users' caches apart.</text>

<line class="sep" x1="0" x2="400" y1="284" y2="284"/>
<text class="a" x="10" y="312">SGLang: radix tree of prefixes</text>
<text class="m" x="10" y="330">RadixAttention keeps the cache of shared prefixes</text>
<text class="m" x="10" y="346">in a tree. A matching request reuses it.</text>
<path class="ln" d="M60 411H72M192 411H212M212 371V451M212 371H232M212 411H232M212 451H232"/>
<rect class="bar" x="10" y="395" width="50" height="32" rx="4"/><text class="t c" x="35" y="415">root</text>
<rect class="sh" x="72" y="395" width="120" height="32" rx="4"/><text class="shl" x="132" y="415" style="font-size:13px">shared prompt</text>
<rect class="bar" x="232" y="358" width="70" height="26" rx="3"/><text class="t c" x="267" y="375">req 1</text>
<rect class="bar" x="232" y="398" width="70" height="26" rx="3"/><text class="t c" x="267" y="415">req 2</text>
<rect class="bar" x="232" y="438" width="70" height="26" rx="3"/><text class="t c" x="267" y="455">req 3</text>
<text class="t" x="310" y="415">own branch</text>
<text class="m" x="10" y="490">One stored copy of the shared start; each request</text>
<text class="m" x="10" y="506">adds a branch.</text>
</g>
</svg>
