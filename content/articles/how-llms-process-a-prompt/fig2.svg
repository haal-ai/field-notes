<path d="M492 212L486.7 202.3" class="ln" style="stroke-width:6"/>
<rect x="20" y="214" width="96" height="32" rx="4" class="tok"/>
<text x="68.0" y="236.0" class="m" text-anchor="middle">K</text>
<rect x="20" y="256" width="96" height="32" rx="4" class="old"/>
<text x="68.0" y="278.0" class="mi" text-anchor="middle">V</text>
<rect x="126" y="214" width="96" height="32" rx="4" class="tok"/>
<text x="174.0" y="236.0" class="m" text-anchor="middle">K</text>
<rect x="126" y="256" width="96" height="32" rx="4" class="old"/>
<text x="174.0" y="278.0" class="mi" text-anchor="middle">V</text>
<rect x="232" y="214" width="96" height="32" rx="4" class="tok"/>
<text x="280.0" y="236.0" class="m" text-anchor="middle">K</text>
<rect x="232" y="256" width="96" height="32" rx="4" class="old"/>
<text x="280.0" y="278.0" class="mi" text-anchor="middle">V</text>
<rect x="338" y="214" width="96" height="32" rx="4" class="tok"/>
<text x="386.0" y="236.0" class="m" text-anchor="middle">K</text>
<rect x="338" y="256" width="96" height="32" rx="4" class="old"/>
<text x="386.0" y="278.0" class="mi" text-anchor="middle">V</text>
<rect x="444" y="214" width="96" height="32" rx="4" class="tok"/>
<text x="492.0" y="236.0" class="m" text-anchor="middle">K</text>
<rect x="444" y="256" width="96" height="32" rx="4" class="old"/>
<text x="492.0" y="278.0" class="mi" text-anchor="middle">V</text>
<text x="20" y="318" class="sb" text-anchor="start">attention weights</text>
<rect x="20" y="328" width="24" height="16" rx="3" class="old"/>
<rect x="126" y="328" width="14" height="16" rx="3" class="old"/>
<rect x="232" y="328" width="6" height="16" rx="3" class="old"/>
<rect x="338" y="328" width="48" height="16" rx="3" class="old"/>
<rect x="444" y="328" width="96" height="16" rx="3" class="old"/>
<text x="20" y="366" class="s" text-anchor="start">Les attention weights sont qualitatifs : plus la barre est longue,</text>
<text x="20" y="388" class="s" text-anchor="start">plus la flèche est épaisse et plus le token compte.</text>
<path d="M280 396L280 430" class="ln"/>
<path d="M280 430L284.3 422.1" class="ln"/>
<path d="M280 430L275.7 422.1" class="ln"/>
<text x="296" y="420" class="s" text-anchor="start">mélange des V pondéré</text>
<rect x="20" y="436" width="520" height="40" rx="4" class="tokn"/>
<text x="280.0" y="462.0" class="m" text-anchor="middle">nouveau vecteur de « is »</text>
<text x="20" y="510" class="sb" text-anchor="start">Query Q : ce que je cherche</text>
<text x="20" y="534" class="sb" text-anchor="start">Key K : ce que je propose</text>
<text x="20" y="558" class="sb" text-anchor="start">Value V : le contenu à transmettre</text>
<rect x="10" y="598" width="540" height="186" rx="6" class="panel"/>
<text x="24" y="626" class="st" text-anchor="start">Une attention head = une copie indépendante de cette</text>
<text x="24" y="650" class="st" text-anchor="start">comparaison, avec ses propres Q, K, V.</text>
<text x="24" y="678" class="st" text-anchor="start">Son couple K, V s'appelle ici KV head. Un modèle</text>
<text x="24" y="702" class="st" text-anchor="start">exécute plusieurs têtes en parallèle.</text>
<text x="24" y="730" class="st" text-anchor="start">Le modèle empile des couches ; un token les traverse toutes,</text>
<text x="24" y="754" class="st" text-anchor="start">l'une après l'autre.</text>
</svg>
