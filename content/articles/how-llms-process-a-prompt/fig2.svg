<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 792" role="img" aria-labelledby="fig2-t fig2-d">
<title id="fig2-t">Attention : un token compare sa query Q aux keys K, puis mélange les values V</title><desc id="fig2-d">Exemple illustratif. Cinq tokens en ligne : The, capital, of, France, is. Le dernier, « is », produit une query Q. Chaque token, y compris « is », porte une key K et une value V. Des flèches partent de Q vers les cinq keys ; leur épaisseur, et des barres d'attention weights, montrent des attention weights qualitatifs, sans chiffres. Les values V sont mélangées selon ces attention weights, ce qui donne le nouveau vecteur de « is ». Un encadré explique qu'une attention head est une copie indépendante de la comparaison, et que le modèle empile des couches.</desc>
<style>
svg{--c-bg:#f7f9fa;--c-surface:#edf2f4;--c-text:#152a34;--c-muted:#506571;--c-line:#b9cbd2;--c-accent:#146b5c;--c-ink:#e6f7f2;--c-warn:#865025}
@media(prefers-color-scheme:dark){svg{--c-bg:#0e1419;--c-surface:#131d25;--c-text:#e5ecee;--c-muted:#a0b0ba;--c-line:#30404c;--c-accent:#79d8c4;--c-ink:#0e2421;--c-warn:#edbd91}}
.panel{fill:var(--surface,var(--c-surface));stroke:var(--line,var(--c-line));stroke-width:1}
.tok{fill:var(--bg,var(--c-bg));stroke:var(--text,var(--c-text));stroke-width:1.5}
.tokn{fill:var(--bg,var(--c-bg));stroke:var(--accent,var(--c-accent));stroke-width:3}
.old{fill:var(--accent,var(--c-accent));stroke:var(--accent,var(--c-accent))}
.new{fill:var(--bg,var(--c-bg));stroke:var(--accent,var(--c-accent));stroke-width:3}
.fut{fill:none;stroke:var(--muted,var(--c-muted));stroke-width:1.5;stroke-dasharray:5 4}
.bad{fill:none;stroke:var(--warn,var(--c-warn));stroke-width:2;stroke-dasharray:3 3}
.pill{fill:var(--bg,var(--c-bg));stroke:var(--muted,var(--c-muted));stroke-width:1.5;stroke-dasharray:4 3}
.ln{stroke:var(--accent,var(--c-accent));stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lnd{stroke:var(--muted,var(--c-muted));stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.h{fill:var(--text,var(--c-text));font:700 20px system-ui,sans-serif}
.s{fill:var(--muted,var(--c-muted));font:17px system-ui,sans-serif}
.m{fill:var(--text,var(--c-text));font:18px ui-monospace,monospace}
.mi{fill:var(--accent-ink,var(--c-ink));font:700 18px ui-monospace,monospace}
.ma{fill:var(--accent,var(--c-accent));font:700 20px ui-monospace,monospace}
