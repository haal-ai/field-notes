.n{fill:var(--muted,var(--c-muted));font:16px ui-monospace,monospace}
.st{fill:var(--text,var(--c-text));font:17px system-ui,sans-serif}
.sb{fill:var(--text,var(--c-text));font:700 17px system-ui,sans-serif}
.sa{fill:var(--accent,var(--c-accent));font:700 17px system-ui,sans-serif}
</style>
<text x="20" y="28" class="h" text-anchor="start">Attention : « is » regarde les tokens précédents</text>
<rect x="344" y="38" width="196" height="28" rx="14" class="pill"/>
<text x="442" y="58" class="s" text-anchor="middle">exemple illustratif</text>
<rect x="20" y="76" width="96" height="40" rx="4" class="tok"/>
<text x="68.0" y="102.0" class="m" text-anchor="middle">The</text>
<rect x="126" y="76" width="96" height="40" rx="4" class="tok"/>
<text x="174.0" y="102.0" class="m" text-anchor="middle">capital</text>
<rect x="232" y="76" width="96" height="40" rx="4" class="tok"/>
<text x="280.0" y="102.0" class="m" text-anchor="middle">of</text>
<rect x="338" y="76" width="96" height="40" rx="4" class="tok"/>
<text x="386.0" y="102.0" class="m" text-anchor="middle">France</text>
<rect x="444" y="76" width="96" height="40" rx="4" class="tokn"/>
<text x="492.0" y="102.0" class="m" text-anchor="middle">is</text>
<rect x="462" y="136" width="60" height="34" rx="4" class="new"/>
<text x="492.0" y="159.0" class="ma" text-anchor="middle">Q</text>
<text x="20" y="160" class="s" text-anchor="start">Query Q de « is »</text>
