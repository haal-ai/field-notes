<path d="M492 172L280 212" class="ln" style="stroke-width:1"/>
<path d="M280 212L288.6 214.8" class="ln" style="stroke-width:1"/>
<path d="M280 212L287.0 206.3" class="ln" style="stroke-width:1"/>
<path d="M492 172L386 212" class="ln" style="stroke-width:4"/>
<path d="M386 212L396.9 213.5" class="ln" style="stroke-width:4"/>
<path d="M386 212L393.2 203.7" class="ln" style="stroke-width:4"/>
