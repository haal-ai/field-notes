<text x="324" y="342" class="st" text-anchor="start">MQA : un seul jeu K/V</text>
<text x="324" y="364" class="st" text-anchor="start">pour toutes les têtes</text>
<text x="24" y="436" class="st" text-anchor="start">Exemple : 32 → 8 KV heads : 52,4 ÷ 4 = 13,1 Go (figure 4).</text>
<text x="24" y="464" class="st" text-anchor="start">Réserve : demande en général un entraînement ou un ré-</text>
<text x="24" y="488" class="st" text-anchor="start">entraînement.</text>
<text x="24" y="512" class="s" text-anchor="start">Sources : Shazeer (MQA) ; Ainslie et al. (GQA).</text>
<rect x="10" y="542" width="540" height="464" rx="6" class="panel"/>
<text x="24" y="572" class="h" text-anchor="start">2  Ranger par blocs (PagedAttention)</text>
<text x="24" y="600" class="sb" text-anchor="start">Réservation classique : une grande zone par séquence</text>
