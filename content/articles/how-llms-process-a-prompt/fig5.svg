<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1366" role="img" aria-labelledby="fig5-t fig5-d">
<title id="fig5-t">Trois pistes pour réduire ou gérer le cache : partager K et V, ranger par blocs, faire vérifier</title><desc id="fig5-d">Trois panneaux empilés. 1, partager K et V : huit têtes de query Q ; en multi-têtes, une paire K/V par tête ; en GQA, un jeu K/V par groupe (ici 2 groupes de 4) ; en MQA, un seul jeu K/V. Exemple : 32 → 8 KV heads, 52,4 ÷ 4 = 13,1 Go. Réserve : demande en général un entraînement ou ré-entraînement. 2, ranger par blocs (PagedAttention) : à gauche la réservation classique d'une grande zone par séquence, avec espace perdu ; puis des blocs de taille fixe non contigus, avec peu d'espace perdu. Throughput 2 à 4 fois supérieur à latency égale selon les auteurs, sur leur banc d'essai. 3, faire vérifier (speculative decoding) : un petit modèle propose des tokens, le grand modèle les vérifie en parallèle ; même distribution de sortie.</desc>
