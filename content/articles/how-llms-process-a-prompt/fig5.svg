<text x="24" y="846" class="s" text-anchor="start">A (plein) et B (bord épais) : blocs répartis, peu de place</text>
<text x="24" y="868" class="s" text-anchor="start">perdue. « perdu » = espace réservé mais inutilisé.</text>
<text x="24" y="900" class="st" text-anchor="start">Throughput 2 à 4 fois supérieur à latency égale, selon les</text>
<text x="24" y="924" class="st" text-anchor="start">auteurs, face à FasterTransformer et Orca, sur leur banc</text>
<text x="24" y="948" class="st" text-anchor="start">d'essai.</text>
<text x="24" y="972" class="s" text-anchor="start">Source : Kwon et al.</text>
<rect x="10" y="1022" width="540" height="330" rx="6" class="panel"/>
