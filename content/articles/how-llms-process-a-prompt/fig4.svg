<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 822" role="img" aria-labelledby="fig4-t fig4-d">
<title id="fig4-t">Taille du KV cache : 52,4 Go avec 32 KV heads, 13,1 Go avec 8</title><desc id="fig4-d">Exemple chiffré, pas une mesure. Formule en six blocs : 2 (K et V) × 32 couches × 32 KV heads × 128 (taille de tête) × 100 000 tokens × 2 octets par nombre. Par token : 2 × 32 × 32 × 128 × 2 = 524 288 octets, soit environ 0,5 Mo. Pour 100 000 tokens : 52 428 800 000 octets, environ 52,4 Go. Deux barres à l'échelle : attention multi-têtes standard avec 32 KV heads, 52,4 Go (100 %) ; avec 8 KV heads (partage K/V, GQA), 13,1 Go (25 %), soit 4 fois moins. Hypothèses : 16 bits, 1 requête, sans compression, 1 Go = 10⁹ octets.</desc>
<style>
svg{--c-bg:#f7f9fa;--c-surface:#edf2f4;--c-text:#152a34;--c-muted:#506571;--c-line:#b9cbd2;--c-accent:#146b5c;--c-ink:#e6f7f2;--c-warn:#865025}
@media(prefers-color-scheme:dark){svg{--c-bg:#0e1419;--c-surface:#131d25;--c-text:#e5ecee;--c-muted:#a0b0ba;--c-line:#30404c;--c-accent:#79d8c4;--c-ink:#0e2421;--c-warn:#edbd91}}
.panel{fill:var(--surface,var(--c-surface));stroke:var(--line,var(--c-line));stroke-width:1}
.tok{fill:var(--bg,var(--c-bg));stroke:var(--text,var(--c-text));stroke-width:1.5}
.tokn{fill:var(--bg,var(--c-bg));stroke:var(--accent,var(--c-accent));stroke-width:3}
.old{fill:var(--accent,var(--c-accent));stroke:var(--accent,var(--c-accent))}
.new{fill:var(--bg,var(--c-bg));stroke:var(--accent,var(--c-accent));stroke-width:3}
.fut{fill:none;stroke:var(--muted,var(--c-muted));stroke-width:1.5;stroke-dasharray:5 4}
.bad{fill:none;stroke:var(--warn,var(--c-warn));stroke-width:2;stroke-dasharray:3 3}
.pill{fill:var(--bg,var(--c-bg));stroke:var(--muted,var(--c-muted));stroke-width:1.5;stroke-dasharray:4 3}
.ln{stroke:var(--accent,var(--c-accent));stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lnd{stroke:var(--muted,var(--c-muted));stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.h{fill:var(--text,var(--c-text));font:700 20px system-ui,sans-serif}
.s{fill:var(--muted,var(--c-muted));font:17px system-ui,sans-serif}
.m{fill:var(--text,var(--c-text));font:18px ui-monospace,monospace}
.mi{fill:var(--accent-ink,var(--c-ink));font:700 18px ui-monospace,monospace}
.ma{fill:var(--accent,var(--c-accent));font:700 20px ui-monospace,monospace}
.mb{fill:var(--text,var(--c-text));font:700 22px ui-monospace,monospace}
.n{fill:var(--muted,var(--c-muted));font:16px ui-monospace,monospace}
.st{fill:var(--text,var(--c-text));font:17px system-ui,sans-serif}
.sb{fill:var(--text,var(--c-text));font:700 17px system-ui,sans-serif}
.sa{fill:var(--accent,var(--c-accent));font:700 17px system-ui,sans-serif}
</style>
<text x="20" y="28" class="h" text-anchor="start">Taille du KV cache</text>
<text x="20" y="54" class="sa" text-anchor="start">Exemple chiffré, pas une mesure</text>
<text x="20" y="88" class="sb" text-anchor="start">Formule</text>
<rect x="20" y="100" width="156" height="76" rx="4" class="tok"/>
<text x="98" y="134" class="mb" text-anchor="middle">2</text>
<text x="98" y="160" class="st" text-anchor="middle">K et V</text>
<text x="189" y="144" class="h" text-anchor="middle">×</text>
<rect x="202" y="100" width="156" height="76" rx="4" class="tok"/>
<text x="280" y="134" class="mb" text-anchor="middle">32</text>
<text x="280" y="160" class="st" text-anchor="middle">couches</text>
<text x="371" y="144" class="h" text-anchor="middle">×</text>
<rect x="384" y="100" width="156" height="76" rx="4" class="tok"/>
<text x="462" y="134" class="mb" text-anchor="middle">32</text>
<text x="462" y="160" class="st" text-anchor="middle">KV heads</text>
<rect x="20" y="192" width="156" height="76" rx="4" class="tok"/>
<text x="98" y="226" class="mb" text-anchor="middle">128</text>
<text x="98" y="252" class="st" text-anchor="middle">taille de tête</text>
<text x="189" y="236" class="h" text-anchor="middle">×</text>
<rect x="202" y="192" width="156" height="76" rx="4" class="tok"/>
<text x="280" y="226" class="mb" text-anchor="middle">100 000</text>
<text x="280" y="252" class="st" text-anchor="middle">tokens</text>
<text x="371" y="236" class="h" text-anchor="middle">×</text>
<rect x="384" y="192" width="156" height="76" rx="4" class="tok"/>
<text x="462" y="226" class="mb" text-anchor="middle">2</text>
<text x="462" y="252" class="st" text-anchor="middle">octets par nombre</text>
<text x="20" y="296" class="sb" text-anchor="start">Par token :</text>
<text x="20" y="322" class="st" text-anchor="start">2 × 32 × 32 × 128 × 2 = 524 288 octets (≈ 0,5 Mo)</text>
<text x="20" y="356" class="sb" text-anchor="start">Pour 100 000 tokens :</text>
<text x="20" y="382" class="st" text-anchor="start">524 288 × 100 000 = 52 428 800 000 octets</text>
<text x="20" y="408" class="ma" text-anchor="start">≈ 52,4 Go</text>
<text x="20" y="444" class="sb" text-anchor="start">Attention multi-têtes standard : 32 KV heads</text>
<rect x="20" y="456" width="500" height="36" rx="3" class="old"/>
<text x="30" y="481" class="mi" text-anchor="start">52,4 Go</text>
<text x="20" y="528" class="sb" text-anchor="start">Avec 8 KV heads (partage K/V, GQA)</text>
<rect x="20" y="540" width="125" height="36" rx="3" class="old"/>
<text x="155" y="565" class="ma" text-anchor="start">13,1 Go</text>
<rect x="145" y="540" width="375" height="36" rx="3" class="fut"/>
<text x="330" y="565" class="sb" text-anchor="middle">4 fois moins</text>
<text x="20" y="604" class="s" text-anchor="start">Longueur des barres : 100 % et 25 %.</text>
<text x="20" y="628" class="s" text-anchor="start">Contrôle : 52 428 800 000 ÷ 4 = 13 107 200 000 octets ≈ 13,1 Go.</text>
<text x="20" y="666" class="st" text-anchor="start">Hypothèses : attention multi-têtes standard, 16 bits, 1</text>
<text x="20" y="690" class="st" text-anchor="start">requête, sans compression ; 1 Go = 10⁹ octets.</text>
<text x="20" y="718" class="st" text-anchor="start">Une seule longue requête peut dépasser la mémoire d'un petit</text>
<text x="20" y="742" class="st" text-anchor="start">GPU, avant le surcoût des moteurs réels.</text>
<text x="20" y="770" class="s" text-anchor="start">Sources : NVIDIA (Mastering LLM Techniques: Inference</text>
<text x="20" y="794" class="s" text-anchor="start">Optimization) ; Ainslie et al. (GQA).</text>
</svg>
