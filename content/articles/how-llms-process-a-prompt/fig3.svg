<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1216" role="img" aria-labelledby="fig3-t fig3-d">
<title id="fig3-t">Prefill, decoding et KV cache : le cache grandit d'une cellule par couche et par étape</title><desc id="fig3-d">Schéma en deux panneaux. Prompt « The capital of France is » découpé en 5 tokens (exemple illustratif), qui entrent ensemble. Panneau 1, prefill, une seule fois : tous les tokens en parallèle, surtout limité par le calcul ; le délai avant le premier token (TTFT) est surtout le prefill. Chaque couche (1, 2, … N) stocke une cellule K/V par token : les cellules 1 à 5 sont remplies. La dernière position donne des logits, un score par token du vocabulaire ; une règle de sélection choisit le premier token, « Paris » (exemple). Panneau 2, decoding, un token par étape en boucle : souvent limité par la mémoire ; la latency entre tokens est surtout une étape. « Paris » est la seule nouvelle entrée ; les cellules 1 à 5 sont réutilisées, la cellule 6 est ajoutée par couche, l'attention porte sur 1 à 6. L'étape 2 ajoute la cellule 7. Une flèche en pointillés ramène à l'entrée. Légende : cellule pleine = stockée ; bord épais avec « + » = ajoutée à cette étape ; pointillés = vide, plus tard.</desc>
<style>
