<text x="492.0" y="338.0" class="m" text-anchor="middle">ID 5</text>
<path d="M280 354L280 392" class="ln"/>
<path d="M280 392L284.3 384.1" class="ln"/>
<path d="M280 392L275.7 384.1" class="ln"/>
<text x="296" y="380" class="s" text-anchor="start">embedding</text>
<text x="20" y="418" class="sb" text-anchor="start">Vecteurs (embeddings)</text>
<rect x="20" y="428" width="96" height="110" rx="4" class="tokn"/>
<text x="68" y="452" class="ma" text-anchor="middle">[ … ]</text>
