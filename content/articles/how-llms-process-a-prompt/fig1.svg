<text x="68.0" y="527.0" class="mi" text-anchor="middle"></text>
<text x="68" y="526" class="mi" text-anchor="middle">…</text>
<rect x="126" y="428" width="96" height="110" rx="4" class="tokn"/>
<text x="174" y="452" class="ma" text-anchor="middle">[ … ]</text>
