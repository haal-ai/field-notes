<rect x="344" y="10" width="196" height="28" rx="14" class="pill"/>
<text x="442" y="30" class="s" text-anchor="middle">exemple illustratif</text>
<text x="20" y="66" class="sb" text-anchor="start">Texte (prompt)</text>
<rect x="20" y="76" width="520" height="44" rx="4" class="tok"/>
<text x="280.0" y="104.0" class="m" text-anchor="middle">The capital of France is</text>
<path d="M280 122L280 160" class="ln"/>
<path d="M280 160L284.3 152.1" class="ln"/>
<path d="M280 160L275.7 152.1" class="ln"/>
<text x="296" y="148" class="s" text-anchor="start">tokenizer</text>
<text x="20" y="186" class="sb" text-anchor="start">Tokens</text>
<rect x="20" y="196" width="96" height="40" rx="4" class="tok"/>
<text x="68.0" y="222.0" class="m" text-anchor="middle">The</text>
<rect x="126" y="196" width="96" height="40" rx="4" class="tok"/>
<text x="174.0" y="222.0" class="m" text-anchor="middle">capital</text>
<rect x="232" y="196" width="96" height="40" rx="4" class="tok"/>
<text x="280.0" y="222.0" class="m" text-anchor="middle">of</text>
<rect x="338" y="196" width="96" height="40" rx="4" class="tok"/>
<text x="386.0" y="222.0" class="m" text-anchor="middle">France</text>
<rect x="444" y="196" width="96" height="40" rx="4" class="tok"/>
<text x="492.0" y="222.0" class="m" text-anchor="middle">is</text>
<path d="M280 238L280 276" class="ln"/>
