<text x="20" y="574" class="st" text-anchor="start">Chaque token reçoit un identifiant entier. Le vecteur est une</text>
<text x="20" y="598" class="st" text-anchor="start">liste de nombres : un embedding. Le modèle calcule</text>
<text x="20" y="622" class="st" text-anchor="start">avec ces vecteurs.</text>
<text x="20" y="650" class="s" text-anchor="start">Le découpage réel dépend du tokenizer. Les identifiants et</text>
<text x="20" y="674" class="s" text-anchor="start">les vecteurs sont dessinés sans valeurs.</text>
</svg>
