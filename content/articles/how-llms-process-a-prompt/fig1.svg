<text x="280" y="452" class="ma" text-anchor="middle">[ … ]</text>
<rect x="246" y="464" width="68" height="18" rx="3" class="old"/>
<text x="280.0" y="479.0" class="mi" text-anchor="middle"></text>
<text x="280" y="478" class="mi" text-anchor="middle">…</text>
<rect x="246" y="488" width="68" height="18" rx="3" class="old"/>
<text x="280.0" y="503.0" class="mi" text-anchor="middle"></text>
<text x="280" y="502" class="mi" text-anchor="middle">…</text>
<rect x="246" y="512" width="68" height="18" rx="3" class="old"/>
<text x="280.0" y="527.0" class="mi" text-anchor="middle"></text>
<text x="280" y="526" class="mi" text-anchor="middle">…</text>
<rect x="338" y="428" width="96" height="110" rx="4" class="tokn"/>
<text x="386" y="452" class="ma" text-anchor="middle">[ … ]</text>
<rect x="352" y="464" width="68" height="18" rx="3" class="old"/>
<text x="386.0" y="479.0" class="mi" text-anchor="middle"></text>
<text x="386" y="478" class="mi" text-anchor="middle">…</text>
